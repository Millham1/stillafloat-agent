kind = "web"
previewPath = "/dashboard/"
title = "Editorial Dashboard"
version = "1.0.0"
id = "artifacts/still-afloat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/dashboard/"]
localPort = 18336

[services.development]
run = "pnpm --filter @workspace/still-afloat run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/still-afloat", "run", "build"]
publicDir = "artifacts/still-afloat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/dashboard/*"
to = "/index.html"

[services.env]
PORT = "18336"
BASE_PATH = "/dashboard/"
