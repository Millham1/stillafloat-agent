<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commentary | Still Afloat</title>
<meta name="description" content="Mark Millham's personal cruise commentary — Still Afloat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#ffca4f;--blue:#4fc3ff;--seafoam:#5dff9a;--navy:#07183f}
body{font-family:'Baloo 2',sans-serif;min-height:100vh;overflow-x:hidden;color:#fff;background:#060f1e}

/* ── Post hero ── */
.post-hero{position:relative;min-height:280px;display:flex;align-items:flex-end;overflow:hidden;border-bottom:3px solid rgba(93,255,154,.18)}
.post-hero-bg{position:absolute;inset:0;background:linear-gradient(to right,rgba(4,10,22,1) 0%,rgba(4,10,22,.95) 40%,rgba(4,10,22,.65) 65%,rgba(4,10,22,.22) 100%),url('/assets/images/Tropical beach with palm trees and ship.png') right center/cover no-repeat;background-color:#060f1e}
.post-hero-content{position:relative;z-index:2;max-width:820px;width:100%;padding:60px 40px 44px}

.eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:800;opacity:.85;margin-bottom:8px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#4fc3ff;font-size:.78rem;font-weight:800;text-decoration:none;letter-spacing:.08em;text-transform:uppercase;opacity:.85;transition:opacity .2s;margin-bottom:16px}
.back-link:hover{opacity:1}
.post-title{font-family:Pacifico,cursive;font-size:clamp(2rem,5vw,3.2rem);line-height:1.18;background:linear-gradient(90deg,#ffca4f,#4fc3ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:14px}
.post-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.post-date{font-size:.75rem;letter-spacing:.12em;color:rgba(255,202,79,.85);text-transform:uppercase;font-weight:700}
.post-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 10px;border-radius:30px;background:rgba(93,255,154,.12);border:1px solid rgba(93,255,154,.28);color:#5dff9a;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* ── Hero image (below hero, above body) ── */
.post-image-wrap{width:100%;max-height:420px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.post-image{width:100%;max-height:420px;object-fit:cover;object-position:center;display:block}

/* ── YouTube embed ── */
.video-wrap{max-width:720px;margin:0 auto;padding:36px 28px 0}
.video-container{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:18px;background:#000;box-shadow:0 24px 60px rgba(0,0,0,.50);border:1px solid rgba(255,255,255,.12)}
.video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:18px}
.video-label{text-align:center;margin-top:12px;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.38);font-weight:700}

/* ── Article body ── */
.article-shell{max-width:720px;margin:auto;padding:36px 28px 72px}
.article-body p{font-size:1.05rem;line-height:1.80;color:rgba(255,255,255,.88);margin-bottom:22px}
.article-body p:last-child{margin-bottom:0}

/* ── Transcript divider (when video present) ── */
.transcript-divider{display:flex;align-items:center;gap:12px;margin-bottom:24px;color:rgba(255,255,255,.35);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.transcript-divider::before,.transcript-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.12)}

/* ── Bottom nav ── */
.bottom-nav{border-top:1px solid rgba(255,255,255,.10);padding-top:28px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.bottom-link{display:inline-flex;align-items:center;gap:6px;color:#4fc3ff;font-size:.82rem;font-weight:800;text-decoration:none;letter-spacing:.08em;text-transform:uppercase;opacity:.85;transition:opacity .2s}
.bottom-link:hover{opacity:1}
.bottom-share{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.45);font-size:.78rem}

/* ── State ── */
.state-box{text-align:center;padding:80px 20px;color:rgba(255,255,255,.45)}
.state-box i{font-size:48px;margin-bottom:16px;display:block;color:rgba(93,255,154,.35)}

footer{text-align:center;padding:28px 20px;color:rgba(255,255,255,.38);font-size:.78rem;border-top:1px solid rgba(255,255,255,.07)}

@media(max-width:600px){
  .post-hero-content{padding:28px 18px 24px}
  .video-wrap{padding:24px 16px 0}
  .article-shell{padding:28px 16px 52px}
}
</style>
</head>
<body>

<section class="post-hero" id="top">
  <div class="post-hero-bg"></div>
  <div id="navbar-container"></div>
  <div class="post-hero-content" id="post-hero-inner">
    <div class="state-box" style="padding:32px 0"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:28px;margin-bottom:0"></i></div>
  </div>
</section>

<div id="post-image-section"></div>
<div id="video-section"></div>

<main class="article-shell">
  <div id="article-body">
    <div class="state-box"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Loading…</p></div>
  </div>
</main>

<footer>
  <p>© 2026 Still Afloat LLC — Cruise smarter. Laugh more. <img src="/assets/images/stay-afloat-text.png" alt="Stay Afloat" style="height:20px;vertical-align:middle;opacity:.7"></p>
</footer>

<script src="/components/navbar.js"></script>
<script src="/components/crab.js"></script>
<script>
(function () {
  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch { return iso; }
  }

  function bodyToHtml(text) {
    if (!text) return '<p>No content.</p>';
    return text.split(/\n\n+/).map(para => {
      const line = para.replace(/\n/g, '<br>').trim();
      return line ? `<p>${line}</p>` : '';
    }).filter(Boolean).join('');
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function getYouTubeId(url) {
    if (!url) return null;
    const m = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/.exec(url);
    return m ? m[1] : null;
  }

  async function load() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) {
      document.getElementById('article-body').innerHTML = '<div class="state-box"><i class="fa-solid fa-triangle-exclamation"></i><p>No post ID specified.</p></div>';
      return;
    }

    try {
      const res = await fetch(`/api/commentary?id=${encodeURIComponent(id)}`);
      const data = await res.json();
      const post = data.post;
      if (!post || !res.ok) {
        document.getElementById('article-body').innerHTML = '<div class="state-box"><i class="fa-solid fa-triangle-exclamation"></i><p>Post not found.</p></div>';
        return;
      }

      document.title = `${post.title} | Still Afloat`;

      const tagsHtml = (post.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');

      document.getElementById('post-hero-inner').innerHTML = `
        <p class="eyebrow"><i class="fa-solid fa-microphone"></i> Commentary</p>
        <a class="back-link" href="/commentary.html"><i class="fa-solid fa-arrow-left"></i> All Posts</a>
        <h1 class="post-title">${escHtml(post.title)}</h1>
        <div class="post-meta">
          <span class="post-date">${formatDate(post.published_at)}</span>
          ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
        </div>`;

      // Hero image (shown only if no video, or always if imageUrl present)
      if (post.imageUrl && !post.videoUrl) {
        document.getElementById('post-image-section').innerHTML = `
          <div class="post-image-wrap">
            <img class="post-image" src="${escHtml(post.imageUrl)}" alt="${escHtml(post.title)}">
          </div>`;
      }

      // YouTube embed
      const ytId = getYouTubeId(post.videoUrl || '');
      if (ytId) {
        document.getElementById('video-section').innerHTML = `
          <div class="video-wrap">
            <div class="video-container">
              <iframe
                src="https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1"
                title="${escHtml(post.title)}"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
              </iframe>
            </div>
            <p class="video-label"><i class="fa-brands fa-youtube" style="color:#ff4e4e;margin-right:5px"></i> Watch on YouTube</p>
          </div>`;
      }

      const hasVideo = !!ytId;
      document.getElementById('article-body').innerHTML = `
        ${hasVideo ? '<div class="transcript-divider">Transcript</div>' : ''}
        <div class="article-body">${bodyToHtml(post.body_en)}</div>
        <div class="bottom-nav">
          <a class="bottom-link" href="/commentary.html"><i class="fa-solid fa-arrow-left"></i> Back to Commentary</a>
          <span class="bottom-share"><i class="fa-solid fa-share-nodes"></i> Still Afloat Cruising</span>
        </div>`;
    } catch (e) {
      document.getElementById('article-body').innerHTML = '<div class="state-box"><i class="fa-solid fa-triangle-exclamation"></i><p>Could not load post. Please try again.</p></div>';
    }
  }

  load();
})();
</script>
</body>
</html>
