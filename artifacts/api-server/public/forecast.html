<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forecast | Still Afloat</title>
<link rel="stylesheet" href="./css/styles.css">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#06111f;color:white;}
.hero{position:relative;min-height:340px;padding:80px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(rgba(6,17,31,.45), rgba(6,17,31,.62)),linear-gradient(135deg,#0077b6,#00b4d8);background-size:cover;background-position:center;overflow:hidden;}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to bottom, rgba(6,17,31,0), #06111f 100%);}
.hero-content{position:relative;z-index:2;background:rgba(7,24,63,.45);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:28px 34px;max-width:760px;}
.hero h1{margin:0 0 12px;font-size:64px;line-height:1;}
.hero p{margin:0;font-size:22px;color:rgba(255,255,255,.92);}
.nav-links{position:absolute;top:20px;left:20px;z-index:5;display:flex;gap:12px;flex-wrap:wrap;}
.nav-link{background:rgba(7,24,63,0.78);color:white;padding:12px 20px;border-radius:18px;text-decoration:none;font-weight:800;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);transition:.2s ease;}
.nav-link:hover{transform:translateY(-2px);background:rgba(0,119,182,.88);}
.forecast-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;padding:30px;max-width:1200px;margin:auto;}
.day-card{background:rgba(255,255,255,0.08);border-radius:22px;padding:18px;text-align:center;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);}
.day-emoji{font-size:42px;margin-bottom:10px;}.day-temp{font-size:26px;font-weight:800;color:#5dff9a;}
.error{max-width:900px;margin:40px auto;padding:24px;border-radius:22px;background:rgba(255,255,255,.08);text-align:center;}
@media (max-width:768px){.hero{min-height:260px;padding:70px 16px;}.hero h1{font-size:42px;}.hero p{font-size:18px;}.hero-content{padding:22px;}.nav-links{left:12px;right:12px;gap:8px;}.nav-link{padding:10px 14px;font-size:14px;}}
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="nav-links">
    <a class="nav-link" href="index.html">🏠 Home</a>
    <a class="nav-link" href="weather.html">🌦️ Weather</a>
  </div>
  <div class="hero-content">
    <h1 id="title">Loading Forecast...</h1>
    <p>10-day cruise weather outlook</p>
  </div>
</div>
<div class="forecast-grid" id="forecast"></div>
<script>
const PEXELS_API_KEY='P82hqxcbAMVh4XpB7Dr3zwUrzWY1kldO6Q8QvO9XkJ8FXGsl4iH6ebzA';
async function loadHeroImage(location){
  try{
    const query=location.query||`${location.name} cruise port`;
    const response=await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=1`,{headers:{Authorization:PEXELS_API_KEY}});
    const data=await response.json();
    if(data.photos&&data.photos.length>0){
      const image=data.photos[0].src.landscape;
      document.getElementById('hero').style.backgroundImage=`linear-gradient(rgba(6,17,31,.45), rgba(6,17,31,.62)), url(${image})`;
    }
  }catch(error){console.error('Unable to load Pexels image',error);}
}
async function loadForecast(){
  const params=new URLSearchParams(window.location.search);
  const place=params.get('place')||'miami';
  try{
    const response=await fetch(`/api/weather?place=${encodeURIComponent(place)}`);
    const data=await response.json();
    if(!response.ok||!data.ok){throw new Error(data.error||'Forecast not found');}
    const location=data.forecast;
    document.getElementById('title').textContent=`${location.name} Forecast`;
    await loadHeroImage(location);
    document.getElementById('forecast').innerHTML=location.forecast.map(item=>`
      <div class="day-card">
        <div>${new Date(item.day).toLocaleDateString('en-US',{weekday:'short'})}</div>
        <div class="day-emoji">${item.emoji}</div>
        <div class="day-temp">${item.high}°</div>
        <div>${item.low}° low</div>
      </div>
    `).join('');
  }catch(error){
    document.getElementById('title').textContent='Forecast unavailable';
    document.getElementById('forecast').innerHTML=`<div class="error">We could not load that cruise forecast. Please return to Weather and choose another port or destination.</div>`;
  }
}
loadForecast();
</script>
</body>
</html>
