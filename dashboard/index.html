<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Stale-shell guard. A deploy replaces the hashed bundle files; a page whose
         index.html was kept from before the deploy asks for a file that is gone,
         and the page stays blank. When the app's own script or stylesheet fails to
         load, reload once (a reload revalidates index.html, which then names the
         current files). The sessionStorage stamp stops it looping on a real outage. -->
    <script>
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (!t || t === window || !t.tagName) return;
        var u = t.src || t.href || '';
        if (!/\/assets\//.test(u)) return;
        if (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') return;
        try {
          var last = Number(sessionStorage.getItem('saf-stale-reload') || 0);
          if (Date.now() - last < 60000) return;
          sessionStorage.setItem('saf-stale-reload', String(Date.now()));
        } catch (_e) { return; }
        window.location.reload();
      }, true);
    </script>
    <title>Still Afloat Editorial</title>
    <meta name="description" content="AI-powered editorial command center for stillafloatcruising.com" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (browser chrome + iOS status bar) -->
    <meta name="theme-color" content="#07183f" />

    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Still Afloat" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background: hsl(222 47% 11%)">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .catch((err) => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
