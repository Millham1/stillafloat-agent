<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your price | Still Afloat Cruising</title>
<!-- A guest's private link from Mark's price email (Mark 2026-11-09): never indexed, and the address (which carries the link) is never sent on to another site.
     The price Mark quoted, then two buttons: "Book It" (Mark goes ahead; the paperwork follows from him) and "I need changes" (a box for what they want
     changed, in their own words). Nothing here books, charges or signs anything. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:site_name" content="Still Afloat Cruising">
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/details-page.css?v=20261109c">
<link rel="stylesheet" href="/css/price-page.css?v=20261112a">
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <img class="logo" src="/assets/images/still_afloat_logo.png" alt="Still Afloat">
  </div>

  <div class="d-banner"><div class="d-lockup"><div class="plaque"><span id="p-plaque">Your price</span></div></div></div>

  <main>
    <section class="panel" id="p-panel">
      <p class="label" id="p-label"></p>
      <h1 id="p-h1"></h1>
      <p id="p-state"></p>

      <!-- The price: one row a line, the totals in bold. -->
      <div id="p-price" hidden>
        <p id="p-lede"></p>
        <div class="p-lines" id="p-lines"></div>
        <p class="p-note" id="p-note"></p>
      </div>

      <!-- Still open: the two buttons. -->
      <div id="p-ask" hidden>
        <button type="button" class="btn" id="p-book"></button>
        <button type="button" class="btn alt" id="p-changes"></button>
        <p class="err center" id="p-err" hidden></p>
      </div>

      <!-- Answered: one line saying what happens next. -->
      <p class="p-done" id="p-done" hidden></p>
      <p class="small" id="p-after" hidden></p>
      <!-- Mark 2026-11-12: the same quote as a PDF to download and keep. -->
      <p class="center"><a id="p-pdf" hidden style="color:#07183f;font-weight:700;font-size:18px"></a></p>
    </section>
  </main>

  <!-- "I need changes": what the guest wants changed, in their own words. -->
  <div class="fp-modal" id="p-modal" hidden role="dialog" aria-modal="true" aria-labelledby="p-modal-title">
    <div class="p-box">
      <div class="fp-bar"><span id="p-modal-title"></span><button type="button" class="fp-close" id="p-modal-close" aria-label="Close">&#10005;</button></div>
      <div class="p-body">
        <p id="p-modal-p"></p>
        <textarea id="p-text" maxlength="2000"></textarea>
        <p class="err" id="p-modal-err" hidden></p>
        <button type="button" class="btn" id="p-send"></button>
      </div>
    </div>
  </div>

  <!-- Travel protection (Mark 2026-11-12): the insurance video, the plans priced for this trip (or my own policy, or none), a tick box each, Select. -->
  <div class="fp-modal" id="pr-modal" hidden role="dialog" aria-modal="true" aria-labelledby="pr-title">
    <div class="p-box pr-box">
      <div class="fp-bar"><span id="pr-title"></span><button type="button" class="fp-close" id="pr-close" aria-label="Close">&#10005;</button></div>
      <div class="p-body">
        <div id="pr-video"></div>
        <p id="pr-pick"></p>
        <div class="pr-opts" id="pr-opts"></div>
        <p class="err" id="pr-err" hidden></p>
        <button type="button" class="btn" id="pr-select"></button>
      </div>
    </div>
  </div>

  <div class="foot">
    <img class="sa" src="/assets/images/still_afloat_logo.png" alt="Still Afloat">
    <p>Still Afloat LLC dba Still Afloat Cruising · mark@stillafloatcruising.com</p>
    <div class="cs-row"><img class="cs" src="/assets/images/cornerstone-white.png" alt=""></div>
    <p class="sot">Seller of Travel: CA #2158353-50 | FL #ST44927 | WA #605824620</p>
  </div>

</div>
<script>
(function(){
  var ES = document.documentElement.lang === 'es';
  var PHONE = '919-346-6127';
  var T = ES ? {
    title:'Su precio', plaque:'Su precio', loading:'Un momento…',
    bad:'Este enlace no es válido. Abra el enlace completo de su correo, o llame o escriba a Mark al ' + PHONE + '.',
    h1:'¡Su cotización, {first}!', lede:'Mark cotizó sus decisiones con la naviera. Esta es su cotización:',
    note:'Estos son los precios cotizados hoy; pueden cambiar hasta que se haga la reservación. Tocar Reservar no cobra nada.',
    book:'Reservar', booking:'Un momento…', changes:'Necesito cambios',
    m_title:'¿Qué desea cambiar?', m_p:'Cuéntenos con sus palabras qué quiere cambiar. Mark lo cotiza de nuevo y le envía el precio nuevo.', send:'Enviar a Mark', sending:'Enviando…',
    m_short:'Díganos qué desea cambiar.',
    done_book:'¡Listo! Mark hace la reservación y sus documentos le llegan por correo.',
    done_changes:'¡Recibido! Mark lo cotiza de nuevo y le envía el precio nuevo por correo.',
    done_paper:'Sus documentos ya van en camino a su correo.',
    after:'¿Preguntas? Llame o escriba a Mark al ' + PHONE + '.',
    pdf:'Descargar esta cotización en PDF',
    fail:'No se pudo enviar. Intente de nuevo, o llame o escriba a Mark al ' + PHONE + '.',
    pr_need:'Elija primero su protección de viaje.', pr_yours:'Su protección de viaje: {pick}.',
    pr_btn:'Elegir mi protección de viaje', pr_change:'Cambiar', pr_title:'Protección de viaje', pr_video:'Vea este video sobre el seguro', pr_pick:'Marque una opción:', pr_select:'Seleccionar', pr_one:'Marque una de las opciones, por favor.', pr_saving:'Un momento…'
  } : {
    title:'Your price', plaque:'Your price', loading:'One moment…',
    bad:'This link is not valid. Please open the whole link from your email, or call or text Mark at ' + PHONE + '.',
    h1:'Your quote, {first}!', lede:'Mark priced your choices with the cruise line. Here is your quote:',
    note:'These are the prices quoted today; they can change until the booking is made. Tapping Book It charges nothing.',
    book:'Book It', booking:'One moment…', changes:'I need changes',
    m_title:'What would you like changed?', m_p:'Tell us in your own words what you want changed. Mark re-prices it and emails you the new price.', send:'Send to Mark', sending:'Sending…',
    m_short:'Please tell us what you would like changed.',
    done_book:"You're set! Mark books it and your paperwork follows by email.",
    done_changes:'Got it! Mark re-prices it and emails you the new price.',
    done_paper:'Your paperwork is already on its way to your email.',
    after:'Questions? Call or text Mark at ' + PHONE + '.',
    pdf:'Download this quote as a PDF',
    fail:'That did not go through. Try again, or call or text Mark at ' + PHONE + '.',
    pr_need:'Choose your travel protection first.', pr_yours:'Your travel protection: {pick}.',
    pr_btn:'Choose my travel protection', pr_change:'Change', pr_title:'Travel protection', pr_video:'Watch this insurance video', pr_pick:'Tick one choice:', pr_select:'Select', pr_one:'Tick one of the choices, please.', pr_saving:'One moment…'
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }
  function show(id, on){ var e = $(id); if(e) e.hidden = on === false; }

  document.title = T.title + ' | Still Afloat Cruising';
  $('p-plaque').textContent = T.plaque;
  var state = $('p-state');
  state.textContent = T.loading;

  var qs = new URLSearchParams(location.search);
  var reply = (qs.get('r') || '').trim(), key = (qs.get('k') || '').trim(), want = qs.get('do');
  if(!/^[0-9a-f-]{36}$/i.test(reply) || !/^[A-Za-z0-9_-]{43}$/.test(key)){ state.textContent = T.bad; return; }
  var API = '/api/price-confirm/' + reply + '/' + key;
  var busy = false;
  var prot = null, pick = '', curState = '', video = '';   // the travel protection on offer (Mark 2026-11-10) and the one the guest picked

  function draw(d){
    state.textContent = '';
    $('p-label').textContent = d.label || '';
    $('p-h1').textContent = T.h1.replace('{first}', d.firstName || '');
    $('p-lede').textContent = T.lede;
    prot = (d.doc || {}).protection || null; pick = d.protection || ''; video = d.video || '';
    $('p-lines').innerHTML = quoteHtml(d.doc || {});
    $('p-note').textContent = T.note;
    if(d.pdf){ var pdf = $('p-pdf'); pdf.href = d.pdf; pdf.textContent = T.pdf; pdf.hidden = false; }
    show('p-price');
    drawState(d.state);
  }
  // the quote, laid out like the email (Mark 2026-11-10): the cruise as ONE table (a column per guest), the add-ons named once, each piece of travel
  // as its own block, the totals in bars
  function quoteHtml(q){
    var h = '', heads = q.heads || {};
    h += '<div class="q-bar">' + esc(heads.cruise || '') + (q.cabin ? '<span> · ' + esc(q.cabin) + '</span>' : '') + '</div>';
    if(q.matrix){
      h += '<div class="q-scroll"><table class="q-table"><thead><tr><th></th>' + q.matrix.names.map(function(n){ return '<th>' + esc(n) + '</th>'; }).join('') + '</tr></thead><tbody>';
      q.matrix.rows.forEach(function(r){ h += '<tr' + (r.strong ? ' class="strong"' : '') + '><td>' + esc(r.label) + '</td>' + r.values.map(function(v){ return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>'; });
      h += '</tbody></table></div>';
      (q.matrix.addons || []).forEach(function(a){ h += '<p class="q-sub">' + esc(a.title) + '</p><ul class="q-list">' + a.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>'; });
    } else {
      (q.cruise || []).forEach(function(l){ h += '<div class="p-line"><span>' + esc(l.label) + '</span><span>' + esc(l.value) + '</span></div>'; });
    }
    if(q.cruiseTotal) h += '<div class="q-total"><span>' + esc(q.cruiseTotal.label) + '</span><span>' + esc(q.cruiseTotal.value) + '</span></div>';
    if((q.travel || []).length){
      h += '<div class="q-bar">' + esc(heads.travel || '') + '</div>';
      q.travel.forEach(function(t){ h += '<div class="q-trip"><div><b>' + esc(t.title) + '</b>' + t.details.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div><b>' + esc(t.value) + '</b></div>'; });
    }
    if(q.tripTotal) h += '<div class="q-total big"><span>' + esc(q.tripTotal.label) + '</span><span>' + esc(q.tripTotal.value) + '</span></div>';
    if(q.protection) h += '<div class="q-bar">' + esc(q.protection.head) + '</div><div id="p-prot"></div>';
    return h;
  }
  // Travel protection (Mark 2026-11-10): each plan Mark priced, its price per person, then "my own policy" and "no insurance". While the quote is
  // open each is a pill and one must be picked before Book It goes through; the plan picked shows its own trip total. Afterwards the pick is one line.
  function protLabel(k){
    if(!prot) return '';
    if(k === 'own') return prot.own; if(k === 'none') return prot.none;
    for(var i = 0; i < prot.plans.length; i++) if(prot.plans[i].key === k) return prot.plans[i].name + ' · ' + prot.plans[i].price;
    return '';
  }
  function drawProt(open){
    var box = $('p-prot'); if(!box || !prot) return;
    var h = '';
    if(open){
      // Mark 2026-11-12: the choice is made in a pop-up (the video, the plans, a tick box each); once made it shows here, in the quote, with its trip total
      if(!pick){
        h += '<button type="button" class="btn" data-prot-open="1">' + esc(T.pr_btn) + '</button>';
      } else {
        var chosen = null; prot.plans.forEach(function(p){ if(p.key === pick) chosen = p; });
        h += '<div class="q-trip"><div><b>' + esc(chosen ? chosen.name : protLabel(pick)) + '</b>' + (chosen && chosen.note ? '<span>' + esc(chosen.note) + '</span>' : '') + '</div><b>' + esc(chosen ? chosen.price : '') + '</b></div>';
        if(chosen && chosen.withTotal) h += '<div class="q-total big"><span>' + esc(chosen.withTotal.label) + '</span><span>' + esc(chosen.withTotal.value) + '</span></div>';
        h += '<p class="center"><button type="button" class="q-link" data-prot-open="1">' + esc(T.pr_change) + '</button></p>';
      }
    } else {
      prot.plans.forEach(function(p){ h += '<div class="q-trip"><div><b>' + esc(p.name) + '</b>' + (p.note ? '<span>' + esc(p.note) + '</span>' : '') + '</div><b>' + esc(p.price) + '</b></div>'; });
      if(pick && protLabel(pick)) h += '<p class="q-sub">' + esc(T.pr_yours.replace('{pick}', protLabel(pick))) + '</p>';
    }
    box.innerHTML = h;
  }
  function drawState(s){
    var open = s === 'open';
    curState = s; drawProt(open);
    show('p-ask', open);
    $('p-book').textContent = busy ? T.booking : T.book;
    $('p-changes').textContent = T.changes;
    var done = $('p-done');
    done.textContent = s === 'approved' ? T.done_book : s === 'changes' ? T.done_changes : s === 'paperwork' ? T.done_paper : '';
    done.hidden = open;
    $('p-after').textContent = T.after; show('p-after', !open);
  }
  function post(body){
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(body) }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){ return { status: r.status, body: j }; });
    });
  }
  function openModal(){
    $('p-modal-title').textContent = T.m_title; $('p-modal-p').textContent = T.m_p; $('p-send').textContent = T.send;
    show('p-modal-err', false); show('p-modal'); $('p-text').focus();
  }
  function closeModal(){ show('p-modal', false); }

  // "Book It": one tap on this page (the email's button opens the page; nothing is approved by a link being opened)
  $('p-book').addEventListener('click', function(){
    if(busy) return;
    // a button that cannot go ahead says what to do first (Mark 2026-11-10)
    if(prot && !pick){ var need = $('p-err'); need.textContent = T.pr_need; need.hidden = false; openProt(); return; }
    busy = true; show('p-err', false); drawState('open');
    post({ action: 'book', protection: pick, website: '' }).then(function(x){
      busy = false;
      if(x.body && x.body.success){ drawState(x.body.state || 'approved'); return; }
      var err = $('p-err'); err.textContent = (x.body && x.body.error) || T.fail; err.hidden = false; drawState('open');
    }).catch(function(){ busy = false; var err = $('p-err'); err.textContent = T.fail; err.hidden = false; drawState('open'); });
  });
  // The travel protection pop-up: the video first, then one tick box per choice (only one stays ticked), then Select. The choice is kept on the
  // booking (it approves nothing), shows in the quote above with its trip total, and is on the PDF.
  function embedUrl(u){ var m = /(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/.exec(u || ''); return m ? 'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0' : ''; }
  function openProt(){
    if(!prot || curState !== 'open') return;
    $('pr-title').textContent = T.pr_title; $('pr-pick').textContent = T.pr_pick; $('pr-select').textContent = T.pr_select; show('pr-err', false);
    var em = embedUrl(video), v = '';
    if(video) v = '<p class="pr-watch"><b>' + esc(T.pr_video) + '</b></p>' + (em ? '<div class="pr-video"><iframe src="' + esc(em) + '" title="' + esc(T.pr_video) + '" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>' : '<p><a href="' + esc(video) + '" target="_blank" rel="noopener">' + esc(T.pr_video) + '</a></p>');
    $('pr-video').innerHTML = v;
    var rows = prot.plans.map(function(p){ return [p.key, p.name, p.price + (p.note ? ' · ' + p.note : ''), p.withTotal ? p.withTotal.label + ': ' + p.withTotal.value : '']; });
    rows.push(['own', prot.own, '', ''], ['none', prot.none, '', '']);
    $('pr-opts').innerHTML = rows.map(function(r){
      return '<label class="pr-opt"><input type="checkbox" data-prot="' + esc(r[0]) + '"' + (pick === r[0] ? ' checked' : '') + '><span><b>' + esc(r[1]) + '</b>' + (r[2] ? '<em>' + esc(r[2]) + '</em>' : '') + (r[3] ? '<em>' + esc(r[3]) + '</em>' : '') + '</span></label>';
    }).join('');
    show('pr-modal');
  }
  function closeProt(){ show('pr-modal', false); $('pr-video').innerHTML = ''; }
  $('pr-opts').addEventListener('change', function(e){
    var boxes = this.querySelectorAll('input[type=checkbox]');
    for(var i = 0; i < boxes.length; i++) if(boxes[i] !== e.target) boxes[i].checked = false;
    show('pr-err', false);
  });
  $('pr-close').addEventListener('click', closeProt);
  $('pr-select').addEventListener('click', function(){
    if(busy) return;
    var on = $('pr-opts').querySelector('input[type=checkbox]:checked'), err = $('pr-err');
    if(!on){ err.textContent = T.pr_one; err.hidden = false; return; }
    busy = true; $('pr-select').textContent = T.pr_saving;
    post({ action: 'protect', protection: on.getAttribute('data-prot'), website: '' }).then(function(x){
      busy = false; $('pr-select').textContent = T.pr_select;
      if(x.body && x.body.success){ pick = x.body.protection || on.getAttribute('data-prot'); closeProt(); show('p-err', false); drawProt(curState === 'open'); return; }
      err.textContent = (x.body && x.body.error) || T.fail; err.hidden = false;
    }).catch(function(){ busy = false; $('pr-select').textContent = T.pr_select; err.textContent = T.fail; err.hidden = false; });
  });
  $('p-lines').addEventListener('click', function(e){
    var el = e && e.target; while(el && el !== this && !(el.getAttribute && el.getAttribute('data-prot-open'))) el = el.parentNode;
    if(!el || el === this || curState !== 'open' || busy) return;
    openProt();
  });
  $('p-changes').addEventListener('click', openModal);
  $('p-modal-close').addEventListener('click', closeModal);
  $('p-send').addEventListener('click', function(){
    if(busy) return;
    var said = $('p-text').value.trim(), err = $('p-modal-err');
    if(said.length < 3){ err.textContent = T.m_short; err.hidden = false; return; }
    busy = true; err.hidden = true; $('p-send').textContent = T.sending;
    post({ action: 'changes', text: said, website: '' }).then(function(x){
      busy = false; $('p-send').textContent = T.send;
      if(x.body && x.body.success){ closeModal(); drawState(x.body.state || 'changes'); return; }
      err.textContent = (x.body && x.body.error) || T.fail; err.hidden = false;
    }).catch(function(){ busy = false; $('p-send').textContent = T.send; err.textContent = T.fail; err.hidden = false; });
  });

  fetch(API, { headers: { 'Accept': 'application/json' } }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return { status: r.status, body: j }; });
  }).then(function(x){
    if(!x.body || !x.body.success){ state.textContent = T.bad; return; }
    draw(x.body);
    if(want === 'changes' && x.body.state === 'open') openModal();
  }).catch(function(){ state.textContent = T.bad; });
})();
</script>
</body>
</html>
