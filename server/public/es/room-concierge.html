const DANCERS={1:'/assets/concierge/dancer-1_neutral_cruiser.jpg',2:'/assets/concierge/dancer-2_tourist.jpg',3:'/assets/concierge/dancer-3_cruiser.jpg',4:'/assets/concierge/dancer-4_party_animal.jpg',5:'/assets/concierge/dancer-5_conga_king_queen.jpg'};

<script>
/* ─────────────────────────────────────────────────────────────────────────────
   RoomConciergeFlow — the full journey, wired. (es-419 twin — logic identical
   to /room-concierge.html; only user-visible strings are translated.)
   landing → fork → (ship picker | –) → 5 questions about you → expectations
   (the finder's Mark-corrected tree) → reveal (published Conga score + Salty
   Mark) → rooms (live-reasoned picks where advice exists) → the one CTA.
   Design is LOCKED (Mark, 8/14) — stages render inside the frosted panel.
──────────────────────────────────────────────────────────────────────────── */
const QUIET = [
  "curado por Still Afloat Cruising, tu asesor de viajes independiente",
  "¿Dudas? Siempre puedes hablar con nosotros.",
];
/* Behavioral interview (model approved by Mark 8/14): remembered behavior,
   forced tradeoffs, projection — never self-description. Each option carries
   hidden trait weights; the TYPE is inferred from the pattern. The visitor
   never sees a label. */
const PERSONALITY_QS = [
  { key:"retell", q:"Piensa en las mejores vacaciones de tu vida. ¿Qué parte sigues contando hasta hoy?",
    opts:[["Esa comida que sigo persiguiendo", {food:2, splurgeConsume:1}],
          ["La gente que conocimos — todavía nos hablamos", {social:2, energy:1}],
          ["Eso que hicimos y que nadie en casa nos cree", {active:2, energy:1}],
          ["Que por una semana, nadie pudo localizarme", {quiet:2, introvert:1}]] },
  { key:"photos", q:"Abre tu teléfono — las fotos de tu último viaje son sobre todo…",
    opts:[["Paisajes. Ni un humano en la foto", {quiet:2, introvert:1}],
          ["Nosotros con gente recién conocida", {social:2, extrovert:2}],
          ["Comida y tragos, la verdad", {food:2, splurgeConsume:1}],
          ["Los niños pasándola como nunca", {family:2}]] },
  { key:"wedding", q:"Una boda, 11 de la noche. ¿Dónde te encontramos?",
    opts:[["En la pista de baile", {energy:2, extrovert:1}],
          ["En plena conversación que empezó en la cena", {social:1, introvert:1}],
          ["Ya me fui. Nos despedimos a las 9:30", {quiet:2, introvert:1}],
          ["En el bar, haciendo reír al bartender", {social:2, energy:1}]] },
  { key:"annoy", q:"¿Qué es LO PRIMERO que te molesta de otros viajeros?",
    opts:[["Son ruidosos a donde vayan", {quiet:2, crowdsAvoid:2}],
          ["Improvisan todo y se nota", {planner:2}],
          ["Hacen filas que no tenían que hacer", {planner:1, active:1}],
          ["Nunca se despegan de la piscina", {active:2}]] },
  { key:"overpay", q:"Tu último viaje — ¿en qué pagaste de más con gusto, sin arrepentirte ni un poco?",
    opts:[["La vista desde la habitación", {splurgeCabin:2}],
          ["Una cena inolvidable", {splurgeConsume:2, food:1}],
          ["La excursión que todos decían que era carísima", {active:2, splurgeConsume:1}],
          ["En nada. Conseguir la oferta ERA el viaje", {value:2, planner:1}]] },
  { key:"tradeoff", q:"Te quedas con uno — el otro desaparece para siempre:",
    opts:[["El rincón tranquilo que nadie más ha encontrado", {quiet:2, introvert:2, crowdsAvoid:1}],
          ["La mesa donde todos te conocen por tu nombre", {social:2, extrovert:2, crowdsLove:1}]] },
];

/* Pattern → the axes the matcher uses. Deterministic and inspectable. */
function inferAxes(traits){
  const t = k => traits[k]||0;
  return {
    energy:  t("energy")>=3 ? "party" : (t("quiet")>=3 ? "quiet" : "social"),
    social:  t("extrovert")>t("introvert")+1 ? "extrovert" : (t("introvert")>t("extrovert")+1 ? "introvert" : "mixed"),
    structure: t("planner")>=2 ? "planner" : "loose",
    splurge: t("splurgeCabin")>=2 ? "cabin" : (t("value")>=2 ? "value" : "consumables"),
    crowds:  t("crowdsAvoid")>=2 || t("quiet")>=4 ? "avoids" : (t("crowdsLove")>=1||t("energy")>=3 ? "loves-it" : "tolerates"),
  };
}
/* The finder's expectation tree, ported verbatim (Mark-corrected copy). */
const REGION_NAMES = {e_caribbean:"el Caribe Oriental",w_caribbean:"el Caribe Occidental",s_caribbean:"el Caribe Sur",
  bahamas:"las Bahamas",alaska:"Alaska",mediterranean:"el Mediterráneo",mexican_riviera:"la Riviera Mexicana",
  n_europe:"el norte de Europa",bermuda:"Bermudas",hawaii:"Hawái",canada_ne:"Canadá y Nueva Inglaterra"};
const EXPECT_QS = [
  { key:"destination", q:"¿Con qué destino sueñas?", opts:[
      ["Caribe Oriental","e_caribbean"],["Caribe Occidental","w_caribbean"],
      ["Caribe Sur","s_caribbean"],["Las Bahamas","bahamas"],
      ["Alaska","alaska"],["El Mediterráneo","mediterranean"],
      ["Riviera Mexicana","mexican_riviera"],
      ["Sorpréndeme — donde el barco encaje","surprise"]] },
  { key:"party", q:"¿Quiénes van?", opts:[
      ["Solo nosotros dos","couple"],["Familia con niños","family"],
      ["Solo yo","solo"],["Solo yo, pero viajando con un grupo","solo-group"],
      ["Vamos en grupo","group"]] },
  { key:"room", q:"¿Cómo te imaginas usando tu habitación?", opts:[
      ["Para dormir y recargar pilas","inside"],["Despertar con luz de día y mar","oceanview"],
      ["Café afuera en pijama","balcony"],["La habitación es parte de las vacaciones","suite"],
      ["La verdad, ni idea — elige por mí","balcony"]] },
  { key:"priority", q:"¿Qué es lo que más importa ya a bordo?", opts:[
      ["Despertar viendo el mar","ocean"],["Paz y tranquilidad","quiet"],
      ["Estar cerca de la acción","action"],["Espacio de sobra","space"]] },
  { key:"budget", q:"¿Cómo anda el presupuesto del viaje, siendo honestos?", opts:[
      ["Hay un número, y lo respetamos","lean"],
      ["Cómodo, pero cada dólar debe ganarse su lugar","middle"],
      ["Por la habitación correcta, el presupuesto se mueve","treat"],
      ["El presupuesto es lo que haga falta para que quede perfecto","sky"]] },
  { key:"motion", q:"¿Alguien se marea en el barco?", opts:[
      ["Sí — mantennos estables","yes"],["No, estamos bien","no"],
      ["Lo aguanto con una sonrisa","no"]] },
];

/* Room-category explainers — new cruisers don't know an Infinite Veranda from a
   porthole. Text now; image slots come later (Mark, 8/14). Inside needs none. */
const CATEGORY_INFO = [
  { match:/infinite/i, name:"¿Qué es una Infinite Veranda?",
    text:"El giro de Celebrity al balcón: toda la habitación ES la veranda. La mitad de arriba de la ventana baja y tu sala se convierte en espacio al aire libre. Ganas más espacio interior — pero no hay zona aparte con sillas afuera, y eso o lo amas o extrañas un balcón de verdad." },
  { match:/balcony|veranda/i, name:"¿Qué es un camarote con balcón?",
    text:"Tu propio espacio exterior privado — una puerta de vidrio, un par de sillas y el mar. El café ahí afuera por la mañana es eso que nadie suelta después de probarlo." },
  { match:/ocean\s?view|oceanview|window/i, name:"¿Qué es un camarote con vista al mar?",
    text:"Una ventana de verdad hacia el mar — luz de día y una vista de dónde estás, sin espacio exterior. Ves el mar; solo que no te sientas afuera en él." },
  { match:/suite/i, name:"¿Qué es una suite?",
    text:"Más espacio, y normalmente más beneficios — filas prioritarias, mejor servicio, a veces acceso a áreas del barco que los camarotes normales no tienen." },
];
function categoryInfo(cat){
  if(!cat) return "";
  const hit = CATEGORY_INFO.find(c=>c.match.test(cat));
  return hit ? `<details class="cat-info"><summary>${hit.name}</summary><p>${hit.text}</p></details>` : "";
}

/* Scannable options: bold the lead thought, lighten the tail — the eye gets
   the gist without reading the sentence. */
const LINE_DISPLAY = { "Royal Caribbean International": "Royal Caribbean" };
function lineName(l){ return LINE_DISPLAY[l] || l; }
function fmtOpt(label){
  const m = label.match(/^([^,—–.]{4,45})([,—–.].*)$/);
  return m ? `<b>${m[1]}</b><span style="color:#5a6b85;font-weight:500">${m[2]}</span>` : `<b>${label}</b>`;
}

class RoomConciergeFlow {
  constructor() {
    this.path=null; this.personality={}; this.expect={}; this.qIndex=0; this.eIndex=0;
    this.fleet=[]; this.chosen=null; this.suggestion=null; this.picked=new Set();
    this.stageEl=document.getElementById("stage");
    this.history=[];
    this.loadFleet();
  }
  snapshot(renderName){
    this.history.push({renderName,
      state: JSON.parse(JSON.stringify({path:this.path,personality:this.personality,expect:this.expect,
        qIndex:this.qIndex,eIndex:this.eIndex,traits:this.traits||{},raw:this.raw||{},
        chosenSlug:this.chosen?this.chosen.slug:null}))});
    document.getElementById("backBtn").classList.add("show");
  }
  back(){
    const prev=this.history.pop();
    if(!prev){ document.getElementById("backBtn").classList.remove("show"); return this.landing(); }
    const st=prev.state;
    this.path=st.path; this.personality=st.personality; this.expect=st.expect;
    this.qIndex=st.qIndex; this.eIndex=st.eIndex; this.traits=st.traits; this.raw=st.raw;
    this.chosen=st.chosenSlug?this.fleet.find(f=>f.slug===st.chosenSlug)||null:null;
    if(!this.history.length) document.getElementById("backBtn").classList.remove("show");
    this[prev.renderName]();
    this.stageEl.scrollTop=0;
  }
  quiet(i){ return `<p class="quiet">${QUIET[i===0?0:1]}</p>`; }
  async loadFleet(){
    try{ const r=await fetch("/api/cabins/fleet?lang=es"); this.fleet=(await r.json()).ships||[]; }
    catch{ this.fleet=[]; }
  }
  landing(){
    this.stageEl.innerHTML = `
      <p class="re-kick">Concierge de Camarotes</p>
      <h1>Busquemos la habitación<br>que vas a presumir.</h1>
      <p class="re-intro">Unas <b>preguntas rápidas sobre ti</b> — lo justo para entender qué quieres
      de un viaje. Después, tus <b>expectativas</b>. Después, <b>habitaciones reales</b> — los camarotes
      exactos que vale la pena reservar, y los que mejor pasas de largo. Unos dos minutos.</p>
      <div class="re-fork">
        <h2 class="q">¿Ya tienes un barco en mente?</h2>
        <div class="re-choices">
          <button class="re-btn yes" onclick="RC.fork('ship')">Sí — ya sé cuál es mi barco</button>
          <button class="re-btn no" onclick="RC.fork('discover')">Todavía no — ayúdame a elegir</button>
        </div>
      </div>
      <p class="re-coverage" id="coverage"></p>
      ${this.quiet(0)}`;
    this.drawCoverage();
  }
  drawCoverage(){
    const el=document.getElementById("coverage");
    if(!el) return;
    if(!this.fleet.length){ setTimeout(()=>this.drawCoverage(), 400); return; }
    const lines=[...new Set(this.fleet.map(s=>lineName(s.line)))].sort();
    el.innerHTML = `Cubrimos ${this.fleet.length} barcos de ${lines.length} líneas: ` + lines.join(" · ");
  }
  fork(path){ this.snapshot('landing'); this.path=path; this.qIndex=0; this.eIndex=0;
    path==="ship" ? this.shipPick() : this.personalityQ(); }
  shipPick(filter=""){
    const f=filter.trim().toLowerCase();
    const matches=this.fleet.filter(s=>!f||s.ship.toLowerCase().includes(f)||s.line.toLowerCase().includes(f));
    const byLine={};
    for(const s of matches){ const ln=lineName(s.line); (byLine[ln]=byLine[ln]||[]).push(s); }
    const list=Object.entries(byLine).map(([line,ships])=>
      `<div style="margin:12px 0 4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(93,255,154,.85)">${line}</div>`+
      ships.map(s=>`<button class="re-opt" style="padding:9px 14px;font-size:15px" onclick="RC.chooseShip('${s.slug}')">${s.ship}</button>`).join("")
    ).join("");
    this.stageEl.innerHTML = `
      <p class="re-progress">Tu barco</p>
      <h2 class="q">¿Cuál barco?</h2>
      <input id="shipSearch" placeholder="Escribe el nombre del barco o la línea…" value="${filter.replace(/"/g,"&quot;")}"

        oninput="RC.shipPick(this.value)">
      <div class="re-opts" style="max-height:300px;overflow-y:auto">${list||'<p style="color:rgba(255,255,255,.7)">Sin resultados — revisa la ortografía, o regresa y deja que yo elija.</p>'}</div>
      ${this.quiet(1)}`;
    const inp=document.getElementById("shipSearch");
    if(f){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
  }
  chooseShip(slug){ this.snapshot('shipPick'); this.chosen=this.fleet.find(s=>s.slug===slug)||null; this.cabinAsk(); }

  // Already-booked path: the one question a booked cruiser actually wants answered.
  cabinAsk(msg){
    this.stageEl.innerHTML = `
      <p class="re-progress">Tu camarote</p>
      <h2 class="q">¿Ya tienes camarote asignado?</h2>
      <p class="re-intro" style="margin-top:-4px">Si ya reservaste, dime el número y te digo qué esperar de la vista.</p>
      ${msg?`<p style="color:#ffca4f;margin:6px 0 0">${msg}</p>`:""}
      <input id="cabinNum" placeholder="p. ej. 8234" autocomplete="off"
        onkeydown="if(event.key==='Enter')RC.cabinCheck()">
      <div class="re-choices" style="margin-top:14px">
        <button class="re-btn yes" onclick="RC.cabinCheck()">Revisar mi camarote</button>
        <button class="re-btn no" onclick="RC.personalityQ()">Todavía no tengo camarote</button>
      </div>
      ${this.quiet(1)}`;
    const i=document.getElementById("cabinNum"); if(i) i.focus();
  }
  async cabinCheck(){
    const el=document.getElementById("cabinNum");
    const num=(el&&el.value||"").trim();
    if(!num){ this.cabinAsk(); return; }
    this.snapshot('cabinAsk');
    this.stageEl.innerHTML = `<p class="re-progress">Tu camarote</p><h2 class="q">Revisando…</h2>`;
    let d={};
    try{
      const r=await fetch("/api/cabins/check",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({ship:this.chosen&&this.chosen.slug,cabin:num,lang:LANG})});
      d=await r.json();
    }catch(e){ d={}; }
    if(!d||d.found!==true){
      const near=(d&&d.near||[]).map(n=>`<button class="re-opt" style="padding:7px 12px;font-size:14px"
        onclick="document.getElementById('cabinNum').value='${n}';RC.cabinCheck()">${n}</button>`).join("");
      this.cabinAsk((d&&d.message)||"");
      if(near){
        const box=document.createElement("div");
        box.innerHTML=`<p style="margin:12px 0 4px;font-size:13px;color:rgba(255,255,255,.75)">¿Quisiste decir?</p>
          <div class="re-opts">${near}</div>`;
        this.stageEl.appendChild(box);
      }
      return;
    }
    const where=(d.where||[]).join(" · ");
    const body=(d.body||[]).map(p=>`<p style="line-height:1.6;margin:0 0 10px">${p}</p>`).join("");
    this.stageEl.innerHTML = `
      <p class="re-progress">Tu camarote ${d.cabin?("· "+d.cabin):""}</p>
      <h2 class="q">${d.headline||""}</h2>
      ${where?`<p style="font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:rgba(93,255,154,.9);margin:-2px 0 12px">${where}</p>`:""}
      ${body}
      <p style="line-height:1.6;margin:14px 0 0">${d.cta||""}</p>
      <div class="re-choices" style="margin-top:14px">
        <button class="re-btn yes" onclick="RC.personalityQ()">Sigue: ayúdame a elegir</button>
        <button class="re-btn no" onclick="RC.cabinAsk()">Probar otro número</button>
      </div>
      ${this.quiet(2)}`;
  }
  personalityQ(){
    const i=this.qIndex;
    if(i>=PERSONALITY_QS.length){ this.personality=inferAxes(this.traits); return this.expectQ(); }
    const q=PERSONALITY_QS[i];
    this.stageEl.innerHTML = `
      <p class="re-progress">Conociéndote · ${i+1} de ${PERSONALITY_QS.length}</p>
      <h2 class="q">${q.q}</h2>
      <div class="re-opts">${q.opts.map(([label],oi)=>
        `<button class="re-opt" onclick="RC.answerP(${i},${oi})">${fmtOpt(label)}</button>`).join("")}</div>
      ${this.quiet(1)}`;
  }
  answerP(qi,oi){
    this.snapshot('personalityQ');
    const q=PERSONALITY_QS[qi], weights=q.opts[oi][1];
    this.raw=this.raw||{}; this.raw[q.key]=q.opts[oi][0];
    this.traits=this.traits||{};
    for(const [k,v] of Object.entries(weights)) this.traits[k]=(this.traits[k]||0)+v;
    this.qIndex++; this.personalityQ();
  }
  expectQ(){
    const i=this.eIndex;
    if(i>=EXPECT_QS.length) return this.reveal();
    const q=EXPECT_QS[i];
    this.stageEl.innerHTML = `
      <p class="re-progress">Tus expectativas · ${i+1} de ${EXPECT_QS.length}</p>
      <h2 class="q">${q.q}</h2>
      <div class="re-opts">${q.opts.map(([label,val])=>
        `<button class="re-opt" onclick="RC.answerE('${q.key}','${val}')">${fmtOpt(label)}</button>`).join("")}</div>
      ${this.quiet(1)}`;
  }
  answerE(key,val){ this.snapshot('expectQ'); this.expect[key]=val; this.eIndex++; this.expectQ(); }
  async reveal(){
    this.stageEl.innerHTML = `<p class="re-progress">El veredicto</p><h2 class="q">En eso estoy…</h2>`;
    let shipsToShow=[], reason="";
    if(this.path==="ship" && this.chosen){ shipsToShow=[this.chosen]; }
    else{
      try{
        const r=await fetch("/api/cabins/suggest-ships?lang=es",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({personality:this.personality, party:this.expect.party, traits:this.traits, raw:this.raw, budget:this.expect.budget, destination:this.expect.destination})});
        const d=await r.json(); shipsToShow=d.picks||[]; reason=d.reason||"";
      }catch{ shipsToShow=[]; }
    }
    if(!shipsToShow.length){
      this.stageEl.innerHTML = `<p class="re-progress">El veredicto</p>
        <h2 class="q">Prefiero hacerlo bien que adivinar.</h2>
        <p class="re-intro">Algo no cuadró de mi lado. Mándanos lo que me contaste y una persona
        de verdad termina el trabajo.</p>${this.cta()}`;
      return;
    }
    const settled=await Promise.allSettled(shipsToShow.map(s=>this.shipCard(s)));
    const cards=settled.filter(r=>r.status==="fulfilled").map(r=>r.value);
    if(settled.some(r=>r.status==="rejected")) console.error("ship card failed", settled.find(r=>r.status==="rejected"));
    const heading=this.path==="ship" ? "Tu barco, calificado con honestidad." :
      (cards.length>1?"Dos barcos que van contigo.":"El barco que va contigo.");
    const altOffer=this.path==="ship"?`<p style="text-align:center;margin:2px 0 12px"><button class="re-btn" style="font-size:14px;padding:9px 18px" onclick="RC.snapshot('reveal');RC.path='discover';RC.reveal()">O muéstrame lo que TÚ elegirías para mí &rarr;</button></p>`:"";
    this.stageEl.innerHTML = `
      <p class="re-progress">El veredicto</p>
      <h2 class="q">${heading}</h2>
      ${reason?`<p class="re-intro" style="font-size:15.5px">${reason}</p>`:""}
      ${altOffer}
      ${cards.join("")}
      ${this.cta()}`;
  }
  async shipCard(s){
    let rating=null, comment=null, salty=null;
    try{
      const r=await fetch(`/api/ships/${encodeURIComponent(s.slug)}/rating?lang=es`);
      if(r.ok){ const d=await r.json(); if(d.ok){ rating=d.rating; comment=d.comment; salty=d.saltyMarkTake; } }
    }catch{/* no rating shown */}
    const nextLevel = s.nextLevel ? `
      <div style="display:flex;gap:10px;align-items:center;background:rgba(255,202,79,.12);border:1px solid rgba(255,202,79,.35);border-radius:13px;padding:9px 13px;margin:10px 0 10px">
        <span style="font-size:20px">✦</span>
        <div><span style="font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#ffca4f;display:block;margin-bottom:2px">Siguiente nivel: ${s.nextLevel.name}</span>
        <p style="margin:0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.85)">${s.nextLevel.why}</p></div>
      </div>` : "";
    const roomsBtn = s.hasRooms
      ? `<button class="re-btn no" onclick="RC.rooms('${s.repSlug}','${s.ship.replace(/'/g,"\\'")}')">Muéstrame las habitaciones →</button>`
      : `<span style="font-size:13.5px;color:#5a6b85;font-style:italic">Las recomendaciones habitación por habitación de este barco vienen en camino — pídelas y las hacemos a mano.</span>`;
    return `<div class="reveal-ship">
      <div class="gist">
        <div><h3>${s.ship}</h3><span class="line">${lineName(s.line)}</span></div>
        ${rating!=null?`<div class="gist-score">${Number(rating).toFixed(1)}<small>/5</small></div>`:""}
      </div>
      ${(this.expect.destination && this.expect.destination!=="surprise" && (s.regions||[]).includes(this.expect.destination))?`<p style="margin:2px 0 6px;font-size:13px;font-weight:800;color:#5dff9a">⚓ Navega por ${REGION_NAMES[this.expect.destination]||this.expect.destination}</p>`:""}
      ${rating!=null?`<div class="gist-dancers">${[1,2,3,4,5].map(n=>
        `<img src="${DANCERS[n]}" style="${n<=Math.floor(rating)?'':'opacity:.22;filter:grayscale(80%)'}" alt="">`).join("")}</div>`:""}
      ${comment?`<p class="reveal-comment">&ldquo;${comment}&rdquo;</p>`:""}
      ${salty?`<div class="salty"><img src="${SALTY_IMG}" alt="Salty Mark">
        <div><span class="sl">Salty Mark dice</span><p>&ldquo;${salty}&rdquo;</p></div></div>`:""}
      ${nextLevel}
      <div class="reveal-pick">${roomsBtn}</div>
    </div>`;
  }
  async rooms(repSlug, shipName){
    this.snapshot('reveal');
    this.stageEl.innerHTML = `<p class="re-progress">Tus habitaciones</p><h2 class="q">Buscando las habitaciones que yo elegiría en ${shipName}…</h2>`;
    let d=null;
    try{
      const r=await fetch("/api/cabins/recommend?lang=es",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ship:repSlug, party:this.expect.party, room:this.expect.room,
          priority:this.expect.priority, budget:this.expect.budget, motion:this.expect.motion==="yes"})});
      if(r.ok) d=await r.json();
    }catch{/* handled below */}
    if(!d||!d.picks?.length){
      this.stageEl.innerHTML = `<p class="re-progress">Tus habitaciones</p>
        <h2 class="q">Este necesita el toque humano.</h2>
        <p class="re-intro">Todavía no tengo cargadas recomendaciones habitación por habitación
        para ${shipName} — mándanos tus respuestas y se hace a mano.</p>${this.cta()}`;
      return;
    }
    this.picked=new Set(); this.roomsData=d; this.roomsShip=shipName; this.roomsRep=repSlug;
    this.drawRooms();
  }
  drawRooms(){
    const d=this.roomsData;
    const picks=d.picks.map(p=>{
      const f=p.facts||{};
      const on=this.picked.has(p.cabin);
      const chips=[f.deck?`Cubierta ${f.deck}`:null,f.category||null,f.view||null].filter(Boolean)
        .map(c=>`<span class="chip">${c}</span>`).join("");
      return `<div class="reveal-ship" style="padding:15px 18px">
        ${p.hook?`<p class="room-hook">${p.hook}</p>`:`<p class="room-hook">Camarote ${p.cabin}</p>`}
        <div class="chips"><span class="chip chip-num">Camarote ${p.cabin}</span>${chips}</div>
        ${categoryInfo(f.category)}
        ${p.reason?`<p class="room-why">${p.reason}</p>`:""}
        <div style="text-align:right;margin-top:8px"><button class="re-btn ${on?'yes':'no'}" style="font-size:14px;padding:9px 16px"
          onclick="RC.togglePick('${p.cabin}')">${on?'✓ Elegida':'Elegir esta habitación'}</button></div>
      </div>`;}).join("");
    const steer=(d.steerClear||[]).slice(0,3).map(s=>
      `<li style="margin:0 0 6px">${s.cabin?`<b>Camarote ${s.cabin}</b> — `:s.area?`<b>${s.area}</b> — `:""}${s.reason||""}</li>`).join("");
    const sendBar=this.picked.size?`
      <div class="re-cta"><h3>${this.picked.size} ${this.picked.size>1?"habitaciones elegidas":"habitación elegida"}</h3>
        <p>Mándalas y una persona de verdad revisa la elección, el precio y el itinerario antes de que reserves.</p>
        <a class="re-btn yes" style="text-decoration:none;display:inline-block"
          href="/es/cabin-request.html?ship=${encodeURIComponent(this.roomsShip)}&cabins=${encodeURIComponent([...this.picked].join(","))}">Enviar mis elecciones</a></div>`
      : this.cta();
    this.stageEl.innerHTML = `
      <p class="re-progress">Tus habitaciones · ${this.roomsShip}</p>
      <h2 class="q">Aquí es donde yo te pondría.</h2>
      ${picks}
      ${steer?`<details class="why" style="margin:0 0 14px"><summary style="color:#ffca4f;font-weight:800">Mejor pasar de largo — ${(d.steerClear||[]).length} habitaciones que yo evitaría</summary>
        <ul style="margin:8px 0 0;padding-left:18px;font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.78)">${steer}</ul></details>`:""}
      ${sendBar}`;
  }
  togglePick(cabin){ this.picked.has(cabin)?this.picked.delete(cabin):this.picked.add(cabin); this.drawRooms(); }
  cta(){
    return `<div class="re-cta">
      <h3>¿Quieres que una persona de verdad le dé una revisada?</h3>
      <p>Mándanos lo que me contaste — la elección, el precio y el itinerario pasan por ojos humanos
      antes de que reserves nada. Sin costo, sin presión.</p>
      <a class="re-btn yes" style="text-decoration:none;display:inline-block" href="/es/cabin-request.html">Habla con nosotros</a>
    </div>`;
  }
}
const LANG="es";
const RC=new RoomConciergeFlow(); RC.landing();
</script>
</body>
</html>
