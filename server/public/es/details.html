<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sus datos | Still Afloat Cruising</title>
<!-- A guest's private link, opened from the page after Count me in or from the email: never indexed, and the address (which carries the link) is never sent on to another site. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:site_name" content="Still Afloat Cruising">
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* The "Your details" page (Mark 2026-10-23, design 5b): the group page's look. One centered column, a navy page, cloud-white panels, a short picture with the group's name on a plaque. */
:root{--navy:#07183f;--cloud:#f7fbff;--gold:#ffca4f;--yellow:#f5c33b;--ink:#07183f;--muted:#4a5a7a;--label:#9a6b00;--line:#dde6f3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--navy)}
body{font-family:'Baloo 2',system-ui,sans-serif;font-size:20px;line-height:1.5;color:#fff;min-height:100vh}
h1,h2,h3{font-family:'Bree Serif',Georgia,serif;font-weight:400;margin:0}
.wrap{max-width:640px;margin:0 auto}

/* header: the logo, nothing else */
.hdr{display:flex;align-items:center;padding:14px 20px 10px}
.hdr .logo{height:64px;width:auto;display:block}

/* picture: the group's own top picture (heroUrl) replaces the generic one and fades in once it has loaded */
.d-banner{position:relative;overflow:hidden;height:clamp(200px,52vw,240px);background:url('/assets/images/wheres-my-ship-hero.png') center 46%/cover no-repeat}
.d-banner.custom{background-image:none}
.d-hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;z-index:0;opacity:0;transition:opacity .5s ease}
.d-hero.on{opacity:1}
.d-lockup{position:absolute;left:0;right:0;bottom:18px;z-index:4;display:flex;justify-content:center;padding:0 12px}
.plaque{background:rgba(7,24,63,.86);border:1px solid rgba(255,202,79,.6);border-radius:999px;padding:9px 20px;max-width:100%;text-align:center}
.plaque span{font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:15px;line-height:1.4;color:#fff}

.intro{padding:24px 22px 6px}
.intro h1{font-size:36px;line-height:1.1;color:#fff;margin-bottom:8px}
.intro p{margin:0 0 10px;font-size:21px}

/* panels */
.panel{background:var(--cloud);color:var(--ink);border-radius:18px;margin:16px 16px;padding:22px 20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.label{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--label);margin:0 0 6px}
.panel h2{font-size:30px;line-height:1.1;color:var(--ink);margin-bottom:6px}
.panel p{margin:0 0 10px;font-size:19px;color:var(--ink)}
.panel .small{font-size:16px;color:var(--muted)}
.center{text-align:center}
.field{margin:12px 0 0}
.field label{display:block;font-size:16px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field input{display:block;width:100%;height:52px;border:2px solid #c9d6ea;border-radius:12px;background:#fff;padding:0 14px;font:inherit;font-size:19px;color:var(--ink);-webkit-appearance:none;appearance:none}
.field input::placeholder{color:#8a97b3}
.field input:focus{outline:3px solid rgba(245,195,59,.7);outline-offset:1px;border-color:#9a6b00}
.field input.done,.box.done{border-color:#9ac19a;background:#f3fbf3}
.box{min-height:52px;border:2px solid #c9d6ea;border-radius:12px;background:#fff;display:flex;align-items:center;padding:4px 14px;font-size:19px;color:var(--ink);word-break:break-word}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* the people coming */
.trav{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.trav .who{font-weight:800;font-size:17px;color:var(--label);letter-spacing:.06em;text-transform:uppercase}
.linkbtn{background:none;border:0;padding:8px 0 0;font:700 16px 'Baloo 2',sans-serif;color:var(--muted);text-decoration:underline;cursor:pointer}
.btn2{display:block;width:100%;cursor:pointer;margin:16px 0 4px;border:2px solid var(--navy);border-radius:999px;background:transparent;color:var(--ink);font:800 20px/1 'Baloo 2',sans-serif;padding:14px 10px;text-align:center}
.btn2:focus-visible,.linkbtn:focus-visible,.opt:focus-visible{outline:3px solid var(--navy);outline-offset:3px}

/* the four concierge questions: one answer each */
.q{margin:16px 0 6px;font-weight:800;font-size:19px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{cursor:pointer;border:2px solid #c9d6ea;background:#fff;border-radius:999px;padding:8px 14px;font:700 16px/1.3 'Baloo 2',sans-serif;color:var(--ink);text-align:left}
.opt.on{background:var(--yellow);border-color:var(--yellow)}

/* our pick */
.pick{background:#fff;border:2px solid var(--gold);border-radius:14px;padding:14px 16px;margin-top:6px}
.pick b{font-family:'Bree Serif',Georgia,serif;font-weight:400;font-size:24px;display:block;margin-bottom:4px}
.btn{display:block;width:100%;cursor:pointer;margin:18px 0 10px;border:0;border-radius:999px;background:#f5c33b;color:#07183f;font:800 26px/1 'Baloo 2',sans-serif;padding:20px 10px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.btn:disabled{opacity:.55;cursor:default}
.msg{margin:8px 0 0;font-size:19px;text-align:center}
.msg.err{color:#a12116}
.thanks-head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.tick{flex:none;width:54px;height:54px;border-radius:50%;background:#f5c33b;display:flex;align-items:center;justify-content:center;font:800 32px/1 'Baloo 2',sans-serif;color:#07183f}
.thanks-head h2{margin:0}

/* footer, as on the group page */
.foot{padding:26px 22px 24px}
.foot .sa{height:120px;width:auto;display:block;margin:0 auto 8px}
.foot p{margin:4px 0;text-align:center;font-size:15px;color:rgba(255,255,255,.88)}
.foot .cs-row{display:flex;justify-content:flex-end;margin-top:14px}
.foot .cs{height:46px;width:auto;opacity:.95}

#d-state{padding:60px 22px;text-align:center;font-size:22px;color:rgba(255,255,255,.9)}
@media(max-width:480px){
  .intro h1{font-size:32px}
  .panel{padding:20px 16px}
  .plaque{padding:8px 14px}
  .plaque span{letter-spacing:.12em}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <img class="logo" src="/assets/images/still_afloat_logo.png" alt="Still Afloat">
  </div>

  <div class="d-banner" id="d-banner"><div class="d-lockup"><div class="plaque"><span id="d-plaque">Sus datos</span></div></div></div>

  <div id="d-state"></div>
  <main id="d-main" hidden>

    <section class="intro" id="d-intro">
      <h1 id="d-h1"></h1>
      <p id="d-lede"></p>
    </section>

    <!-- Part 1: who is coming. What we already have is filled in; the guest adds each traveler's legal name and birthday. -->
    <section class="panel" id="d-part1">
      <p class="label" id="d-p1"></p>
      <div class="field"><label id="d-reach-l"></label><div class="box done" id="d-reach"></div></div>
      <div class="field"><label id="d-count-l"></label><div class="box done" id="d-count"></div></div>
      <p class="small" style="margin-top:12px" id="d-p1note"></p>
      <div id="d-travs"></div>
      <button type="button" class="btn2" id="d-add"></button>
      <p class="small center" id="d-max" hidden></p>
    </section>

    <!-- Part 2: the Room Concierge's four questions, one answer each. -->
    <section class="panel" id="d-part2">
      <p class="label" id="d-p2"></p>
      <p id="d-p2intro"></p>
      <div id="d-qs"></div>
      <p class="small center" id="d-wait" style="margin-top:14px"></p>
    </section>

    <!-- Part 3: our pick, once every name, birthday and answer is in. -->
    <section class="panel" id="d-part3" hidden>
      <p class="label" id="d-p3"></p>
      <div class="pick">
        <b id="d-pick-h"></b>
        <p style="margin:0 0 6px" id="d-pick-why"></p>
        <p class="small" style="margin:0" id="d-pick-alt" hidden></p>
      </div>
      <button type="button" class="btn" id="d-hold"></button>
      <p class="small center" id="d-hold-note"></p>
      <p class="small center" style="margin-top:8px" id="d-rather"></p>
    </section>

    <div class="hp" aria-hidden="true"><label>Sitio web<input type="text" id="d-website" tabindex="-1" autocomplete="off"></label></div>
    <div class="msg" id="d-msg" role="status"></div>

    <!-- The thank-you: the cabin is on hold, or Mark will call. -->
    <section class="panel" id="d-thanks" hidden>
      <div class="thanks-head"><div class="tick">&#10003;</div><h2 id="d-thanks-h"></h2></div>
      <p id="d-thanks-p"></p>
      <p class="small" id="d-thanks-phone"></p>
      <button type="button" class="linkbtn" id="d-change" hidden></button>
    </section>
  </main>

  <div class="foot">
    <img class="sa" src="/assets/images/still_afloat_logo.png" alt="Still Afloat">
    <p>Still Afloat LLC dba Still Afloat Cruising · mark@stillafloatcruising.com</p>
    <div class="cs-row"><img class="cs" src="/assets/images/cornerstone-white.png" alt=""></div>
  </div>

</div>

<script>
(function(){
  var ES = document.documentElement.lang === 'es';
  var PHONE = '919-346-6127';
  var T = ES ? {
    loading:'Cargando sus datos…', bad:'Este enlace no es válido. Abra el enlace completo de su correo, o llame o escriba a Mark al ' + PHONE + '.',
    title:'Sus datos', plaque:'Sus datos',
    h1:'Vamos a conseguirle una cabina, {first}.', lede:'Ya llenamos lo que nos dio. Tres partes cortas, unos tres minutos, y su cabina queda apartada.',
    p1:'Parte 1 · Quiénes vienen', reach:'Cómo comunicarnos con usted', howmany:'Cuántos son',
    p1note:'La naviera necesita el nombre legal y la fecha de nacimiento de cada viajero para apartar una cabina. Los números de pasaporte vienen después, en su página de documentos.',
    who_you:'Viajero 1 · usted', who_n:'Viajero {n}', legal_you:'Nombre legal, como aparece en su pasaporte', legal_other:'Nombre legal, como aparece en su pasaporte',
    ph_name:'Nombre y apellido', dob:'Fecha de nacimiento', add:'Agregar otro viajero', remove:'Quitar a este viajero',
    max:'Doce es el máximo en una lista. Llame o escriba a Mark para un grupo más grande.',
    p2:'Parte 2 · Qué cabina le conviene', p2intro:'Cuatro preguntas de nuestro Room Concierge. Toque una respuesta en cada una.',
    wait:'Cuando estén todos los nombres, las fechas y las respuestas, le mostramos nuestra sugerencia.',
    p3:'Parte 3 · Nuestra sugerencia para usted', want_other:'¿Prefiere {other}? Dígaselo a Mark cuando lo confirme.',
    hold:'Apartar mi cabina', holding:'Apartando…', saving:'Guardando…',
    hold_note:'Mark lo confirma con la naviera y le envía sus documentos.', hold_dep:'{deposit} por persona la aparta.', hold_free:'Aquí no se cobra nada.',
    rather:'¿Prefiere hablarlo? Llame o escriba a Mark al {phone}.',
    thanks_h:'¡Su cabina está apartada, {first}!', thanks_p:'Mark la confirma con la naviera y le envía sus documentos a este {kind}: {to}. No se cobra nada.',
    kind_email:'correo', kind_phone:'teléfono', questions:'¿Preguntas? Llame o escriba a Mark al {phone}.',
    call_h:'Listo, {first}.', call_p:'Mark le llamará o le escribirá en un día.', change:'¿Cambió de opinión? Termínelo usted.',
    err:'No se pudo guardar. Intente de nuevo, o llame o escriba a Mark al ' + PHONE + '.'
  } : {
    loading:'Loading your details…', bad:'This link is not valid. Please open the whole link from your email, or call or text Mark at ' + PHONE + '.',
    title:'Your details', plaque:'Your details',
    h1:"Let's get you a cabin, {first}.", lede:"We've filled in what you already gave us. Three short parts, about three minutes, and your cabin is held.",
    p1:"Part 1 · Who's coming", reach:'How to reach you', howmany:'How many of you',
    p1note:"The cruise line needs each traveler's legal name and date of birth to hold a cabin. Passport numbers come later, on your paperwork page.",
    who_you:'Traveler 1 · you', who_n:'Traveler {n}', legal_you:'Legal name, as on your passport', legal_other:'Legal name, as on their passport',
    ph_name:'First and last', dob:'Date of birth', add:'Add another traveler', remove:'Remove this traveler',
    max:'Twelve is the most on one list. Call or text Mark for a bigger party.',
    p2:'Part 2 · Which cabin suits you', p2intro:'Four questions from our Room Concierge. Tap one answer each.',
    wait:'When every name, birthday and answer is in, we show you our pick.',
    p3:'Part 3 · Our pick for you', want_other:'Want {other} instead? Tell Mark when he confirms.',
    hold:'Hold my cabin', holding:'Holding…', saving:'Saving…',
    hold_note:'Mark confirms it with the cruise line and sends your paperwork.', hold_dep:'{deposit} per person holds it.', hold_free:'Nothing is charged here.',
    rather:'Rather talk it through? Call or text Mark at {phone}.',
    thanks_h:'Your cabin is on hold, {first}!', thanks_p:'Mark confirms it with the cruise line and sends your paperwork to this {kind}: {to}. Nothing is charged.',
    kind_email:'email', kind_phone:'phone number', questions:'Questions? Call or text Mark at {phone}.',
    call_h:'Got it, {first}.', call_p:'Mark will call or text you within a day.', change:'Changed your mind? Finish it yourself.',
    err:'That did not go through. Please try again, or call or text Mark at ' + PHONE + '.'
  };

  // The four Room Concierge questions, in the design's words: [label, value] for each answer. The values are the Room Concierge's own (lib/concierge-interview.ts);
  // the last question has three answers because "I can grin and bear it" counts as a no, as it does there.
  var Q = ES ? [
    { k:'room', q:'¿Cómo se imagina usando su cabina?', o:[['Para dormir y recargar pilas','inside'],['Despertar con luz de día y mar','oceanview'],['Café afuera en pijama','balcony'],['La cabina es parte de las vacaciones','suite']] },
    { k:'priority', q:'¿Qué es lo que más importa ya a bordo?', o:[['Despertar viendo el mar','ocean'],['Paz y tranquilidad','quiet'],['Estar cerca de la acción','action'],['Espacio de sobra','space']] },
    { k:'budget', q:'¿Cómo anda el presupuesto del viaje, siendo honestos?', o:[['Hay un número, y lo respetamos','lean'],['Cómodo, pero cada dólar debe ganarse su lugar','middle'],['Por la cabina correcta, el presupuesto se mueve','treat'],['El presupuesto es lo que haga falta para que quede perfecto','sky']] },
    { k:'motion', q:'¿Alguien se marea en el barco?', o:[['Sí, manténganos estables','yes'],['No, estamos bien','no'],['Lo aguanto con una sonrisa','no']] }
  ] : [
    { k:'room', q:'How do you picture using your room?', o:[['Crash and recharge','inside'],['Wake up to daylight and water','oceanview'],['Coffee outside in my pajamas','balcony'],['The room is part of the vacation','suite']] },
    { k:'priority', q:"What matters most once you're aboard?", o:[['Waking up to the ocean','ocean'],['Peace and quiet','quiet'],['Being near the action','action'],['Room to spread out','space']] },
    { k:'budget', q:'How does the trip budget work, honestly?', o:[["There's a number, and we respect it",'lean'],['Comfortable, but every dollar should earn its spot','middle'],['For the right room, the budget moves','treat'],['The budget is whatever makes it perfect','sky']] },
    { k:'motion', q:'Does anyone get seasick?', o:[['Yes, keep us steady','yes'],["No, we're fine",'no'],['I can grin and bear it','no']] }
  ];
  var MAXT = 12;

  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML.replace(/"/g,'&quot;'); }
  function fill(tpl, v){ return tpl.replace(/\{(\w+)\}/g, function(_, k){ return v[k] == null ? '' : v[k]; }); }
  function show(id, on){ var e=$(id); if(e) e.hidden = on === false; }

  var qs = new URLSearchParams(location.search);
  var token = (qs.get('t') || '').trim();
  var state = $('d-state');
  state.textContent = T.loading;
  if(!/^[A-Za-z0-9_-]{43}$/.test(token)){ state.textContent = T.bad; return; }

  var data = null;           // what the server knows (GET)
  var travelers = [];        // [{ name, dob }] as typed, one per person
  var sel = {};              // question key -> index of the answer tapped
  var pick = null;           // our pick, once saved
  var lastSent = '';         // the payload the saved pick belongs to
  var timer = null;

  function msg(text){ var m = $('d-msg'); m.className = text ? 'msg err' : 'msg'; m.textContent = text || ''; }

  // ── What the server says about a name, a birthday and the answers (the same rules, so Part 3 only appears for something it will take) ──
  var NAME_RE = /^[\p{L}\p{M}][\p{L}\p{M}'’.\- ]*$/u;
  function tidy(n){ return String(n || '').replace(/\s+/g, ' ').trim(); }
  function validName(n){ n = tidy(n); return n.length >= 2 && n.length <= 80 && NAME_RE.test(n) && (n.match(/\p{L}/gu) || []).length >= 2; }
  function validDob(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if(!m) return false;
    var y = +m[1], mo = +m[2], d = +m[3], date = new Date(Date.UTC(y, mo - 1, d));
    if(date.getUTCFullYear() !== y || date.getUTCMonth() !== mo - 1 || date.getUTCDate() !== d) return false;
    var now = new Date(), today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()), oldest = Date.UTC(now.getFullYear() - 120, now.getMonth(), now.getDate());
    return date.getTime() <= today && date.getTime() > oldest;
  }
  function answers(){
    var out = {};
    for(var i = 0; i < Q.length; i++){ if(sel[Q[i].k] === undefined) return null; out[Q[i].k] = Q[i].o[sel[Q[i].k]][1]; }
    return out;
  }
  function ready(){
    if(!travelers.length || !answers()) return false;
    for(var i = 0; i < travelers.length; i++){ if(!validName(travelers[i].name) || !validDob(travelers[i].dob)) return false; }
    return true;
  }
  function payload(){
    return { travelers: travelers.map(function(t){ return { legal_name: tidy(t.name), dob: t.dob }; }), concierge: answers(), lang: ES ? 'es' : 'en' };
  }

  function api(path, body){
    var b = body || {};
    b.website = $('d-website').value;   // the bot trap: a person never fills it
    return fetch('/api/group-details/' + token + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, status: r.status, j: j }; }, function(){ return { ok: r.ok, status: r.status, j: {} }; }); });
  }

  // ── Part 1: the people coming ──
  function renderTravelers(){
    var h = '';
    travelers.forEach(function(t, i){
      h += '<div class="trav"><div class="who">' + esc(i === 0 ? T.who_you : fill(T.who_n, { n: i + 1 })) + '</div>'
        + '<div class="field"><label for="d-name-' + i + '">' + esc(i === 0 ? T.legal_you : T.legal_other) + '</label>'
        + '<input id="d-name-' + i + '" type="text" data-i="' + i + '" data-f="name" autocomplete="' + (i === 0 ? 'name' : 'off') + '" placeholder="' + esc(T.ph_name) + '" value="' + esc(t.name) + '"' + (validName(t.name) ? ' class="done"' : '') + '></div>'
        + '<div class="field"><label for="d-dob-' + i + '">' + esc(T.dob) + '</label>'
        + '<input id="d-dob-' + i + '" type="date" data-i="' + i + '" data-f="dob" autocomplete="' + (i === 0 ? 'bday' : 'off') + '" value="' + esc(t.dob) + '"' + (validDob(t.dob) ? ' class="done"' : '') + '></div>'
        + (i > 0 ? '<button type="button" class="linkbtn" data-act="remove" data-i="' + i + '">' + esc(T.remove) + '</button>' : '')
        + '</div>';
    });
    $('d-travs').innerHTML = h;
    $('d-count').textContent = String(travelers.length);
    show('d-add', travelers.length < MAXT);
    show('d-max', travelers.length >= MAXT);
  }

  // ── Part 2: the four questions ──
  function renderQuestions(){
    var h = '';
    Q.forEach(function(q){
      h += '<p class="q">' + esc(q.q) + '</p><div class="opts">';
      q.o.forEach(function(o, j){
        var on = sel[q.k] === j;
        h += '<button type="button" class="opt' + (on ? ' on' : '') + '" data-q="' + q.k + '" data-i="' + j + '" data-v="' + o[1] + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(o[0]) + '</button>';
      });
      h += '</div>';
    });
    $('d-qs').innerHTML = h;
  }

  // ── Part 3: our pick ──
  function showPick(){
    var p = pick;
    $('d-pick-h').textContent = p.category + ', ' + p.where;
    $('d-pick-why').textContent = p.why;
    // The other category, when the group has two or more: the next one up, or the one below when this is the top (the server sorts them by price)
    var held = data.held || [], at = -1, i;
    for(i = 0; i < held.length; i++){ if(held[i].category === p.category) at = i; }
    var other = at >= 0 && held.length > 1 ? held[at + 1 < held.length ? at + 1 : at - 1].category : '';
    $('d-pick-alt').textContent = other ? fill(T.want_other, { other: other }) : '';
    show('d-pick-alt', !!other);
    var note = T.hold_note + (data.depositPerPersonText ? ' ' + fill(T.hold_dep, { deposit: data.depositPerPersonText }) : '') + ' ' + T.hold_free;
    $('d-hold-note').textContent = note;
    $('d-rather').textContent = fill(T.rather, { phone: PHONE });
    $('d-hold').disabled = false; $('d-hold').textContent = T.hold;
    show('d-part3', true); show('d-wait', false);
  }
  function hidePick(){ show('d-part3', false); show('d-wait', true); }

  // Called after every change. A complete, valid form is saved (once it settles) and answered with our pick; anything less takes Part 3 away.
  function refresh(){
    clearTimeout(timer);
    if(!ready()){ pick = null; lastSent = ''; hidePick(); return; }
    if(pick && JSON.stringify(payload()) === lastSent){ showPick(); return; }
    hidePick();
    timer = setTimeout(save, 350);
  }
  function save(){
    if(!ready()) return;
    var body = payload(), key = JSON.stringify(body);
    msg(''); var w = $('d-wait'); w.textContent = T.saving; show('d-wait', true);
    api('', body).then(function(x){
      w.textContent = T.wait;
      if(JSON.stringify(payload()) !== key) return;   // they changed something while it saved: a newer save is on its way
      if(x.ok && x.j && x.j.pick){ pick = x.j.pick; lastSent = key; msg(''); showPick(); }
      else if(x.status === 409){ msg((x.j && x.j.error) || T.err); }
      else msg((x.j && x.j.error) || T.err);
    }).catch(function(){ w.textContent = T.wait; msg(T.err); });
  }

  // ── The thank-yous ──
  function showThanks(kind){
    show('d-intro', false); show('d-part1', false); show('d-part2', false); show('d-part3', false); msg('');
    var first = data.firstName || '';
    if(kind === 'hold'){
      var to = data.email || data.phone || '';
      $('d-thanks-h').textContent = fill(T.thanks_h, { first: first });
      $('d-thanks-p').textContent = fill(T.thanks_p, { kind: data.email ? T.kind_email : T.kind_phone, to: to });
      var line = typeof data.phoneLine === 'string' && /\d{3}[-. ]\d{3}[-. ]\d{4}/.test(data.phoneLine) ? data.phoneLine : fill(T.questions, { phone: PHONE });
      $('d-thanks-phone').textContent = line; show('d-thanks-phone', true); show('d-change', false);
    } else {
      $('d-thanks-h').textContent = fill(T.call_h, { first: first });
      $('d-thanks-p').textContent = T.call_p;
      show('d-thanks-phone', false);
      $('d-change').textContent = T.change; show('d-change', true);
    }
    show('d-thanks', true);
  }
  function showForm(){ show('d-thanks', false); show('d-intro', true); show('d-part1', true); show('d-part2', true); refresh(); }

  $('d-travs').addEventListener('input', function(e){
    var t = e.target, i = Number(t.getAttribute('data-i')), fld = t.getAttribute('data-f');
    if(!travelers[i] || (fld !== 'name' && fld !== 'dob')) return;
    travelers[i][fld] = t.value;
    t.className = (fld === 'name' ? validName(t.value) : validDob(t.value)) ? 'done' : '';
    refresh();
  });
  $('d-travs').addEventListener('click', function(e){
    var t = e.target, i = Number(t.getAttribute('data-i'));
    if(t.getAttribute('data-act') !== 'remove' || i < 1 || !travelers[i]) return;   // the first block is the guest: it has no remove button
    travelers.splice(i, 1); renderTravelers(); refresh();
  });
  $('d-add').addEventListener('click', function(){
    if(travelers.length >= MAXT) return;
    travelers.push({ name: '', dob: '' }); renderTravelers(); refresh();
  });
  $('d-qs').addEventListener('click', function(e){
    var t = e.target, k = t.getAttribute('data-q'), j = Number(t.getAttribute('data-i'));
    if(!k || isNaN(j)) return;
    sel[k] = j; renderQuestions(); refresh();
  });
  $('d-hold').addEventListener('click', function(){
    var b = $('d-hold'); b.disabled = true; b.textContent = T.holding; msg('');
    api('/hold', {}).then(function(x){
      if(x.ok){ showThanks('hold'); }
      else { b.disabled = false; b.textContent = T.hold; msg((x.j && x.j.error) || T.err); }
    }).catch(function(){ b.disabled = false; b.textContent = T.hold; msg(T.err); });
  });
  $('d-change').addEventListener('click', showForm);

  // ── The picture: the group's own, set as an <img> source only when it is https (the API has already refused any that is not on our hosts) ──
  function applyHero(url){
    if(typeof url !== 'string' || !/^https:\/\//i.test(url)) return;
    var banner = $('d-banner'), img = document.createElement('img');
    img.className = 'd-hero'; img.alt = ''; img.decoding = 'async';
    img.onload = function(){ img.className = 'd-hero on'; banner.className = 'd-banner custom'; };
    img.onerror = function(){ if(img.parentNode) img.parentNode.removeChild(img); };
    img.src = url;
    banner.insertBefore(img, banner.firstChild);
  }

  function render(d){
    data = d;
    state.hidden = true; show('d-main', true);
    document.title = T.title + ' | ' + d.label;
    $('d-plaque').textContent = d.label;
    applyHero(d.heroUrl);
    $('d-h1').textContent = fill(T.h1, { first: d.firstName || '' });
    $('d-lede').textContent = T.lede;
    $('d-p1').textContent = T.p1; $('d-reach-l').textContent = T.reach; $('d-count-l').textContent = T.howmany;
    $('d-reach').textContent = [d.email, d.phone].filter(Boolean).join(' · ');
    $('d-p1note').textContent = T.p1note; $('d-add').textContent = T.add; $('d-max').textContent = T.max;
    $('d-p2').textContent = T.p2; $('d-p2intro').textContent = T.p2intro; $('d-wait').textContent = T.wait;
    $('d-p3').textContent = T.p3;

    // What the guest already entered (a second visit) is back in the form; otherwise one block per person they said was coming, the first with their own name.
    var saved = Array.isArray(d.travelers) ? d.travelers : [];
    if(saved.length){ travelers = saved.map(function(t){ return { name: t.legal_name || '', dob: t.dob || '' }; }); }
    else {
      var n = Math.min(Math.max(parseInt(d.guests, 10) || 1, 1), MAXT);
      for(var i = 0; i < n; i++) travelers.push({ name: i === 0 ? tidy((d.firstName || '') + ' ' + (d.lastName || '')) : '', dob: '' });
    }
    if(d.concierge){
      Q.forEach(function(q){ var v = d.concierge[q.k]; for(var j = 0; j < q.o.length; j++){ if(q.o[j][1] === v){ sel[q.k] = j; break; } } });
    }
    renderTravelers(); renderQuestions();

    if(d.holdRequestedAt){ showThanks('hold'); return; }
    if(qs.get('choice') === 'call'){
      // "Mark, call me" (the button on the group page, or the one in the email): tell us, and only then say Mark will call. If it did not go through, the guest gets the form back.
      show('d-intro', false); show('d-part1', false); show('d-part2', false); show('d-part3', false);
      api('/choice', { choice: 'call' }).then(function(x){ if(x.ok) showThanks('call'); else { showForm(); msg((x.j && x.j.error) || T.err); } })
        .catch(function(){ showForm(); msg(T.err); });
      return;
    }
    if(d.pick && d.concierge && saved.length && ready()){ pick = d.pick; lastSent = JSON.stringify(payload()); showPick(); } else hidePick();
  }

  fetch('/api/group-details/' + token)
    .then(function(r){ if(!r.ok) throw new Error('gone'); return r.json(); })
    .then(render)
    .catch(function(){ state.textContent = T.bad; });
})();
</script>
</body>
</html>
