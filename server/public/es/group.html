<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crucero en grupo | Still Afloat Cruising</title>
<!-- A group page is shared by private link with the group's own people. It is never indexed. -->
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="Still Afloat Cruising">
<meta property="og:type" content="website">
<meta property="og:image" content="https://stillafloatcruising.com/assets/images/still_afloat_logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:linear-gradient(to bottom,#06111f 0%,#0b2238 40%,#102f4d 100%);min-height:100vh;font-family:'Baloo 2',system-ui,sans-serif;font-size:20px;color:#fff;line-height:1.5}
h1,h2,h3{font-family:'Bree Serif',Georgia,serif;font-weight:400}

/* Branded banner + plaque — the Weather / Where's My Ship pattern */
.gp-banner{position:relative;overflow:hidden;border-bottom:5px solid #5dff9a;
  background:url('/assets/images/wheres-my-ship-hero.png') center 46%/cover no-repeat;height:clamp(380px,40vw,600px)}
.gp-banner::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(6,17,31,.30) 0%,rgba(6,17,31,.05) 24%,rgba(6,17,31,.05) 60%,rgba(6,17,31,.88) 100%)}
/* The group's own top picture (look.heroUrl) replaces the generic one; it fills the hero and fades in once it has loaded. */
.gp-banner.custom{background-image:none}
.gp-hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;z-index:0;opacity:0;transition:opacity .5s ease}
/* The hosts' photo (look.hostPhotoUrl): small, framed, in the TOP-RIGHT corner of the picture (the site menu sits above the picture, not on it — Mark 2026-10-20: "the inset is not in the correct place"); never near the centre of the hero. */
.gp-host{position:absolute;top:18px;right:22px;z-index:5;box-sizing:border-box;width:clamp(120px,28%,300px);aspect-ratio:4/3;object-fit:cover;object-position:center 30%;
  background:#fff;border:6px solid #fff;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.38);opacity:0;transition:opacity .5s ease}
.gp-hero.on,.gp-host.on{opacity:1}
.gp-lockup{position:absolute;left:0;right:0;bottom:22px;z-index:4;display:flex;justify-content:center;padding:0 20px}
.gp-plaque{display:inline-flex;align-items:center;gap:13px;background:rgba(4,14,28,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:9px 24px;max-width:92vw}
.gp-plaque .dash{width:20px;height:3px;border-radius:2px;background:rgba(255,211,0,.7);flex:none}
.gp-plaque .txt{margin:0;font-family:inherit;color:rgba(255,255,255,.96);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(15px,1.5vw,19px);line-height:1.5;text-align:center}

.shell{max-width:1100px;margin:auto;padding:44px 22px 90px}
.section{margin-bottom:54px}
.section h2{font-size:clamp(28px,3vw,36px);margin:0 0 12px;color:#fff}
.section h3{font-size:clamp(22px,2.4vw,27px);margin:28px 0 10px;color:#fff}
.section p{margin:0 0 14px;color:rgba(255,255,255,.9);font-size:20px;white-space:pre-line}
.hint{color:rgba(255,255,255,.72);font-size:18px}
/* The welcome (Mark 2026-10-20: the person arriving has just read the poster, the post or the email, so the page opens on a short personal note
   from the hosts and then the form, and never repeats the headline or the pitch). Large, warm type; the signature in the gold accent. */
.welcome{margin-bottom:38px}
.welcome .note{font-size:clamp(21px,2.3vw,27px);line-height:1.55;color:#fff;margin:0 0 14px;white-space:pre-line}
.welcome .sig{font-family:'Bree Serif',Georgia,serif;font-size:clamp(23px,2.5vw,30px);line-height:1.25;color:#ffca4f;margin:0}

.preview-bar{background:#ffd21f;color:#07183f;text-align:center;font-weight:700;padding:10px 16px;font-size:18px}
.langswitch{text-align:right;margin:-14px 0 18px}
.langswitch a{color:#5dff9a;font-size:18px;font-weight:600;text-decoration:none;border:1px solid rgba(93,255,154,.35);border-radius:999px;padding:5px 16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0 0 8px}
.stat{background:rgba(10,30,56,.9);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 18px}
.stat .k{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.stat .v{font-size:23px;font-weight:700;color:#fff;line-height:1.25;margin-top:4px}

.card{background:rgba(10,30,56,.9);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:22px 24px}
table{width:100%;border-collapse:collapse;font-size:19px}
th{text-align:left;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.66);font-weight:600;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.18)}
td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.09);vertical-align:top;color:rgba(255,255,255,.94)}
tr:last-child td{border-bottom:none}
.sea{color:rgba(255,255,255,.62);font-style:italic}
ul.perks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.perks li{display:flex;gap:12px;align-items:flex-start;font-size:20px}
ul.perks li i{color:#5dff9a;margin-top:6px}
/* Your cabin: each category and what it starts at, per person. Names and prices only; never a count of cabins left. */
ul.cabins{list-style:none;margin:0;padding:0}
ul.cabins li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:21px}
ul.cabins li:last-child{border-bottom:none}
ul.cabins .cat{font-weight:700}
ul.cabins .amt{color:#ffd21f;font-weight:700}
ul.cabins .amt small{font-size:17px;font-weight:400;color:rgba(255,255,255,.72)}
.fromline{font-size:22px;font-weight:700;color:#ffd21f;margin:0 0 6px}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score .n{font-family:'Bree Serif',serif;font-size:46px;color:#ffd21f;line-height:1}
.score .n small{font-size:20px;color:rgba(255,255,255,.7)}
blockquote{margin:0;padding:4px 0 4px 20px;border-left:4px solid #5dff9a;font-size:21px;color:rgba(255,255,255,.94);white-space:pre-line}
blockquote cite{display:block;margin-top:8px;font-style:normal;font-size:18px;color:rgba(255,255,255,.72)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
label{display:block;font-size:17px;color:rgba(255,255,255,.82);margin-bottom:5px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;box-sizing:border-box;background:rgba(4,14,28,.7);border:1px solid rgba(255,255,255,.24);
  border-radius:12px;color:#fff;font:inherit;font-size:19px;padding:11px 14px}
textarea{min-height:96px;resize:vertical}
select option{color:#07183f}
.check{display:flex;gap:10px;align-items:flex-start;font-size:18px;color:rgba(255,255,255,.86)}
.check input{width:20px;height:20px;margin-top:4px;flex:none}
/* The call to action: a yellow pill, navy bold type (the approved marketing's button). */
.btn{display:inline-block;cursor:pointer;border:0;border-radius:999px;background:#f5c33b;color:#07183f;
  font:inherit;font-weight:800;font-size:23px;line-height:1.2;padding:16px 52px;box-shadow:0 5px 16px rgba(0,0,0,.35);transition:transform .15s ease,box-shadow .15s ease}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn:disabled{opacity:.55;cursor:default}
.msg{margin-top:14px;font-size:19px}
.msg.ok{color:#5dff9a}.msg.err{color:#ffd21f}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.fine,.section p.fine{font-size:17px;color:rgba(255,255,255,.7)}
/* FlexPay: the logo is dark green and the page is dark navy, so it sits on a small white chip (smaller than the Still Afloat logo in the header). */
.flexpay{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 10px}
.flexpay .chip{display:inline-flex;align-items:center;flex:none;background:#fff;border-radius:10px;padding:3px 10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.flexpay .chip img{display:block;height:34px;width:auto}
.flexpay .words{font-size:19px;font-weight:600;color:rgba(255,255,255,.94)}
.mark{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.mark p{flex:1;min-width:260px}
footer{text-align:center;padding:26px 20px 40px;color:rgba(255,255,255,.66);font-size:16px}
#gp-state{padding:80px 22px;text-align:center;font-size:22px;color:rgba(255,255,255,.85)}
@media(max-width:768px){.gp-host{top:12px;right:12px}}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}table{font-size:17px}td,th{padding:9px 6px}.shell{padding:30px 16px 70px}.btn{display:block;width:100%;padding:16px 24px}}
</style>
</head>
<body>
<div id="navbar-container"></div>

<div id="gp-preview" class="preview-bar" hidden></div>
<div class="gp-banner"><div class="gp-lockup"><div class="gp-plaque"><span class="dash"></span><h1 class="txt" id="gp-plaque">Crucero en grupo</h1><span class="dash"></span></div></div></div>

<div id="gp-state"></div>
<main class="shell" id="gp-main" hidden>
  <div class="langswitch" id="gp-lang" hidden></div>

  <!-- 1. The welcome: a short personal note from the hosts (Mark 2026-10-20). The poster, the post and the email already made the pitch, so the
       page does not: no headline, no payoff, no intro. Hidden for a group whose copy was written before the welcome existed. -->
  <section class="section welcome" id="sec-welcome" hidden>
    <p class="note" id="gp-welcome"></p>
    <p class="sig" id="gp-sig"></p>
  </section>

  <!-- 2. Count me in, directly under the welcome. The page asks one thing, "I'm interested": no cabin picker, no availability, no cabin count
       (Mark 2026-10-19: "why would they see the available cabins before I know they are interested"). -->
  <section class="section" id="interest">
    <h2 id="gp-cta-title"></h2>
    <p id="gp-cta-blurb"></p>
    <div class="card">
      <form id="gp-form" novalidate>
        <div class="form-grid">
          <div><label for="f-first" data-t="first"></label><input id="f-first" type="text" autocomplete="given-name" required></div>
          <div><label for="f-last" data-t="last"></label><input id="f-last" type="text" autocomplete="family-name"></div>
          <div><label for="f-email" data-t="email"></label><input id="f-email" type="email" autocomplete="email" required></div>
          <div><label for="f-phone" data-t="phone"></label><input id="f-phone" type="tel" autocomplete="tel"></div>
          <div><label for="f-guests" data-t="party"></label><select id="f-guests"></select></div>
          <div class="full"><label for="f-note" data-t="note"></label><textarea id="f-note"></textarea></div>
          <div class="full"><label class="check"><input type="checkbox" id="f-news"><span data-t="news"></span></label></div>
          <div class="hp" aria-hidden="true"><label>Sitio web<input type="text" id="f-website" tabindex="-1" autocomplete="off"></label></div>
          <div class="full" id="gp-turnstile"></div>
          <div class="full"><button class="btn" type="submit" id="gp-submit"></button><div class="msg" id="gp-msg" role="status"></div></div>
        </div>
      </form>
    </div>
    <p class="fine" style="margin-top:12px" data-t="no_payment"></p>
  </section>

  <!-- 3. The plan, day by day: the sailing at a glance, then the itinerary. -->
  <section class="section" id="sec-itin">
    <h2 data-t="itinerary"></h2>
    <div class="stats" id="gp-stats" style="margin-bottom:18px"></div>
    <div id="gp-itin-wrap" hidden>
      <div class="card"><table><thead><tr><th data-t="day"></th><th data-t="date"></th><th data-t="port"></th><th data-t="inport"></th></tr></thead><tbody id="gp-itin"></tbody></table></div>
      <p class="fine" style="margin-top:12px" data-t="itin_note"></p>
    </div>
  </section>

  <!-- 4. Your cabin: the categories and what each starts at, the price note, the FlexPay plans line, the upgrade offer and what the fare includes.
       Only what the fare really includes (the group file's inclusions) and what Mark's own interview answers say is planned; never a filler line. -->
  <section class="section" id="sec-cabin">
    <h2 data-t="cabin"></h2>
    <div class="card" id="gp-cabin-card" hidden><ul class="cabins" id="gp-cabin-prices"></ul></div>
    <p class="fromline" id="gp-from" hidden></p>
    <p class="fine" id="gp-fine" style="margin-top:10px"></p>
    <!-- Every group is enrolled with FlexPay (the business is): the plans line sits directly under the price note on every page. -->
    <div class="flexpay" id="gp-flex"><span class="chip"><img src="/assets/images/flexpay-logo.png" alt="FlexPay" height="34"></span><span class="words" data-t="flex"></span></div>
    <p class="fine" id="gp-upgrades" style="margin:0"></p>
    <div id="sec-perks" hidden>
      <h3 data-t="included"></h3>
      <div class="card"><ul class="perks" id="gp-perks"></ul></div>
    </div>
    <div id="sec-planned" hidden>
      <p class="fine" style="margin:18px 0 0"><strong data-t="planned"></strong> <span id="gp-planned"></span></p>
    </div>
  </section>

  <!-- 5. Getting there: flights, hotel and transfers, in the guest's words. Never the airline, hotel or transfer company (Mark 2026-10-20);
       a hotel is priced per room, the rest per person. -->
  <section class="section" id="sec-travel" hidden>
    <h2 data-t="travel"></h2>
    <div class="card"><ul class="perks" id="gp-travel"></ul></div>
  </section>

  <!-- 6. The ship's Conga Line score, compact, only when the group shows it. -->
  <section class="section" id="sec-rating" hidden>
    <div class="card" id="gp-rating">
      <div class="score"><div class="n"><span id="gp-score"></span><small> / 5</small></div><div><div style="font-weight:700" data-t="score_label"></div><div class="hint" data-t="score_hint"></div></div></div>
      <p id="gp-score-comment" style="margin:12px 0 0"></p>
      <p id="gp-score-salty" class="hint" style="margin:8px 0 0"></p>
    </div>
  </section>

  <section class="section" id="sec-org" hidden><blockquote><span id="gp-org"></span><cite id="gp-org-cite"></cite></blockquote></section>

  <section class="section" id="sec-dates" hidden>
    <h2 data-t="dates"></h2>
    <div class="stats" id="gp-dates"></div>
  </section>

  <section class="section">
    <h2 data-t="about"></h2>
    <div class="mark"><p data-t="bio"></p></div>
    <p class="fine" id="gp-legal"></p>
  </section>
</main>

<footer><p>© 2026 Still Afloat LLC — Cruise smarter. Laugh more.</p></footer>

<script>
(function(){
  var ES = document.documentElement.lang === 'es';
  var T = ES ? {
    loading:'Cargando la invitación…', gone:'Esta página no está disponible. Si recibió el enlace de su grupo, escriba a mark@stillafloatcruising.com.',
    preview:'VISTA PREVIA — solo usted puede ver esta página hasta que la apruebe.',
    ship:'Barco', sails:'Zarpa', returns:'Regresa', nights:'Noches', from:'Sale de', price_from:'Desde', pp:'por persona',
    itinerary:'El plan, día a día', cabin:'Su cabina', from_lc:'desde', day:'Día', date:'Fecha', port:'Puerto', inport:'En puerto', sea:'Día en el mar',
    itin_note:'Los horarios y puertos los fija la naviera y pueden cambiar.',
    included:'Incluido para cada huésped', travel:'Cómo llegar', planned:'Planeado para el grupo:', upgrades:'Mejoras de cabina disponibles — pregunte a Mark', price_note:'Precio por persona, con dos huéspedes por cabina. El precio, los impuestos, las tasas y los cargos portuarios se confirman por escrito al reservar.',
    price_note_tax:'Precio por persona, con dos huéspedes por cabina, con impuestos y cargos portuarios incluidos.', flex:'Planes de pago flexibles disponibles', hosts:'Sus anfitriones',
    score_label:'Puntaje Conga Line', score_hint:'Lo que dicen los cruceristas, resumido por Still Afloat.',
    dates:'Fechas que importan', book_by:'Reserve antes de', final_pay:'Pago final', sail_day:'Día de salida',
    first:'Nombre', last:'Apellido', email:'Correo electrónico', phone:'Teléfono (opcional)', party:'¿Cuántas personas en su grupo?', count_me_in:'¡Cuenten conmigo!',
    note:'Preguntas o necesidades (movilidad, dieta, quién viaja con usted)', news:'Quiero recibir también el boletín de Still Afloat. Le enviaremos un correo para confirmarlo.',
    no_payment:'Aquí no se paga nada ni se pide tarjeta. Le respondemos personalmente, por lo general el mismo día.',
    sent:'Recibido. Le escribiremos pronto.', sending:'Enviando…', err:'No se pudo enviar. Escriba a mark@stillafloatcruising.com.',
    about:'Su asesor de cruceros', bio:'Soy Mark Millham — veterano de EE. UU., gerente de TI retirado, exmarinero de a bordo y asesor de cruceros independiente con más de 20 años en el agua (Cornerstone Collective).',
    sailing_too:' Yo también viajo con el grupo.', legal_a:'Afiliado de', other:'English', title:'Crucero en grupo'
  } : {
    loading:'Loading the invitation…', gone:'This page is not available. If your group sent you the link, email mark@stillafloatcruising.com.',
    preview:'PREVIEW — only you can see this page until you approve it.',
    ship:'Ship', sails:'Sails', returns:'Returns', nights:'Nights', from:'Sails from', price_from:'From', pp:'per person',
    itinerary:'The plan, day by day', cabin:'Your cabin', from_lc:'from', day:'Day', date:'Date', port:'Port', inport:'In port', sea:'Day at sea',
    itin_note:'Times and ports are set by the cruise line and can change.',
    included:'Included for every guest', travel:'Getting there', planned:'Planned for the group:', upgrades:'Cabin upgrades available — ask Mark', price_note:'Price is per person, based on two guests per cabin. The price, taxes, fees and port expenses are confirmed in writing when you book.',
    price_note_tax:'Price is per person, based on two guests per cabin, with taxes and port fees included.', flex:'Flexible Payment Plans Available', hosts:'Your hosts',
    score_label:'Conga Line score', score_hint:'What cruisers say, summed up by Still Afloat.',
    dates:'Dates that matter', book_by:'Reserve by', final_pay:'Final payment', sail_day:'Sailing day',
    first:'First name', last:'Last name', email:'Email', phone:'Phone (optional)', party:'How many in your party', count_me_in:'Count me in!',
    note:'Questions or needs (mobility, diet, who is traveling with you)', news:'Also send me the Still Afloat newsletter. We will email you to confirm.',
    no_payment:'Nothing is paid here and no card is asked for. We reply personally, usually the same day.',
    sent:'Got it. We will be in touch soon.', sending:'Sending…', err:'That did not go through. Email mark@stillafloatcruising.com.',
    about:'Your cruise advisor', bio:"I'm Mark Millham — U.S. veteran, retired senior IT manager, former liveaboard sailor, and independent cruise advisor with 20+ years on the water (Cornerstone Collective).",
    sailing_too:' I am sailing with the group too.', legal_a:'Affiliate of', other:'Español', title:'Group Cruise'
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function show(id){ var e=$(id); if(e) e.hidden=false; }
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = T[el.getAttribute('data-t')] || ''; });

  var qs = new URLSearchParams(location.search);
  var code = (qs.get('g') || '').trim();
  // A preview carries the dashboard token in the FRAGMENT (never sent to the server in the URL, never logged).
  var hm = location.hash.match(/[#&]preview=([^&]+)/);
  var previewToken = hm ? decodeURIComponent(hm[1]) : '';
  var state = $('gp-state');
  state.textContent = T.loading;
  if(!/^[a-hjkmnp-z2-9]{10}$/.test(code)){ state.textContent = T.gone; return; }

  var headers = previewToken ? { 'x-affiliate-token': previewToken } : {};
  fetch('/api/group-page/' + code + '?lang=' + (ES ? 'es' : 'en'), { headers: headers })
    .then(function(r){ if(!r.ok) throw new Error('gone'); return r.json(); })
    .then(render)
    .catch(function(){ state.textContent = T.gone; });

  var turnstileToken = null, siteKey = '';

  // The group's own look (the API has already refused any picture that is not on our own hosts; the page checks it is https once more).
  // The pictures are set as an <img> source, never written into markup. A picture that does not load is dropped and the usual page shows.
  function lookImage(url, cls, alt, onShow){
    if(typeof url !== 'string' || !/^https:\/\//i.test(url)) return null;
    var img = document.createElement('img');
    img.className = cls; img.alt = alt; img.decoding = 'async';
    img.onload = function(){ img.className = cls + ' on'; if(onShow) onShow(); };
    img.onerror = function(){ if(img.parentNode) img.parentNode.removeChild(img); };
    img.src = url;
    return img;
  }
  function applyLook(look){
    var banner = document.querySelector('.gp-banner');
    var hero = lookImage(look.heroUrl, 'gp-hero', '', function(){ banner.className = 'gp-banner custom'; });
    if(hero) banner.insertBefore(hero, banner.firstChild);
    var host = lookImage(look.hostPhotoUrl, 'gp-host', T.hosts);
    if(host) banner.appendChild(host);
  }

  function stat(k, v){ return v ? '<div class="stat"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>' : ''; }

  function render(d){
    var f = d.facts, c = d.copy, look = d.look || {};
    state.hidden = true; show('gp-main');
    var pageName = (look && look.label) || f.groupName;   // the guest-facing name (interview page_label), else the file's name
    document.title = pageName + ' | Still Afloat Cruising';
    $('gp-plaque').textContent = pageName;
    if(d.preview){ var pb=$('gp-preview'); pb.textContent=T.preview; pb.hidden=false; }
    if(d.langs && d.langs.length > 1){
      var other = ES ? '/group.html' : '/es/group.html';
      $('gp-lang').innerHTML = '<a href="'+other+'?g='+code+location.hash+'">'+esc(T.other)+'</a>'; show('gp-lang');
    }
    applyLook(look);

    // 1. The welcome: the hosts' short note, signed. A group whose copy has none opens straight on the form.
    var welcome = typeof c.welcome === 'string' ? c.welcome.trim() : '';
    if(welcome){ $('gp-welcome').textContent = welcome; $('gp-sig').textContent = look.hostNames || 'Mark'; show('sec-welcome'); }

    // 2. Count me in.
    $('gp-cta-title').textContent = c.cta_label;
    $('gp-cta-blurb').textContent = c.cta_blurb;
    $('gp-submit').textContent = T.count_me_in;
    var gs = ''; for(var n=1;n<=12;n++) gs += '<option value="'+n+'"'+(n===2?' selected':'')+'>'+n+'</option>'; $('f-guests').innerHTML = gs;

    // 3. The plan: the sailing at a glance, then day by day.
    $('gp-stats').innerHTML = stat(T.ship, f.ship) + stat(T.sails, f.sailDateText) + stat(T.nights, f.nights) + stat(T.from, f.embarkPort);
    if(f.itinerary && f.itinerary.length){
      $('gp-itin').innerHTML = f.itinerary.map(function(s){
        return '<tr><td>'+esc(s.day == null ? '' : s.day)+'</td><td>'+esc(s.dateText||'')+'</td><td class="'+(s.seaDay?'sea':'')+'">'+esc(s.seaDay ? T.sea : s.port)+'</td><td>'+esc(s.timesText||'')+'</td></tr>';
      }).join(''); show('gp-itin-wrap');
    }

    // 4. Your cabin: each category and what it starts at (names and prices only), the price note, the FlexPay line, the upgrade offer, what the fare includes.
    var cabins = (f.cabinPrices || []).filter(function(x){ return x && x.category && x.perPersonText; });
    if(cabins.length){
      $('gp-cabin-prices').innerHTML = cabins.map(function(x){
        return '<li><span class="cat">'+esc(x.category)+'</span><span class="amt">'+esc(T.from_lc)+' '+esc(x.perPersonText)+' <small>'+esc(T.pp)+'</small></span></li>';
      }).join(''); show('gp-cabin-card');
    } else if(f.fromPerPersonText){
      $('gp-from').textContent = T.price_from + ' ' + f.fromPerPersonText + ' ' + T.pp; show('gp-from');
    }
    $('gp-fine').textContent = f.fromPerPersonText ? (look.taxesIncluded === true ? T.price_note_tax : T.price_note) : '';
    $('gp-fine').hidden = !f.fromPerPersonText;
    $('gp-upgrades').textContent = T.upgrades;
    // The box is for what the fare really includes; the upgrade offer is its own line, never a filler line in the box.
    var perks = (f.perks || []).filter(Boolean);
    if(perks.length){
      $('gp-perks').innerHTML = perks.map(function(a){ return '<li><i class="fa-solid fa-check"></i><span>'+esc(a)+'</span></li>'; }).join(''); show('sec-perks');
    }
    // What Mark's own words say is planned for the group (an onboard credit he named). Never composed here.
    if(f.planned && f.planned.length){ $('gp-planned').textContent = f.planned.join('; '); show('sec-planned'); }

    // 5. Getting there: the server writes each line without the vendor and with its price unit ("per person", "per room").
    if(f.travel && f.travel.length){
      $('gp-travel').innerHTML = f.travel.map(function(t){ return '<li><i class="fa-solid fa-'+(t.kind==='flight'?'plane':t.kind==='hotel'?'bed':'van-shuttle')+'"></i><span>'+esc(t.text)+'</span></li>'; }).join(''); show('sec-travel');
    }

    // 6. The Conga Line score, only when the group shows it (the API sends no rating otherwise).
    if(f.rating){
      $('gp-score').textContent = f.rating.scoreText;
      $('gp-score-comment').textContent = f.rating.comment || '';
      $('gp-score-salty').textContent = f.rating.saltyTake || '';
      show('sec-rating');
    }

    if(c.organizer_note){ $('gp-org').textContent = c.organizer_note; show('sec-org'); }
    var dates = stat(T.book_by, f.bookByText) + stat(T.final_pay, f.finalPaymentText) + stat(T.sail_day, f.sailDateText);
    if(f.bookByText || f.finalPaymentText){ $('gp-dates').innerHTML = dates; show('sec-dates'); }

    document.querySelector('[data-t="bio"]').textContent = T.bio + (f.markSailing ? T.sailing_too : '');
    $('gp-legal').textContent = f.business.legalName + ' · ' + T.legal_a + ' ' + f.business.host + ' · ' + f.business.email;

    siteKey = d.turnstileSiteKey || '';
    if(siteKey){
      var s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=gpTurnstile'; s.async = true;
      window.gpTurnstile = function(){ window.turnstile.render('#gp-turnstile', { sitekey: siteKey, theme: 'dark', callback: function(t){ turnstileToken = t; } }); };
      document.head.appendChild(s);
    }
  }

  $('gp-form').addEventListener('submit', function(e){
    e.preventDefault();
    var msg = $('gp-msg'), btn = $('gp-submit');
    msg.className = 'msg'; msg.textContent = T.sending; btn.disabled = true;
    fetch('/api/group-page/' + code + '/interest', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        first_name: $('f-first').value, last_name: $('f-last').value, email: $('f-email').value, phone: $('f-phone').value,
        guests: Number($('f-guests').value), note: $('f-note').value,
        newsletter_opt_in: $('f-news').checked, website: $('f-website').value, lang: ES ? 'es' : 'en',
        'cf-turnstile-response': turnstileToken
      })
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(x){
        if(x.ok){ msg.className = 'msg ok'; msg.textContent = T.sent; $('gp-form').reset(); }
        else { msg.className = 'msg err'; msg.textContent = (x.j && x.j.error) || T.err; btn.disabled = false; }
      })
      .catch(function(){ msg.className = 'msg err'; msg.textContent = T.err; btn.disabled = false; });
  });
})();
</script>
<script src="/components/navbar.js?v=20261020-headerfit"></script>
</body>
