<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crucero en grupo | Still Afloat Cruising</title>
<!-- A group page is shared by private link with the group's own people. It is never indexed. -->
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="Still Afloat Cruising">
<meta property="og:type" content="website">
<meta property="og:image" content="https://stillafloatcruising.com/assets/images/still_afloat_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/group-page.css?v=20261023a">
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <img class="logo" src="/assets/images/still_afloat_logo.png" alt="Still Afloat">
    <div class="langswitch" id="gp-lang" hidden></div>
  </div>

  <div id="gp-preview" class="preview-bar" hidden></div>
  <div class="gp-banner"><div class="gp-lockup"><div class="plaque"><span id="gp-plaque">Crucero en grupo</span></div></div></div>

  <div id="gp-state"></div>
  <main id="gp-main" hidden>

    <!-- 1. The welcome: the hosts' note, one paragraph per line, signed. Hidden for a group whose copy was written before the welcome existed. -->
    <section class="welcome" id="sec-welcome" hidden>
      <h1 data-t="welcome_h"></h1>
      <div id="gp-welcome"></div>
      <p class="sig" id="gp-sig"></p>
    </section>

    <!-- The organizer's own line, only when there is one. -->
    <section id="sec-org" hidden><div class="org" id="gp-org"></div></section>

    <!-- 2. The one call to action. The page asks one thing, "I'm interested": no cabin picker, no availability, no cabin count
         (Mark 2026-10-19: "why would they see the available cabins before I know they are interested"). -->
    <section class="panel" id="interest">
      <h2 data-t="put_name"></h2>
      <p class="small" data-t="only_step"></p>
      <form id="gp-form" novalidate>
        <div class="field"><label for="f-name" data-t="f_name"></label><input id="f-name" type="text" autocomplete="name" data-ph="ph_name"></div>
        <div class="field"><label for="f-contact" data-t="f_contact"></label><input id="f-contact" type="text" autocomplete="email" data-ph="ph_contact"></div>
        <div class="field"><label for="f-guests" data-t="f_guests"></label><select id="f-guests"></select></div>
        <div class="hp" aria-hidden="true"><label>Sitio web<input type="text" id="f-website" tabindex="-1" autocomplete="off"></label></div>
        <div id="gp-turnstile" data-appearance="interaction-only"></div>
        <button class="btn" type="submit" id="gp-submit"></button>
        <div class="msg" id="gp-msg" role="status"></div>
      </form>
      <p class="phone" id="gp-cta-blurb"></p>
    </section>

    <!-- 3. The plan, day by day: a picture band, then one sentence a day built from the itinerary (plus Mark's own note for a day). -->
    <div class="photo" id="gp-photo-plan" hidden></div>
    <section class="panel" id="sec-itin" hidden>
      <p class="label" data-t="itinerary"></p>
      <div id="gp-itin"></div>
      <p class="small" style="margin-top:10px" data-t="itin_note"></p>
    </section>

    <!-- 4. Your cabin: a picture band, the categories and what each starts at, the price note, FlexPay, the upgrade offer, what is planned for the group. -->
    <div class="photo" id="gp-photo-cabin" hidden></div>
    <section class="panel" id="sec-cabin">
      <p class="label" data-t="cabin"></p>
      <div id="gp-cabin-prices"></div>
      <p class="small" id="gp-fine" style="margin-top:8px" hidden></p>
      <!-- Every group is enrolled with FlexPay (the business is): the plans line is on every page. -->
      <div class="flex" id="gp-flex"><img src="/assets/images/flexpay-logo.png" alt="FlexPay" height="36"><b data-t="flex"></b></div>
      <p id="gp-upgrades"></p>
      <div id="gp-planned"></div>
    </section>

    <!-- 5. Dates that matter, directly after the cabins. -->
    <section class="panel" id="sec-dates" hidden>
      <p class="label" data-t="dates"></p>
      <div class="dates" id="gp-dates"></div>
    </section>

    <!-- 6. Getting there: flights, hotel and transfers, in the guest's words. Never the airline, hotel or transfer company (Mark 2026-10-20);
         a hotel is priced per room, the rest per person. -->
    <section class="panel" id="sec-travel" hidden>
      <p class="label" data-t="travel"></p>
      <div id="gp-travel"></div>
      <p class="small" style="margin-top:10px" data-t="travel_note"></p>
    </section>
  </main>

  <div class="foot">
    <img class="sa" src="/assets/images/still_afloat_logo.png" alt="Still Afloat">
    <p id="gp-legal"></p>
    <p class="credits" id="gp-credits" hidden></p>
    <div class="cs-row"><img class="cs" src="/assets/images/cornerstone-white.png" alt=""></div>
  </div>

</div>

<script>
(function(){
  var ES = document.documentElement.lang === 'es';
  var T = ES ? {
    loading:'Cargando la invitación…', gone:'Esta página no está disponible. Si recibió el enlace de su grupo, escriba a mark@stillafloatcruising.com.',
    preview:'VISTA PREVIA — solo usted puede ver esta página hasta que la apruebe.',
    hosts:'Sus anfitriones', other:'English', title:'Crucero en grupo',
    welcome_h:'¡Bienvenidos!',
    put_name:'Deje su nombre', only_step:'Este es el único paso. Su nombre, cómo comunicarnos con usted y cuántos son, y Mark se encarga del resto.',
    f_name:'Su nombre', ph_name:'Nombre y apellido', f_contact:'Correo electrónico o teléfono', ph_contact:'El que prefiera que usemos', f_guests:'¿Cuántos son?',
    count_me_in:'¡Cuenten conmigo!',
    need_name:'Escriba su nombre.', need_contact:'Escriba un correo electrónico o un teléfono.',
    sent:'Recibido. Le escribiremos pronto.', sending:'Enviando…', err:'No se pudo enviar. Escriba a mark@stillafloatcruising.com.',
    itinerary:'El plan, día a día', itin_note:'Los horarios son de la naviera y pueden cambiar un poco.',
    sea:'Un día en el mar.',
    sail_from:'Zarpamos de {port} a las {time}.', range:'{port}, de {a} a {b}.', stay:'{port} desde las {time}, y pasamos la noche.',
    until:'{port} hasta las {time}.', until_noon:'{port} hasta el mediodía.', back:'De regreso en {port} a las {time}.', other_day:'{port}, {times}.', only_port:'{port}.',
    cabin:'Su cabina', pp:'por persona', from_lc:'desde', price_from:'Desde',
    price_note:'Dos personas por cabina. Los impuestos y los cargos portuarios se confirman al reservar.', price_note_tax:'Dos personas por cabina. Impuestos y cargos portuarios incluidos.',
    flex:'Planes de pago flexibles disponibles', upgrades:'Mejoras de cabina disponibles. Pregunte a Mark.', planned:'Planeado para el grupo:',
    dates:'Fechas que importan', book_by:'Reserve antes de', final_pay:'Pago final', we_sail:'Zarpamos', we_sail_from:'desde',
    travel:'Cómo llegar', travel_note:'¿Quiere algo de esto? Dígaselo a Mark cuando llame y él se encarga.',
    photo:'Foto:', photos:'Fotos:'
  } : {
    loading:'Loading the invitation…', gone:'This page is not available. If your group sent you the link, email mark@stillafloatcruising.com.',
    preview:'PREVIEW — only you can see this page until you approve it.',
    hosts:'Your hosts', other:'Español', title:'Group Cruise',
    welcome_h:'Welcome!',
    put_name:'Put your name down', only_step:'This is the only step. Your name, how to reach you, how many, and Mark takes it from there.',
    f_name:'Your name', ph_name:'First and last', f_contact:'Email or phone', ph_contact:"Whichever you'd rather we use", f_guests:'How many of you',
    count_me_in:'Count me in!',
    need_name:'Please add your name.', need_contact:'Please add an email or a phone number.',
    sent:'Got it. We will be in touch soon.', sending:'Sending…', err:'That did not go through. Email mark@stillafloatcruising.com.',
    itinerary:'The plan, day by day', itin_note:"Times are the cruise line's and can shift a little.",
    sea:'A day at sea.',
    sail_from:'We sail from {port} at {time}.', range:'{port}, {a} to {b}.', stay:'{port} from {time}, and we stay the night.',
    until:'{port} until {time}.', until_noon:'{port} until noon.', back:'Back in {port} at {time}.', other_day:'{port}, {times}.', only_port:'{port}.',
    cabin:'Your cabin', pp:'per person', from_lc:'from', price_from:'From',
    price_note:'Two to a cabin. Taxes and port fees are confirmed at booking.', price_note_tax:'Two to a cabin. Taxes and port fees included.',
    flex:'Flexible Payment Plans Available', upgrades:'Cabin upgrades available. Ask Mark.', planned:'Planned for the group:',
    dates:'Dates that matter', book_by:'Reserve by', final_pay:'Final payment', we_sail:'We sail', we_sail_from:'from',
    travel:'Getting there', travel_note:"Want any of it? Say so when Mark calls and he'll line it up.",
    photo:'Photo:', photos:'Photos:'
  };
  var LOCALE = ES ? 'es-419' : 'en-US';

  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function show(id){ var e=$(id); if(e) e.hidden=false; }
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = T[el.getAttribute('data-t')] || ''; });
  document.querySelectorAll('[data-ph]').forEach(function(el){ el.placeholder = T[el.getAttribute('data-ph')] || ''; });

  var qs = new URLSearchParams(location.search);
  var code = (qs.get('g') || '').trim();
  // A preview carries the dashboard token in the FRAGMENT (never sent to the server in the URL, never logged).
  var hm = location.hash.match(/[#&]preview=([^&]+)/);
  var previewToken = hm ? decodeURIComponent(hm[1]) : '';
  var state = $('gp-state');
  state.textContent = T.loading;
  if(!/^[a-hjkmnp-z2-9]{10}$/.test(code)){ state.textContent = T.gone; return; }

  var headers = previewToken ? { 'x-affiliate-token': previewToken } : {};
  fetch('/api/group-page/' + code + '?lang=' + (ES ? 'es' : 'en'), { headers: headers })
    .then(function(r){ if(!r.ok) throw new Error('gone'); return r.json(); })
    .then(render)
    .catch(function(){ state.textContent = T.gone; });

  var turnstileToken = null, siteKey = '', widgetId = null;

  // The group's own look (the API has already refused any picture that is not on our own hosts; the page checks it is https once more).
  // The pictures are set as an <img> source, never written into markup. A picture that does not load is dropped and the usual page shows.
  function lookImage(url, cls, alt, onShow){
    if(typeof url !== 'string' || !/^https:\/\//i.test(url)) return null;
    var img = document.createElement('img');
    img.className = cls; img.alt = alt; img.decoding = 'async';
    img.onload = function(){ img.className = cls + ' on'; if(onShow) onShow(); };
    img.onerror = function(){ if(img.parentNode) img.parentNode.removeChild(img); };
    img.src = url;
    return img;
  }
  function applyLook(look){
    var banner = document.querySelector('.gp-banner');
    var hero = lookImage(look.heroUrl, 'gp-hero', '', function(){ banner.className = 'gp-banner custom'; });
    if(hero) banner.insertBefore(hero, banner.firstChild);
    var host = lookImage(look.hostPhotoUrl, 'gp-host', T.hosts);
    if(host) banner.appendChild(host);
    // the two picture bands: the band is there while the picture loads, and goes if the picture does not load
    [['gp-photo-plan', look.planPhotoUrl], ['gp-photo-cabin', look.cabinPhotoUrl]].forEach(function(b){
      var band = $(b[0]);
      var img = lookImage(b[1], 'gp-band', '');
      if(!img) return;
      img.onerror = function(){ band.hidden = true; };
      band.appendChild(img); band.hidden = false;
    });
  }

  // ── The welcome: one paragraph per line; a line in all capitals that ends with "!" is the payoff, in bold.
  function isPayoff(line){ return /!$/.test(line) && line === line.toUpperCase() && line !== line.toLowerCase(); }
  function welcomeHtml(text){
    return text.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
      return '<p' + (isPayoff(l) ? ' class="payoff"' : '') + '>' + esc(l) + '</p>';
    }).join('');
  }

  // ── The plan, day by day. The sentence is built from the itinerary line (port, times); Mark's own note for a day follows it.
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function dateFmt(iso, opts){ return new Intl.DateTimeFormat(LOCALE, Object.assign({ timeZone: 'UTC' }, opts)).format(new Date(iso + 'T12:00:00Z')); }
  /** The port as a person says it: the text before the first comma or opening parenthesis, without "MSC Marine Reserve". */
  function shortPort(p){ return String(p || '').split(/[,(]/)[0].replace(/MSC Marine Reserve/ig, ' ').replace(/\s+/g, ' ').trim(); }
  function fill(tpl, v){ return tpl.replace(/\{(\w+)\}/g, function(_, k){ return v[k] == null ? '' : v[k]; }); }
  var DEPART = ES ? /^salida (.+)$/i : /^depart (.+)$/i;
  var ARRIVE = ES ? /^llegada (.+)$/i : /^arrive (.+)$/i;
  var NOON = ES ? /^12:00$/ : /^12:00 PM$/i;
  function sameDay(a, b){ return !!a && !!b && !a.seaDay && !b.seaDay && shortPort(a.port).toLowerCase() === shortPort(b.port).toLowerCase(); }
  function daySentence(s, i, all){
    if(s.seaDay) return T.sea;
    var port = shortPort(s.port), times = s.timesText || '';
    var dep = DEPART.exec(times), arr = ARRIVE.exec(times), range = /^(.+?)\s[–-]\s(.+)$/.exec(times);
    if(i === 0 && dep) return fill(T.sail_from, { port: port, time: dep[1] });
    if(range) return fill(T.range, { port: port, a: range[1], b: range[2] });
    if(arr && sameDay(s, all[i + 1])) return fill(T.stay, { port: port, time: arr[1] });
    if(dep && sameDay(s, all[i - 1])) return NOON.test(dep[1]) ? fill(T.until_noon, { port: port }) : fill(T.until, { port: port, time: dep[1] });
    if(i === all.length - 1 && arr) return fill(T.back, { port: port, time: arr[1] });
    return times ? fill(T.other_day, { port: port, times: times }) : fill(T.only_port, { port: port });
  }
  /** Mark's notes are keyed by the date as the plan prints it ("May 11"); a year, a weekday or capitals on his side do not matter. */
  function noteKey(k){ return String(k).toLowerCase().replace(/,?\s+(de\s+)?\d{4}$/, '').replace(/\s+/g, ' ').trim(); }
  function planRows(itin, notes){
    var byKey = {};
    Object.keys(notes || {}).forEach(function(k){ byKey[noteKey(k)] = notes[k]; });
    return itin.map(function(s, i, all){
      var short = s.isoDate ? dateFmt(s.isoDate, { month: 'long', day: 'numeric' }) : (s.dateText || '');
      var wd = s.isoDate ? cap(dateFmt(s.isoDate, { weekday: 'short' }).replace(/\.$/, '')) : '';
      var note = byKey[noteKey(short)] || (s.dateText ? byKey[noteKey(s.dateText)] : '') || '';
      return '<div class="day"><b>' + (wd ? esc(wd) + '<br>' : '') + esc(short) + '</b><span>' + esc(daySentence(s, i, all) + (note ? ' ' + note : '')) + '</span></div>';
    }).join('');
  }

  function creditsLine(list){
    var parts = [], ok = true;
    list.forEach(function(a){
      var m = /^Photos?:\s*(.+?)\s*·\s*([^·]+?)\s*·\s*Wikimedia Commons$/i.exec(a);
      if(!m){ ok = false; return; }
      var p = m[1] + ' (' + m[2] + ')';
      if(parts.indexOf(p) < 0) parts.push(p);
    });
    // the usual lines read "Photo: <artist> · <licence> · Wikimedia Commons": one compact line; anything else is joined as it is
    return ok ? (parts.length > 1 ? T.photos : T.photo) + ' ' + parts.join(' · ') + ' · Wikimedia Commons' : list.join(' · ');
  }

  function tile(label, value, wide){ return value ? '<div class="date' + (wide ? ' wide' : '') + '"><p class="label">' + esc(label) + '</p><b>' + esc(value) + '</b></div>' : ''; }

  function render(d){
    var f = d.facts, c = d.copy, look = d.look || {};
    state.hidden = true; show('gp-main');
    var pageName = (look && look.label) || f.groupName;   // the guest-facing name (interview page_label), else the file's name
    document.title = pageName + ' | Still Afloat Cruising';
    $('gp-plaque').textContent = pageName;
    if(d.preview){ var pb=$('gp-preview'); pb.textContent=T.preview; pb.hidden=false; }
    if(d.langs && d.langs.length > 1){
      var other = ES ? '/group.html' : '/es/group.html';
      $('gp-lang').innerHTML = '<a href="'+other+'?g='+code+esc(location.hash).replace(/"/g,'&quot;')+'">'+esc(T.other)+'</a>'; show('gp-lang');
    }
    applyLook(look);

    // 1. The welcome: the hosts' note, signed. A group whose copy has none opens straight on the form.
    var welcome = typeof c.welcome === 'string' ? c.welcome.trim() : '';
    if(welcome){ $('gp-welcome').innerHTML = welcomeHtml(welcome); $('gp-sig').textContent = look.hostNames || 'Mark'; show('sec-welcome'); }
    if(c.organizer_note){ $('gp-org').textContent = c.organizer_note; show('sec-org'); }

    // 2. Count me in: the button is the group's own words, the phone line under it is the copy's blurb.
    $('gp-submit').textContent = (typeof c.cta_label === 'string' && c.cta_label.trim()) || T.count_me_in;
    $('gp-cta-blurb').textContent = c.cta_blurb || ''; $('gp-cta-blurb').hidden = !c.cta_blurb;
    var gs = ''; for(var n=1;n<=12;n++) gs += '<option value="'+n+'"'+(n===2?' selected':'')+'>'+n+'</option>'; $('f-guests').innerHTML = gs;

    // 3. The plan: one row a day.
    if(f.itinerary && f.itinerary.length){ $('gp-itin').innerHTML = planRows(f.itinerary, look.dayNotes); show('sec-itin'); }

    // 4. Your cabin: each category and what it starts at (names and prices only), the price note, FlexPay, the upgrade offer, what is planned.
    var cabins = (f.cabinPrices || []).filter(function(x){ return x && x.category && x.perPersonText; });
    var rows = cabins.map(function(x){ return '<div class="price"><b>'+esc(x.category)+'</b><span class="amt">'+esc(x.perPersonText)+'<small>'+esc(T.pp)+'</small></span></div>'; });
    if(!rows.length && f.fromPerPersonText) rows.push('<div class="price"><b>'+esc(T.price_from)+'</b><span class="amt">'+esc(f.fromPerPersonText)+'<small>'+esc(T.pp)+'</small></span></div>');
    $('gp-cabin-prices').innerHTML = rows.join('');
    $('gp-fine').textContent = f.fromPerPersonText ? (look.taxesIncluded === true ? T.price_note_tax : T.price_note) : '';
    $('gp-fine').hidden = !f.fromPerPersonText;
    $('gp-upgrades').textContent = T.upgrades;
    // What Mark's own words say is planned for the group (an onboard credit he named). Never composed here.
    $('gp-planned').innerHTML = (f.planned || []).filter(Boolean).map(function(p){ return '<p>' + esc(T.planned + ' ' + p + (/[.!?]$/.test(p) ? '' : '.')) + '</p>'; }).join('');

    // 5. Dates that matter.
    var sails = f.sailDateText ? ((f.sailDate ? cap(dateFmt(f.sailDate, { weekday: 'long' })) + ', ' : '') + f.sailDateText + (f.embarkPort ? ' ' + T.we_sail_from + ' ' + f.embarkPort : '')) : '';
    if(f.bookByText || f.finalPaymentText){ $('gp-dates').innerHTML = tile(T.book_by, f.bookByText) + tile(T.final_pay, f.finalPaymentText) + tile(T.we_sail, sails, true); show('sec-dates'); }

    // 6. Getting there: the server writes each line without the vendor and with its price unit ("per person", "per room").
    if(f.travel && f.travel.length){
      $('gp-travel').innerHTML = f.travel.map(function(t){ return '<div class="trip"><span>'+(t.kind==='flight'?'✈️':t.kind==='hotel'?'🏨':'🚐')+'</span><span>'+esc(t.text)+'</span></div>'; }).join(''); show('sec-travel');
    }

    // The footer: the business named as it files, and the credit line of the pictures shown.
    $('gp-legal').textContent = f.business.legalName + ' · ' + f.business.email;
    var credits = (look.credits || []).filter(function(x){ return typeof x === 'string' && x.trim(); });
    if(credits.length){ $('gp-credits').textContent = creditsLine(credits); show('gp-credits'); }

    siteKey = d.turnstileSiteKey || '';
    if(siteKey){
      var s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=gpTurnstile'; s.async = true;
      // "interaction-only": the check runs by itself and nothing shows unless Cloudflare needs the visitor to do something.
      window.gpTurnstile = function(){ widgetId = window.turnstile.render('#gp-turnstile', { sitekey: siteKey, theme: 'light', appearance: 'interaction-only', callback: function(t){ turnstileToken = t; } }); };
      document.head.appendChild(s);
    }
  }

  $('gp-form').addEventListener('submit', function(e){
    e.preventDefault();
    var msg = $('gp-msg'), btn = $('gp-submit');
    function refuse(text){ msg.className = 'msg err'; msg.textContent = text; }
    // One name box: the last space splits it (one word is a first name only). One contact box: an "@" makes it an email, anything else a phone.
    var name = $('f-name').value.replace(/\s+/g, ' ').trim();
    var contact = $('f-contact').value.trim();
    if(!name) return refuse(T.need_name);
    if(!contact) return refuse(T.need_contact);
    var cut = name.lastIndexOf(' ');
    var isEmail = contact.indexOf('@') >= 0;
    msg.className = 'msg'; msg.textContent = T.sending; btn.disabled = true;
    fetch('/api/group-page/' + code + '/interest', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        first_name: cut < 0 ? name : name.slice(0, cut), last_name: cut < 0 ? '' : name.slice(cut + 1),
        email: isEmail ? contact : '', phone: isEmail ? '' : contact,
        guests: Number($('f-guests').value), newsletter_opt_in: false, website: $('f-website').value, lang: ES ? 'es' : 'en',
        'cf-turnstile-response': turnstileToken
      })
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(x){
        if(x.ok){ msg.className = 'msg ok'; msg.textContent = T.sent; $('gp-form').reset(); }
        else { msg.className = 'msg err'; msg.textContent = (x.j && x.j.error) || T.err; btn.disabled = false; }
      })
      .catch(function(){ msg.className = 'msg err'; msg.textContent = T.err; btn.disabled = false; })
      .then(function(){
        // a security token is good for one send: ask for a fresh one for the next try
        turnstileToken = null;
        try { if(widgetId !== null && window.turnstile) window.turnstile.reset(widgetId); } catch(err) { /* the check simply runs again on the next load */ }
      });
  });
})();
</script>
</body>
</html>
