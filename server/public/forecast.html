<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forecast | Still Afloat</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;background:#06111f;color:white;}

/* ── Hero ── */
.hero{
  position:relative;
  min-height:320px;
  padding:60px 20px 70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(rgba(6,17,31,.38),rgba(6,17,31,.55)),
             linear-gradient(135deg,#0077b6,#00b4d8);
  background-size:cover;
  background-position:center;
  overflow:hidden;
}
.hero::after{
  content:'';
  position:absolute;left:0;right:0;bottom:0;height:100px;
  background:linear-gradient(to bottom,rgba(6,17,31,0),#06111f 100%);
  pointer-events:none;
}

/* Title card — less opaque, more translucent so image shows through */
.hero-content{
  position:relative;
  z-index:2;
  background:rgba(4,14,36,.28);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  padding:28px 36px;
  max-width:780px;
}
.hero h1{margin:0 0 10px;font-size:clamp(32px,5vw,58px);line-height:1.1;font-family:'Baloo 2',sans-serif;font-weight:800;}
.hero p{margin:0;font-size:18px;color:rgba(255,255,255,.85);}

/* ── Forecast grid ── */
.forecast-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:16px;
  padding:30px 24px 70px;
  max-width:1200px;
  margin:auto;
}
.day-card{
  background:rgba(255,255,255,0.07);
  border-radius:22px;
  padding:20px 14px;
  text-align:center;
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  transition:transform .22s ease, border-color .22s ease;
}
.day-card:hover{transform:translateY(-4px);border-color:rgba(93,255,154,.24);}
.day-emoji{font-size:42px;margin-bottom:10px;}
.day-temp{font-size:26px;font-weight:800;color:#5dff9a;}
.day-low{color:rgba(255,255,255,.5);font-size:14px;margin-top:4px;}
.day-label{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:8px;font-weight:600;}

.error{
  max-width:700px;margin:40px auto;padding:28px;border-radius:22px;
  background:rgba(255,255,255,.06);text-align:center;
  border:1px solid rgba(255,255,255,.08);
}

@media(max-width:768px){
  .hero{min-height:220px;padding:50px 16px;}
  .hero-content{padding:20px 22px;}
  .forecast-grid{padding:20px 16px 50px;gap:12px;}
}
</style>
</head>
<body>
<div class="hero" id="hero">
<div id="navbar-container"></div>
  <div class="hero-content">
    <h1 id="title">Loading Forecast…</h1>
    <p>10-day cruise weather outlook</p>
  </div>
</div>

<div id="synopsis-wrap" style="display:none;max-width:860px;margin:0 auto;padding:0 24px 8px;">
  <div id="synopsis" style="
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:20px 26px;
    font-size:17px;
    line-height:1.75;
    color:rgba(255,255,255,.82);
    font-family:'Baloo 2',Poppins,sans-serif;
  "></div>
</div>
<div class="forecast-grid" id="forecast"></div>

<script>
const PEXELS_KEY = 'P82hqxcbAMVh4XpB7Dr3zwUrzWY1kldO6Q8QvO9XkJ8FXGsl4iH6ebzA';

function wxEmoji(code) {
  if (code === 0) return '☀️';
  if ([1,2].includes(code)) return '🌤️';
  if (code === 3) return '☁️';
  if ([45,48].includes(code)) return '🌫️';
  if ([51,53,55,61,63,65,80,81,82].includes(code)) return '🌧️';
  if ([95,96,99].includes(code)) return '⛈️';
  if ([71,73,75,77,85,86].includes(code)) return '❄️';
  return '⛅';
}

async function loadHeroImage(searchName) {
  try {
    const r = await fetch(
      `https://api.pexels.com/v1/search?query=${encodeURIComponent(searchName + ' cruise port')}&per_page=1`,
      { headers: { Authorization: PEXELS_KEY } }
    );
    const d = await r.json();
    if (d.photos && d.photos.length) {
      document.getElementById('hero').style.backgroundImage =
        `linear-gradient(rgba(6,17,31,.38),rgba(6,17,31,.55)), url(${d.photos[0].src.landscape})`;
    }
  } catch { /* keep gradient fallback */ }
}

function renderDays(days) {
  document.getElementById('forecast').innerHTML = days.map(item => `
    <div class="day-card">
      <div class="day-label">${new Date(item.day + 'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div>
      <div class="day-emoji">${item.emoji}</div>
      <div class="day-temp">${item.high}°</div>
      <div class="day-low">${item.low}° low</div>
    </div>`).join('');
}

async function fetchByCoords(lat, lon, displayName) {
  const url = `https://api.open-meteo.com/v1/forecast` +
    `?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,weather_code` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
    `&temperature_unit=fahrenheit&timezone=auto&forecast_days=10`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Weather fetch failed');
  const d = await r.json();
  document.getElementById('title').textContent = displayName;
  loadHeroImage(displayName);
  renderDays(d.daily.time.map((day, i) => ({
    day,
    emoji: wxEmoji(d.daily.weather_code[i]),
    high:  Math.round(d.daily.temperature_2m_max[i]),
    low:   Math.round(d.daily.temperature_2m_min[i]),
  })));
}

async function geocodeAndFetch(name) {
  const r = await fetch(
    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`
  );
  const d = await r.json();
  if (!d.results || !d.results.length) throw new Error('Location not found');
  const loc = d.results[0];
  const displayName = [loc.name, loc.admin1, loc.country].filter(Boolean).join(', ');
  await fetchByCoords(loc.latitude, loc.longitude, displayName);
}

async function loadForecast() {
  const params = new URLSearchParams(window.location.search);
  const lat    = params.get('lat');
  const lon    = params.get('lon');
  const name   = params.get('name');
  const place  = params.get('place');
  const search = params.get('search');

  try {
    if (lat && lon && name) {
      await fetchByCoords(parseFloat(lat), parseFloat(lon), decodeURIComponent(name));
    } else if (name && search) {
      await geocodeAndFetch(decodeURIComponent(name));
    } else {
      const slug = place || 'miami';
      const r = await fetch(`/api/weather?place=${encodeURIComponent(slug)}`);
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.error || 'Forecast not found');
      const loc = d.forecast;
      document.getElementById('title').textContent = loc.name;
      loadHeroImage(loc.name);
      renderDays(loc.forecast);
      if (loc.synopsis) {
        document.getElementById('synopsis').textContent = loc.synopsis;
        document.getElementById('synopsis-wrap').style.display = '';
      }
    }
  } catch (err) {
    document.getElementById('title').textContent = 'Forecast unavailable';
    document.getElementById('forecast').innerHTML =
      `<div class="error">Could not load that forecast. <a href="weather.html" style="color:#5dff9a">← Back to Weather</a></div>`;
  }
}

loadForecast();
</script>
<script src="/components/navbar.js?v=20260712-wms"></script>
</body>
</html>
