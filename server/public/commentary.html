<meta property="og:title" content="Commentary — Mark's Takes | Still Afloat">

<meta property="og:image" content="https://stillafloatcruising.com/assets/images/still_afloat_logo.png">
<meta name="twitter:card" content="summary_large_image">

<meta name="twitter:description" content="Real takes, travel stories, and honest opinions from a veteran sailor and cruiser.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ── Page hero ── */
.page-hero{position:relative;min-height:360px;display:flex;align-items:flex-end;border-bottom:3px solid rgba(93,255,154,.22)}
.page-hero-bg{position:absolute;inset:0;background:linear-gradient(to right,rgba(4,10,22,1) 0%,rgba(4,10,22,.94) 38%,rgba(4,10,22,.60) 62%,rgba(4,10,22,.18) 100%),url('/assets/images/Tropical beach with palm trees and ship.png') right center/cover no-repeat}
.page-hero-content{position:relative;z-index:2;max-width:700px;padding:72px 40px 64px}
.eyebrow{font-size:.8rem;letter-spacing:.32em;text-transform:uppercase;color:#ffca4f;font-weight:800;margin-bottom:10px;opacity:.88}
.hero-title{font-family:Pacifico,cursive;font-size:clamp(2.6rem,5vw,4.2rem);line-height:1.35;background:linear-gradient(90deg,#ffca4f,#4fc3ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px;padding-bottom:14px;display:block}
.hero-sub{font-size:1.2rem;line-height:1.75;color:rgba(255,255,255,.88);max-width:560px}
.hero-brand{display:inline-flex;align-items:center;gap:7px;margin-top:14px;color:#5dff9a;font-weight:800;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;opacity:.90}
.hero-brand img{height:16px;vertical-align:middle;filter:brightness(1.1)}

/* ── Main shell ── */
.shell{max-width:900px;margin:auto;padding:52px 28px 72px}

/* ── Post card ── */
.post-card{
  display:block;text-decoration:none;color:inherit;
  background:linear-gradient(145deg,rgba(0,119,182,.20),rgba(7,24,63,.65));
  border:1px solid rgba(255,255,255,.11);
  border-radius:22px;overflow:hidden;margin-bottom:24px;
  transition:transform .26s cubic-bezier(.22,1,.36,1),border-color .26s ease,box-shadow .26s ease;
  backdrop-filter:blur(10px);
}
.post-card:not(.post-card--media){padding:32px 36px}
.post-card:hover{transform:translateY(-4px);border-color:rgba(93,255,154,.30);box-shadow:0 16px 40px rgba(0,0,0,.36)}
.post-card--media{display:grid;grid-template-columns:240px 1fr}
.post-thumb-wrap{position:relative;overflow:hidden;background:#000}
.post-thumb{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transition:transform .4s ease}
.post-card--media:hover .post-thumb{transform:scale(1.04)}
.yt-badge{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.72);color:#fff;font-size:.78rem;padding:4px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;backdrop-filter:blur(4px)}
.yt-badge i{color:#ff4e4e}
.post-card-body{padding:28px 32px;display:flex;flex-direction:column;justify-content:center}
.post-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.post-date{font-size:.85rem;letter-spacing:.12em;color:rgba(255,202,79,.90);text-transform:uppercase;font-weight:700}
.post-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 12px;border-radius:30px;background:rgba(93,255,154,.12);border:1px solid rgba(93,255,154,.28);color:#5dff9a;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.post-title{font-family:'Bree Serif',serif;font-size:1.6rem;color:#fff;margin-bottom:10px;line-height:1.3}
.post-excerpt{font-size:1.1rem;line-height:1.8;color:rgba(221,238,255,.80);margin-bottom:18px}
.read-more{display:inline-flex;align-items:center;gap:6px;color:#5dff9a;font-weight:800;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;opacity:.90;transition:opacity .2s}
.post-card:hover .read-more{opacity:1}

/* ── Empty / loading state ── */
.state-box{text-align:center;padding:64px 20px;color:rgba(255,255,255,.45)}
.state-box i{font-size:48px;margin-bottom:16px;display:block;color:rgba(93,255,154,.35)}
.state-box p{font-size:1.1rem}

@media(max-width:700px){
  .post-card--media{grid-template-columns:1fr;grid-template-rows:200px auto}
  .post-thumb-wrap{height:200px}
}
@media(max-width:600px){
  .page-hero-content{padding:36px 20px 40px}
  .shell{padding:32px 16px 52px}
  .post-card:not(.post-card--media){padding:22px 20px}
  .post-card-body{padding:20px 20px}
  .post-title{font-size:1.35rem}
}
</style>
</head>
<body>

<section class="page-hero" id="top">
  <div class="page-hero-bg"></div>
  <div id="navbar-container"></div>
  <div class="page-hero-content">
    <h1 class="hero-title">Commentary</h1>
    <p class="hero-sub">Personal takes, travel stories, and honest opinions from a veteran sailor who's been around the water long enough to know the difference between a great cruise and a sales pitch.</p>
    <div class="hero-brand">
      <img src="/assets/images/still-afloat-text.png" alt="Still Afloat">
      <span>Cruise smarter. Laugh more.</span>
    </div>
  </div>
</section>

<main class="shell">
  <div id="posts-container">
    <div class="state-box"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Loading posts…</p></div>
  </div>
</main>

<footer>
  <p>© 2026 Still Afloat LLC — Cruise smarter. Laugh more. <img src="/assets/images/stay-afloat-text.png" alt="Stay Afloat" style="height:20px;vertical-align:middle;opacity:.7"></p>
</footer>

<script src="/components/navbar.js?v=20260725-topbar2"></script>

<script>
(function () {
  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    } catch { return iso; }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function excerpt(text, max) {
    if (!text) return '';
    const clean = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    const cut = clean.length > max ? clean.slice(0, max).replace(/\s+\S*$/, '') + '…' : clean;
    return escHtml(cut);
  }

  function getYouTubeId(url) {
    if (!url) return null;
    const m = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/.exec(url);
    return m ? m[1] : null;
  }

  function renderPost(post) {
    const tagsHtml = (post.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
    const ytId = getYouTubeId(post.videoUrl || '');
    const thumbSrc = ytId
      ? `https://img.youtube.com/vi/${ytId}/mqdefault.jpg`
      : escHtml(post.imageUrl || '');
    const hasMedia = !!(ytId || post.imageUrl);
    return `
      <a class="post-card ${hasMedia ? 'post-card--media' : ''}" href="/commentary-post.html?id=${encodeURIComponent(post.id)}">
        ${hasMedia ? `<div class="post-thumb-wrap"><img class="post-thumb" src="${thumbSrc}" alt="${escHtml(post.title)}" loading="lazy">${ytId ? '<span class="yt-badge"><i class="fa-brands fa-youtube"></i></span>' : ''}</div>` : ''}
        <div class="post-card-body">
          <div class="post-meta">
            <span class="post-date">${formatDate(post.published_at)}</span>
            ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
          </div>
          <h2 class="post-title">${escHtml(post.title)}</h2>
          <p class="post-excerpt">${excerpt(post.body_en, 220)}</p>
          <span class="read-more">Read more <i class="fa-solid fa-arrow-right"></i></span>
        </div>
      </a>`;
  }

  async function load() {
    const container = document.getElementById('posts-container');
    try {
      const res = await fetch('/api/commentary?status=published');
      const data = await res.json();
      const posts = (data.posts || []);
      if (!posts.length) {
        container.innerHTML = '<div class="state-box"><i class="fa-solid fa-pen-to-square"></i><p>No commentary posts yet — check back soon.</p></div>';
        return;
      }
      container.innerHTML = posts.map(renderPost).join('');
    } catch (e) {
      container.innerHTML = '<div class="state-box"><i class="fa-solid fa-triangle-exclamation"></i><p>Could not load posts. Please try again.</p></div>';
    }
  }

  load();
})();
</script>
</body>
</html>
