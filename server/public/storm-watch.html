<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cruise Storm Watch — Still Afloat</title>
<meta name="robots" content="index,follow">
<style>
  :root{ --navy:#0a1a2f; --panel:#0f2440; --line:rgba(255,255,255,.12); --gold:#ffb703; --ink:#eaf1f8; --muted:#9fb2c6; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55}
  a{color:#8fd0ff}
  .wrap{max-width:920px;margin:0 auto;padding:22px 18px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
  .brand{font-weight:800;letter-spacing:.02em;color:#fff;text-decoration:none;font-size:15px}
  .eyebrow{color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:12px;margin:22px 0 4px}
  h1{font-size:30px;line-height:1.15;margin:0 0 6px;color:#fff}
  .meta{color:var(--muted);font-size:13px;margin-bottom:8px}
  .status{display:inline-block;background:rgba(255,183,3,.14);border:1px solid var(--gold);color:var(--gold);font-weight:700;border-radius:999px;padding:5px 12px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin:16px 0}
  .card h2{font-size:16px;margin:0 0 10px;color:#fff;text-transform:uppercase;letter-spacing:.06em}
  .gfx{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .gfx figure{margin:0;background:#08131f;border:1px solid var(--line);border-radius:12px;overflow:visible}
  .gfx figure:hover{position:relative;z-index:2}
  .gfx img{display:block;width:100%;height:auto;transition:transform .2s ease;cursor:zoom-in}
  .gfx figure:hover img{transform:scale(1.25)}
  .lightbox{position:fixed;inset:0;background:rgba(3,10,20,.95);display:none;align-items:center;justify-content:center;z-index:1000;padding:24px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:96vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lightbox .back{position:fixed;top:16px;left:16px;background:var(--gold);color:#0a1a2f;border:none;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer;z-index:1001}
  .gfx figcaption{padding:8px 10px;color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .prose p{margin:0 0 12px}
  .advisory{padding:10px 0;border-bottom:1px solid var(--line)}
  .advisory:last-child{border-bottom:none}
  .advisory .line{font-weight:800;color:#fff}
  .foot{color:var(--muted);font-size:12px;margin-top:24px}
  .disclaimer{color:var(--muted);font-size:12px;background:#08131f;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:16px}
  @media(max-width:620px){.gfx{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/">← Still Afloat</a>
    <span class="meta">Cruise Weather Advisory</span>
  </div>
  <div id="content"><p class="meta" style="margin-top:30px">Loading advisory…</p></div>
  <p class="foot">Source: <a href="https://www.nhc.noaa.gov/" target="_blank" rel="noopener">NOAA / National Hurricane Center</a>. Still Afloat summarizes public NHC data for cruisers; always follow your cruise line and captain for itinerary decisions.</p>
</div>
<div class="lightbox" id="lightbox"><button class="back" id="lb-back">← Back</button><img id="lb-img" alt="Full-size storm graphic"></div>
<script>
(function(){
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function md(t){if(!t)return"";return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").split(/\n{2,}/).map(function(p){return "<p>"+p.trim().replace(/\n/g,"<br>")+"</p>";}).join("");}
  function fmtDate(d){if(!d)return"";return d;}
  var id=new URLSearchParams(location.search).get("id");
  var host=document.getElementById("content");
  if(!id){host.innerHTML='<p class="meta" style="margin-top:30px">No advisory selected.</p>';return;}
  fetch("/api/storm-watch/"+encodeURIComponent(id)).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.success||!d.system){host.innerHTML='<p class="meta" style="margin-top:30px">This advisory is no longer active.</p>';return;}
    var s=d.system;
    var sail=(s.sailings||[]);
    var adv=(s.cruise_line_info||[]);
    var gfx="";
    if(s.cone_url||s.satellite_url){
      gfx='<div class="card"><h2>Forecast & satellite</h2><div class="gfx">'
        +(s.cone_url?'<figure><img src="'+esc(s.cone_url)+'" alt="NHC forecast graphic" loading="lazy"><figcaption>NHC forecast track / outlook</figcaption></figure>':'')
        +(s.satellite_url?'<figure><img src="'+esc(s.satellite_url)+'" alt="GOES satellite" loading="lazy"><figcaption>GOES satellite (latest)</figcaption></figure>':'')
        +'</div></div>';
    }
    var shipsCard='<div class="card"><h2>Potentially impacted sailings</h2>'
      +(sail.length?('<table><thead><tr><th>Ship</th><th>Line</th><th>Departs</th><th>Dates</th></tr></thead><tbody>'
        +sail.map(function(v){return '<tr><td>'+esc(v.ship_name)+'</td><td>'+esc(v.cruise_line)+'</td><td>'+esc(v.depart_port||"—")+'</td><td>'+esc(fmtDate(v.start_date))+' – '+esc(fmtDate(v.end_date))+'</td></tr>';}).join("")
        +'</tbody></table>')
        :'<p class="meta">No sailings in our tracked list fall in the affected area and dates. Check your specific booking with your cruise line.</p>')
      +'</div>';
    var advCard=adv.length?('<div class="card"><h2>Cruise-line advisories</h2>'
      +adv.map(function(a){return '<div class="advisory"><div class="line">'+esc(a.line||"Advisory")+'</div><div>'+esc(a.note||"")+(a.url?' — <a href="'+esc(a.url)+'" target="_blank" rel="noopener">details</a>':'')+'</div></div>';}).join("")
      +'</div>'):'';
    host.innerHTML=
      '<p class="eyebrow">Cruise Storm Watch</p>'
      +'<h1>'+esc(s.headline||s.name)+'</h1>'
      +'<div class="meta">'+esc(s.classification||"")+' · '+esc(s.grounds_label||"")+(s.formation_chance!=null?' · '+s.formation_chance+'% formation chance':'')+'</div>'
      +'<span class="status">Active advisory · updated '+esc((s.updated||"").slice(0,10))+'</span>'
      +'<div class="card"><h2>What this means for you</h2><div class="prose">'+md(s.detail_md||s.body_md)+'</div></div>'
      +gfx
      +shipsCard
      +advCard
      +'<div class="disclaimer">This is guidance, not an official warning. Cruise lines decide itinerary changes; monitor your cruise line’s app and the National Hurricane Center for the latest.</div>';
    // Click a graphic → full-size lightbox with a Back button.
    var lb=document.getElementById('lightbox'),lbImg=document.getElementById('lb-img');
    function closeLb(){lb.classList.remove('open');lbImg.src='';}
    host.querySelectorAll('.gfx img').forEach(function(im){im.addEventListener('click',function(){lbImg.src=im.src;lb.classList.add('open');});});
    document.getElementById('lb-back').addEventListener('click',closeLb);
    lb.addEventListener('click',function(e){if(e.target===lb)closeLb();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();});
  }).catch(function(){host.innerHTML='<p class="meta" style="margin-top:30px">Could not load this advisory.</p>';});
})();
</script>
</body>
</html>
