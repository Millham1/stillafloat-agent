<style>
/* Room Concierge — Mark's balcony hero (supplied 8/21). The art carries a painted
   frosted panel; the whole app renders INSIDE it. Grid overlay so the panel can grow
   past the art on long screens without breaking the composition. Light panel =>
   navy text, exactly like the homepage frosted hero card. */
html{background:#07183f}
body{margin:0;background:transparent;min-height:100vh;font-family:'Baloo 2',system-ui,sans-serif;font-size:18px;color:#07183f;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(7,24,63,.72) 0%,rgba(7,24,63,.92) 46%,#07183f 100%),
             url('/assets/images/Tropical beach with palm trees and ship.png') center top/cover no-repeat}

.hero-wrap{display:grid;max-width:1536px;margin:0 auto;position:relative}
.hero-art{grid-area:1/1;align-self:start;position:relative;width:100%}
.hero-img{width:100%;height:auto;display:block}
/* Mark 8/21: the butler overlays the app — that's the charm. He reaches to x=1246 of
   the 1536-wide art and the painted panel ends at 1262, so he already crosses it. Our
   glass therefore stops at 1240 (right margin 19.27%) and the painting's own layering
   shows through untouched — no cutout, no seam, butler in front. */
.hero-art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;
  background:linear-gradient(to bottom,rgba(7,24,63,0),#07183f);pointer-events:none}
/* Mark 8/21: there must be ONE card — the one painted into the art. So the panel has
   no border, no shadow and no edge of its own; it lays a feathered wash over the painted
   glass purely so the type stays readable, and that wash dies out before it reaches any
   edge. The only visible card edge is the painting's. */
.panel{grid-area:1/1;position:relative;z-index:2;isolation:isolate;
  margin:7.9% 19.27% 11.0% 17.9%;
  padding:clamp(24px,3vw,52px) clamp(26px,3.2vw,54px);
  color:#07183f}
.panel::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(255,255,255,.60);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 52px,#000 calc(100% - 52px),transparent 100%),
                     linear-gradient(to bottom,transparent 0,#000 46px,#000 calc(100% - 46px),transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent 0,#000 52px,#000 calc(100% - 52px),transparent 100%),
             linear-gradient(to bottom,transparent 0,#000 46px,#000 calc(100% - 46px),transparent 100%);
  mask-composite:intersect}

/* ── type inside the panel (navy on frosted, homepage canon) ── */
.re-topbar{display:flex;align-items:center;min-height:26px}
.re-back{font-family:inherit;font-weight:800;font-size:clamp(13px,1.05vw,16px);color:#023e6e;background:none;border:none;cursor:pointer;padding:2px 8px 2px 0;display:none}
.re-back.show{display:inline-block}

.hero-title{position:absolute;top:clamp(10px,2.1vw,40px);left:50%;transform:translateX(-50%);z-index:5;
  background:linear-gradient(135deg,#023e6e,#07183f);color:#fff;border-radius:999px;white-space:nowrap;

<script>
const DANCERS={1:'/assets/concierge/dancer-1_neutral_cruiser.jpg',2:'/assets/concierge/dancer-2_tourist.jpg',3:'/assets/concierge/dancer-3_cruiser.jpg',4:'/assets/concierge/dancer-4_party_animal.jpg',5:'/assets/concierge/dancer-5_conga_king_queen.jpg'};
const SALTY_IMG='/assets/concierge/salty-mark.jpg';
</script>
<script>
/* ─────────────────────────────────────────────────────────────────────────────
   RoomConciergeFlow — the full journey, wired.
   landing → fork → (ship picker | –) → 5 questions about you → expectations
   (the finder's Mark-corrected tree) → reveal (published Conga score + Salty
   Mark) → rooms (live-reasoned picks where advice exists) → the one CTA.
   Design is LOCKED (Mark, 8/14) — stages render inside the frosted panel.
──────────────────────────────────────────────────────────────────────────── */
const QUIET = [
  "Still Afloat Cruising — your independent travel advisor",
  "Questions? You can always talk to me.",
];
/* Behavioral interview (model approved by Mark 8/14): remembered behavior,
   forced tradeoffs, projection — never self-description. Each option carries
   hidden trait weights; the TYPE is inferred from the pattern. The visitor
   never sees a label. */
const PERSONALITY_QS = [
  { key:"retell", q:"Think about the best vacation you've ever had. What's the part you still tell people about?",
    opts:[["The meal I'm still chasing", {food:2, splurgeConsume:1}],
          ["The people we met — we still talk", {social:2, energy:1}],
          ["The thing we did that nobody back home believes", {active:2, energy:1}],
          ["That for one week, nobody could reach me", {quiet:2, introvert:1}]] },
  { key:"photos", q:"Open your phone — your last trip's photos are mostly…",
    opts:[["Scenery. Not a human in frame", {quiet:2, introvert:1}],
          ["Us with people we'd just met", {social:2, extrovert:2}],
          ["Food and drinks, honestly", {food:2, splurgeConsume:1}],
          ["The kids having the time of their lives", {family:2}]] },
  { key:"wedding", q:"A wedding reception, 11pm. Where are we finding you?",
    opts:[["On the dance floor", {energy:2, extrovert:1}],
          ["Deep in a conversation that started at dinner", {social:1, introvert:1}],
          ["Gone. We said our goodbyes at 9:30", {quiet:2, introvert:1}],
          ["At the bar, making the bartender laugh", {social:2, energy:1}]] },
  { key:"annoy", q:"What's the FIRST thing that annoys you about other travelers?",
    opts:[["They're loud everywhere they go", {quiet:2, crowdsAvoid:2}],
          ["They wing everything and it shows", {planner:2}],
          ["They wait in lines they didn't have to", {planner:1, active:1}],
          ["They never leave the pool", {active:2}]] },
  { key:"overpay", q:"Last trip — what did you happily overpay for, zero regrets?",
    opts:[["The view from the room", {splurgeCabin:2}],
          ["One unforgettable dinner", {splurgeConsume:2, food:1}],
          ["The excursion everyone said was too expensive", {active:2, splurgeConsume:1}],
          ["Nothing. Getting the deal WAS the trip", {value:2, planner:1}]] },
  { key:"tradeoff", q:"You get one — the other's gone forever:",
    opts:[["The quiet corner nobody else has found", {quiet:2, introvert:2, crowdsAvoid:1}],
          ["The table where everybody knows your name", {social:2, extrovert:2, crowdsLove:1}]] },
];

/* Pattern → the axes the matcher uses. Deterministic and inspectable. */
function inferAxes(traits){
  const t = k => traits[k]||0;
  return {
    energy:  t("energy")>=3 ? "party" : (t("quiet")>=3 ? "quiet" : "social"),
    social:  t("extrovert")>t("introvert")+1 ? "extrovert" : (t("introvert")>t("extrovert")+1 ? "introvert" : "mixed"),
    structure: t("planner")>=2 ? "planner" : "loose",
    splurge: t("splurgeCabin")>=2 ? "cabin" : (t("value")>=2 ? "value" : "consumables"),
    crowds:  t("crowdsAvoid")>=2 || t("quiet")>=4 ? "avoids" : (t("crowdsLove")>=1||t("energy")>=3 ? "loves-it" : "tolerates"),
  };
}
/* The finder's expectation tree, ported verbatim (Mark-corrected copy). */
const REGION_NAMES = {e_caribbean:"Eastern Caribbean",w_caribbean:"Western Caribbean",s_caribbean:"Southern Caribbean",
  bahamas:"The Bahamas",alaska:"Alaska",mediterranean:"The Mediterranean",mexican_riviera:"Mexican Riviera",
  n_europe:"Northern Europe",bermuda:"Bermuda",hawaii:"Hawaii",canada_ne:"Canada & New England"};
const EXPECT_QS = [
  { key:"destination", q:"Where are you dreaming of?", opts:[
      ["Eastern Caribbean","e_caribbean"],["Western Caribbean","w_caribbean"],
      ["Southern Caribbean","s_caribbean"],["The Bahamas","bahamas"],
      ["Alaska","alaska"],["The Mediterranean","mediterranean"],
      ["Mexican Riviera","mexican_riviera"],
      ["Surprise me — anywhere the ship fits","surprise"]] },
  { key:"party", q:"Who's going?", opts:[
      ["Just the two of us","couple"],["Family with kids","family"],
      ["Just me","solo"],["Solo, but traveling with a group","solo-group"],
      ["A group of us","group"]] },
  { key:"room", q:"How do you picture using your room?", opts:[
      ["Crash and recharge","inside"],["Wake up to daylight and water","oceanview"],
      ["Coffee outside in my pajamas","balcony"],["The room is part of the vacation","suite"],
      ["Honestly, no idea — pick for me","balcony"]] },
  { key:"priority", q:"What matters most once you're aboard?", opts:[
      ["Waking up to the ocean","ocean"],["Peace and quiet","quiet"],
      ["Being near the action","action"],["Room to spread out","space"]] },
  { key:"budget", q:"How does the trip budget work, honestly?", opts:[
      ["There's a number, and we respect it","lean"],
      ["Comfortable, but every dollar should earn its spot","middle"],
      ["For the right room, the budget moves","treat"],
      ["The budget is whatever makes it perfect","sky"]] },
  { key:"motion", q:"Does anyone get seasick?", opts:[
      ["Yes — keep us steady","yes"],["No, we're fine","no"],
      ["I can grin and bear it","no"]] },
];

/* Room-category explainers — new cruisers don't know an Infinite Veranda from a
   porthole. Text now; image slots come later (Mark, 8/14). Inside needs none. */
const CATEGORY_INFO = [
  { match:/infinite/i, name:"What's an Infinite Veranda?",
    text:"Celebrity's twist on a balcony: the whole room IS the veranda. The window's top half slides down and your sitting area becomes open-air. You get more indoor space out of it — but there's no separate outdoor chair zone, and people either love that or miss a true balcony." },
  { match:/balcony|veranda/i, name:"What's a balcony cabin?",
    text:"Your own private outdoor space — a glass door, a couple of chairs, and the ocean. Morning coffee out there is the thing people can't give up once they've had it. And it's the one deck chair on the ship nobody can claim with a towel." },
  { match:/ocean\s?view|oceanview|window/i, name:"What's an ocean view?",
    text:"A real window to the sea — daylight and a view of where you are, without an outdoor space. You see the ocean; you just don't sit outside in it." },
  { match:/suite/i, name:"What's a suite?",
    text:"More space, and usually more perks — priority lines, better service, sometimes access to areas of the ship regular cabins don't get." },
];
function categoryInfo(cat){
  if(!cat) return "";
  const hit = CATEGORY_INFO.find(c=>c.match.test(cat));
  return hit ? `<details class="cat-info"><summary>${hit.name}</summary><p>${hit.text}</p></details>` : "";
}

/* Scannable options: bold the lead thought, lighten the tail — the eye gets
   the gist without reading the sentence. */
const LINE_DISPLAY = { "Royal Caribbean International": "Royal Caribbean" };
function lineName(l){ return LINE_DISPLAY[l] || l; }
function fmtOpt(label){
  const m = label.match(/^([^,—–.]{4,45})([,—–.].*)$/);
  return m ? `<b>${m[1]}</b><span style="color:#5a6b85;font-weight:500">${m[2]}</span>` : `<b>${label}</b>`;
}

class RoomConciergeFlow {
  constructor() {
    this.path=null; this.personality={}; this.expect={}; this.qIndex=0; this.eIndex=0;
    this.fleet=[]; this.chosen=null; this.suggestion=null; this.picked=new Set();
    this.stageEl=document.getElementById("stage");
    this.history=[];
    this.loadFleet();
  }
  snapshot(renderName){
    this.history.push({renderName,
      state: JSON.parse(JSON.stringify({path:this.path,personality:this.personality,expect:this.expect,
        qIndex:this.qIndex,eIndex:this.eIndex,traits:this.traits||{},raw:this.raw||{},
        chosenSlug:this.chosen?this.chosen.slug:null}))});
    document.getElementById("backBtn").classList.add("show");
  }
  back(){
    const prev=this.history.pop();
    if(!prev){ document.getElementById("backBtn").classList.remove("show"); return this.landing(); }
    const st=prev.state;
    this.path=st.path; this.personality=st.personality; this.expect=st.expect;
    this.qIndex=st.qIndex; this.eIndex=st.eIndex; this.traits=st.traits; this.raw=st.raw;
    this.chosen=st.chosenSlug?this.fleet.find(f=>f.slug===st.chosenSlug)||null:null;
    if(!this.history.length) document.getElementById("backBtn").classList.remove("show");
    this[prev.renderName]();
    this.stageEl.scrollTop=0;
  }
  quiet(i){ return `<p class="quiet">${QUIET[i===0?0:1]}</p>`; }
  async loadFleet(){

    catch{ this.fleet=[]; }
  }
  landing(){
    this.stageEl.innerHTML = `
      <div class="land-grid">
        <div>
          <h1>Some cabins wake up to the ocean.<br>Some wake up to the anchor chain.</h1>
          <p class="re-intro">The deck plan won't tell you which is which — it's a grid of numbers, and
          I've spent more than twenty years learning what those numbers mean: which cabins sit under the
          pool deck, which ones sleep soundly, which balcony faces a steel wall. A few quick
          <b>questions about you</b>, then your <b>expectations</b> — and I'll name the <b>exact cabins</b>
          I'd book myself, and the few I'd steer my own family past. That homework is already done.

          <div class="hero-brand"><img src="/assets/concierge/still-afloat-cruise-smarter.png" alt="Still Afloat — Cruise Smarter"></div>

  fork(path){ this.snapshot('landing'); this.path=path; this.qIndex=0; this.eIndex=0;

  shipPick(){ this.shipSelect('flow'); }
  _shipPickRetired(filter=""){

  // Already-booked path: the one question a booked cruiser actually wants answered.
  cabinAsk(msg){
    this.stageEl.innerHTML = `
      <p class="re-progress">Your cabin</p>
      <h2 class="q">Do you already have a cabin number?</h2>
      <p class="re-intro" style="margin-top:-4px">Give me the number and I'll tell you what to expect — the good, and the parts the brochure skips.</p>
      ${msg?`<p style="color:#ffca4f;margin:6px 0 0">${msg}</p>`:""}
      <input id="cabinNum" placeholder="e.g. 8234" autocomplete="off"
        onkeydown="if(event.key==='Enter')RC.cabinCheck()">

  personalityQ(){

  }
  answerP(qi,oi){
    this.snapshot('personalityQ');
    const q=PERSONALITY_QS[qi], weights=q.opts[oi][1];
    this.raw=this.raw||{}; this.raw[q.key]=q.opts[oi][0];
    this.traits=this.traits||{};

  async reveal(){
    this.stageEl.innerHTML = `<p class="re-progress">The reveal</p><h2 class="q">Checking my notes against your answers…</h2>`;
    let shipsToShow=[], reason="";

  async rooms(repSlug, shipName){

        headers:{"Content-Type":"application/json"},

          priority:this.expect.priority, budget:this.expect.budget, motion:this.expect.motion==="yes"})});
      if(r.ok) d=await r.json();
    }catch{/* handled below */}
    if(!d||!d.picks?.length){
      /* Prefer the API's own reason when it has one (e.g. outcome "no-data": we hold

      this.stageEl.innerHTML = `<p class="re-progress">Your rooms</p>

  drawRooms(){
    const d=this.roomsData;
    const picks=d.picks.map(p=>{
      const f=p.facts||{};
      const on=this.picked.has(p.cabin);
      const chips=[f.deck?`Deck ${f.deck}`:null,f.category||null,f.view||null].filter(Boolean)

        <div style="text-align:right;margin-top:8px"><button class="re-btn ${on?'yes':'no'}" style="font-size:14px;padding:9px 16px"
          onclick="RC.togglePick('${p.cabin}')">${on?'✓ Picked':'Pick this room'}</button></div>
      </div>`;}).join("");
    const steer=(d.steerClear||[]).slice(0,3).map(s=>
      `<li style="margin:0 0 6px">${s.cabin?`<b>Cabin ${s.cabin}</b> — `:s.area?`<b>${s.area}</b> — `:""}${s.reason||""}</li>`).join("");
    const sendBar=this.picked.size?`
      <div class="re-cta"><h3>${this.picked.size} room${this.picked.size>1?"s":""} picked</h3>
        <p>Send them over and I'll check the pick, the price, and the itinerary before you book a thing.</p>
        <a class="re-btn yes" style="text-decoration:none;display:inline-block"
          href="/cabin-request.html?ship=${encodeURIComponent(this.roomsShip)}&cabins=${encodeURIComponent([...this.picked].join(","))}">Send my picks</a></div>`
      : this.cta();
    /* When we could not serve the room TYPE that was asked for, the API says so in
       `note` — the ship genuinely has none, we have not researched that type there
       yet, or we cannot read that ship's categories. Showing the cards without it
       is the 8/16 bug from the visitor's seat: rooms of the wrong kind and no
       explanation. It leads, above the picks, because it changes how they read them. */
    const note = d.note
      ? `<p class="re-intro" style="background:rgba(255,202,79,.12);border-left:3px solid #ffca4f;
           border-radius:8px;padding:12px 14px;margin:0 0 16px">${d.note}</p>` : "";
    /* 92 of the 138 hulls inherit their cabin numbering from a sister ship. Sisters
       agree 93-99%, not 100%, so say so rather than implying we verified this hull. */
    const inherited = d.numberingVerified === false
      ? `<p class="re-intro" style="font-size:14.5px;font-style:italic;margin:0 0 14px">
           Cabin numbers here come from her sister ship, and the two match almost every time.
           Still — confirm the exact room with me before you book it. Sisters have surprised me before.</p>` : "";
    this.stageEl.innerHTML = `
      <p class="re-progress">Your rooms · ${this.roomsShip}</p>
      <h2 class="q">${d.outcome === "ship-has-none" || d.outcome === "none-researched" || d.outcome === "type-not-mapped"
        ? "Here's what I'd do instead." : "Here's where I'd put you."}</h2>
      ${note}${inherited}
      ${picks}
      ${steer?`<details class="why" style="margin:0 0 14px"><summary style="color:#ffca4f;font-weight:800">Worth walking past — ${(d.steerClear||[]).length} rooms I'd skip</summary>
        <ul style="margin:8px 0 0;padding-left:18px;font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.78)">${steer}</ul></details>`:""}
      ${sendBar}`;
  }
  togglePick(cabin){ this.picked.has(cabin)?this.picked.delete(cabin):this.picked.add(cabin); this.drawRooms(); }
  cta(){
    return `<div class="re-cta">
      <h3>Want a second set of eyes before you book?</h3>
      <p>Send over what you told me and I'll give the pick, the price, and the itinerary a proper
      read — before money, vacation time, and patience get wasted. No fee, no pressure.</p>
      <a class="re-btn yes" style="text-decoration:none;display:inline-block" href="/cabin-request.html">Send it over — I'll take a look</a>
    </div>`;
  }
}
const LANG="en";
const RC=new RoomConciergeFlow(); RC.landing();
</script>
