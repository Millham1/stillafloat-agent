<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Concierge | Still Afloat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#07183f;--ocean:#0077b6;--seafoam:#5dff9a;--gold:#ffca4f;--cream:#faf6ee}
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo 2',sans-serif;background:#040a16;color:var(--navy)}
/* Same canvas as affiliate.html — identical art, identical wash. */
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(4,10,22,.55) 0%,rgba(4,10,22,.72) 100%),
  url('/assets/images/cruising-gear-bg.png') center/cover fixed}
.re-shell{max-width:960px;margin:0 auto;padding:70px 60px 84px;position:relative}

/* ── The concierge card IS the cabin illustration — rounded, framed, characters on the corners ── */
.re-frame{position:relative}
.re-card{position:relative;border-radius:36px;border:3px solid var(--navy);overflow:hidden;
  background:url('/assets/concierge/cabin-card.jpg') center/cover no-repeat;box-shadow:0 30px 80px rgba(0,0,0,.6);
  padding:56px 56px 48px;height:min(86vh,860px);display:flex;align-items:stretch;justify-content:center}
.panel-hold{position:relative;max-width:600px;width:100%;display:flex}
.corner{position:absolute;z-index:6;height:140px;width:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.corner.tl{top:-52px;left:-44px;transform:rotate(-6deg)}
.corner.tr{top:-52px;right:-44px;transform:rotate(6deg) scaleX(-1)}
.corner.bl{bottom:-44px;left:-46px;transform:rotate(5deg)}
.corner.br{bottom:-44px;right:-46px;transform:rotate(-5deg) scaleX(-1)}

/* Soft cream panel floating on the cabin art — the writable surface. */
.re-panel{position:relative;background:rgba(250,246,238,.94);border:2px solid rgba(7,24,63,.5);
  border-radius:26px;padding:20px 6px 18px 26px;width:100%;display:flex;flex-direction:column;
  box-shadow:0 14px 40px rgba(7,24,63,.28)}
.re-kick{text-align:center;font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);margin:0 0 4px}
h1{font-family:'Bree Serif',serif;text-align:center;font-size:clamp(28px,4.8vw,40px);margin:2px 0 14px;color:var(--navy);line-height:1.12}
h2.q{font-family:'Bree Serif',serif;font-size:clamp(20px,3.4vw,25px);text-align:center;margin:14px 0 16px;color:var(--navy);line-height:1.3}
.re-intro{font-size:18.5px;line-height:1.65;color:#22345c;margin:0 auto 4px;text-align:center}
.re-intro b{color:var(--navy)}
.re-fork{text-align:center;margin:20px 0 2px}
.re-choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.re-btn{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;border-radius:15px;padding:13px 24px;cursor:pointer;border:2.5px solid var(--navy);transition:transform .15s ease;background:#fff;color:var(--navy)}
.re-btn:hover{transform:translateY(-2px)}
.re-btn.yes{background:var(--navy);color:var(--gold)}
.re-btn.no{background:var(--gold);color:var(--navy)}
.re-opts{display:flex;flex-direction:column;gap:11px;margin:0 auto}
.re-opt{text-align:left;font-family:'Baloo 2',sans-serif;font-size:15.5px;font-weight:600;line-height:1.45;background:#fff;border:2px solid rgba(7,24,63,.22);border-radius:15px;padding:13px 17px;cursor:pointer;transition:all .15s}
.re-opt:hover{border-color:var(--ocean);transform:translateX(4px)}
.re-progress{text-align:center;font-size:12px;font-weight:800;letter-spacing:.1em;color:#8896b0;text-transform:uppercase;margin:0 0 6px}
/* The advisor reminder — one quiet line. No photo, no button, no pitch. */
.quiet{margin:16px 0 0;text-align:center;font-size:13px;color:var(--navy);font-weight:600;font-style:italic}
/* reveal card */
.reveal-ship{background:#fff;border:2px solid rgba(7,24,63,.16);border-radius:18px;padding:18px 20px;margin:0 0 14px}
.reveal-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.reveal-head h3{font-family:'Bree Serif',serif;font-size:22px;margin:0;color:var(--navy)}
.reveal-head .line{color:#5a6b85;font-size:13px;font-weight:600}
.conga-score-wrap{display:flex;align-items:center;gap:13px;margin:9px 0 4px;flex-wrap:wrap}
.conga-mini{display:flex;align-items:flex-end;background:#fff;border-radius:10px;overflow:hidden}
.conga-mini img{height:58px;width:auto;display:block}
.conga-num{font-family:'Bree Serif',serif;font-size:27px;color:var(--ocean)}
.conga-num small{font-size:14px;color:#8896b0;font-family:'Baloo 2',sans-serif;font-weight:800}
.reveal-comment{font-size:15.5px;line-height:1.55;color:#22345c;margin:9px 0 11px;font-weight:600}
.salty{display:flex;gap:11px;align-items:center;background:#f3edfb;border:1.5px solid #dccdf3;border-radius:13px;padding:9px 13px}
.salty img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid #fff}
.salty .sl{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#6b21a8;display:block;margin-bottom:2px}
.salty p{margin:0;font-size:14px;line-height:1.5;color:#3b2a55}
.reveal-pick{margin:12px 0 0;text-align:right}
.re-cta{margin-top:16px;background:linear-gradient(135deg,rgba(0,119,182,.09),rgba(93,255,154,.12));border:2px solid rgba(0,119,182,.3);border-radius:18px;padding:20px;text-align:center}
.re-cta h3{font-family:'Bree Serif',serif;margin:0 0 8px;font-size:20px}
.re-cta p{margin:0 auto 13px;max-width:460px;font-size:15px;line-height:1.55;color:#33415c}
footer{text-align:center;padding:24px 16px;color:rgba(247,251,255,.6);font-size:14px}
@media(max-width:760px){.re-shell{padding:56px 18px 70px}.re-card{padding:40px 16px 34px;min-height:0}
  .re-panel{padding:22px 18px 20px}
  .corner{height:105px}.corner.tl{top:-38px;left:-12px}.corner.tr{top:-38px;right:-12px}
  .corner.bl{bottom:-34px;left:-12px}.corner.br{bottom:-34px;right:-12px}}

/* The card NEVER moves between stages — only this inner region scrolls. */
.re-scroll{flex:1;overflow-y:auto;padding:6px 22px 8px 2px;scrollbar-width:thin}
.re-topbar{display:flex;align-items:center;min-height:30px;padding:0 22px 0 56px}
.re-back{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;color:var(--ocean);
  background:none;border:none;cursor:pointer;padding:2px 8px 2px 0;display:none}
.re-back.show{display:inline-block}
.re-back:hover{text-decoration:underline}
/* Readability: content cards get real contrast and breathing room */
.reveal-ship{background:#fff;border:2px solid rgba(7,24,63,.22);border-radius:18px;padding:18px 20px;margin:0 0 16px;box-shadow:0 4px 14px rgba(7,24,63,.08)}
.reveal-comment{font-size:16px;line-height:1.6}
.salty p{font-size:14.5px}

/* Gist-first cards */
.gist{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gist h3{font-family:'Bree Serif',serif;font-size:23px;margin:0;color:var(--navy)}
.gist .line{color:#5a6b85;font-size:13px;font-weight:600}
.gist-score{font-family:'Bree Serif',serif;font-size:34px;color:var(--ocean);line-height:1}
.gist-score small{font-size:16px;color:#8896b0}
.gist-dancers{display:flex;align-items:flex-end;margin:6px 0 2px}
.gist-dancers img{height:52px;width:auto;display:block}
.room-hook{font-family:'Bree Serif',serif;font-size:18px;line-height:1.35;color:var(--navy);margin:0 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.chip{font-size:12.5px;font-weight:700;color:#33415c;background:rgba(7,24,63,.07);border-radius:999px;padding:3px 10px}
.chip-num{background:var(--navy);color:var(--gold)}
details.why{margin:4px 0 0}
details.why summary{cursor:pointer;font-size:13.5px;font-weight:800;color:var(--ocean);list-style-position:inside}
details.why p{font-size:14.5px;line-height:1.55;color:#33415c;margin:6px 0 0}

.room-why{font-size:14.5px;line-height:1.6;color:#33415c;margin:6px 0 0}
details.cat-info{margin:2px 0 4px}
details.cat-info summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--ocean);list-style-position:inside}
details.cat-info p{font-size:14px;line-height:1.55;color:#33415c;margin:6px 0 2px;background:rgba(0,119,182,.06);border-radius:10px;padding:10px 12px}

.re-coverage{text-align:center;font-size:13px;line-height:1.6;color:#33415c;margin:14px auto 0;max-width:520px}
</style>
</head>
<body>
<div class="re-shell">
  <div class="re-frame">
    <div class="re-card"><div class="panel-hold">
    <img class="corner tl" src="/assets/concierge/corner-1_neutral_cruiser.png" alt="">
    <img class="corner tr" src="/assets/concierge/corner-3_cruiser.png" alt="">
    <img class="corner bl" src="/assets/concierge/corner-4_party_animal.png" alt="">
    <img class="corner br" src="/assets/concierge/corner-5_conga_king_queen.png" alt="">
    <div class="re-panel">
      <div class="re-topbar"><button class="re-back" id="backBtn" onclick="RC.back()">&larr; Back</button></div>
      <div class="re-scroll" id="stage"></div>
    </div>
    </div></div>
  </div>
</div>
<footer>© 2026 Still Afloat LLC — Cruise smarter. Laugh more.</footer>

<script>
const DANCERS={1:'/assets/concierge/dancer-1_neutral_cruiser.jpg',2:'/assets/concierge/dancer-2_tourist.jpg',3:'/assets/concierge/dancer-3_cruiser.jpg',4:'/assets/concierge/dancer-4_party_animal.jpg',5:'/assets/concierge/dancer-5_conga_king_queen.jpg'};
const SALTY_IMG='/assets/concierge/salty-mark.jpg';
</script>
<script>
/* ─────────────────────────────────────────────────────────────────────────────
   RoomConciergeFlow — the full journey, wired.
   landing → fork → (ship picker | –) → 5 questions about you → expectations
   (the finder's Mark-corrected tree) → reveal (published Conga score + Salty
   Mark) → rooms (live-reasoned picks where advice exists) → the one CTA.
   Design is LOCKED (Mark, 8/14) — stages render inside the frosted panel.
──────────────────────────────────────────────────────────────────────────── */
const QUIET = [
  "curated by Still Afloat Cruising, your independent travel advisor",
  "Questions? You can always talk to us.",
];
/* Behavioral interview (model approved by Mark 8/14): remembered behavior,
   forced tradeoffs, projection — never self-description. Each option carries
   hidden trait weights; the TYPE is inferred from the pattern. The visitor
   never sees a label. */
const PERSONALITY_QS = [
  { key:"retell", q:"Think about the best vacation you've ever had. What's the part you still tell people about?",
    opts:[["The meal I'm still chasing", {food:2, splurgeConsume:1}],
          ["The people we met — we still talk", {social:2, energy:1}],
          ["The thing we did that nobody back home believes", {active:2, energy:1}],
          ["That for one week, nobody could reach me", {quiet:2, introvert:1}]] },
  { key:"photos", q:"Open your phone — your last trip's photos are mostly…",
    opts:[["Scenery. Not a human in frame", {quiet:2, introvert:1}],
          ["Us with people we'd just met", {social:2, extrovert:2}],
          ["Food and drinks, honestly", {food:2, splurgeConsume:1}],
          ["The kids having the time of their lives", {family:2}]] },
  { key:"wedding", q:"A wedding reception, 11pm. Where are we finding you?",
    opts:[["On the dance floor", {energy:2, extrovert:1}],
          ["Deep in a conversation that started at dinner", {social:1, introvert:1}],
          ["Gone. We said our goodbyes at 9:30", {quiet:2, introvert:1}],
          ["At the bar, making the bartender laugh", {social:2, energy:1}]] },
  { key:"annoy", q:"What's the FIRST thing that annoys you about other travelers?",
    opts:[["They're loud everywhere they go", {quiet:2, crowdsAvoid:2}],
          ["They wing everything and it shows", {planner:2}],
          ["They wait in lines they didn't have to", {planner:1, active:1}],
          ["They never leave the pool", {active:2}]] },
  { key:"overpay", q:"Last trip — what did you happily overpay for, zero regrets?",
    opts:[["The view from the room", {splurgeCabin:2}],
          ["One unforgettable dinner", {splurgeConsume:2, food:1}],
          ["The excursion everyone said was too expensive", {active:2, splurgeConsume:1}],
          ["Nothing. Getting the deal WAS the trip", {value:2, planner:1}]] },
  { key:"tradeoff", q:"You get one — the other's gone forever:",
    opts:[["The quiet corner nobody else has found", {quiet:2, introvert:2, crowdsAvoid:1}],
          ["The table where everybody knows your name", {social:2, extrovert:2, crowdsLove:1}]] },
];

/* Pattern → the axes the matcher uses. Deterministic and inspectable. */
function inferAxes(traits){
  const t = k => traits[k]||0;
  return {
    energy:  t("energy")>=3 ? "party" : (t("quiet")>=3 ? "quiet" : "social"),
    social:  t("extrovert")>t("introvert")+1 ? "extrovert" : (t("introvert")>t("extrovert")+1 ? "introvert" : "mixed"),
    structure: t("planner")>=2 ? "planner" : "loose",
    splurge: t("splurgeCabin")>=2 ? "cabin" : (t("value")>=2 ? "value" : "consumables"),
    crowds:  t("crowdsAvoid")>=2 || t("quiet")>=4 ? "avoids" : (t("crowdsLove")>=1||t("energy")>=3 ? "loves-it" : "tolerates"),
  };
}
/* The finder's expectation tree, ported verbatim (Mark-corrected copy). */
const EXPECT_QS = [
  { key:"party", q:"Who's going?", opts:[
      ["Just the two of us","couple"],["Family with kids","family"],
      ["Just me","solo"],["Solo, but traveling with a group","solo-group"],
      ["A group of us","group"]] },
  { key:"room", q:"How do you picture using your room?", opts:[
      ["Crash and recharge","inside"],["Wake up to daylight and water","oceanview"],
      ["Coffee outside in my pajamas","balcony"],["The room is part of the vacation","suite"],
      ["Honestly, no idea — pick for me","balcony"]] },
  { key:"priority", q:"What matters most once you're aboard?", opts:[
      ["Waking up to the ocean","ocean"],["Peace and quiet","quiet"],
      ["Being near the action","action"],["Room to spread out","space"]] },
  { key:"budget", q:"How does the trip budget work, honestly?", opts:[
      ["There's a number, and we respect it","lean"],
      ["Comfortable, but every dollar should earn its spot","middle"],
      ["For the right room, the budget moves","treat"],
      ["The budget is whatever makes it perfect","sky"]] },
  { key:"motion", q:"Does anyone get seasick?", opts:[
      ["Yes — keep us steady","yes"],["No, we're fine","no"],
      ["I can grin and bear it","no"]] },
];

/* Room-category explainers — new cruisers don't know an Infinite Veranda from a
   porthole. Text now; image slots come later (Mark, 8/14). Inside needs none. */
const CATEGORY_INFO = [
  { match:/infinite/i, name:"What's an Infinite Veranda?",
    text:"Celebrity's twist on a balcony: the whole room IS the veranda. The window's top half slides down and your sitting area becomes open-air. You get more indoor space out of it — but there's no separate outdoor chair zone, and people either love that or miss a true balcony." },
  { match:/balcony|veranda/i, name:"What's a balcony cabin?",
    text:"Your own private outdoor space — a glass door, a couple of chairs, and the ocean. Morning coffee out there is the thing people can't give up once they've had it." },
  { match:/ocean\s?view|oceanview|window/i, name:"What's an ocean view?",
    text:"A real window to the sea — daylight and a view of where you are, without an outdoor space. You see the ocean; you just don't sit outside in it." },
  { match:/suite/i, name:"What's a suite?",
    text:"More space, and usually more perks — priority lines, better service, sometimes access to areas of the ship regular cabins don't get." },
];
function categoryInfo(cat){
  if(!cat) return "";
  const hit = CATEGORY_INFO.find(c=>c.match.test(cat));
  return hit ? `<details class="cat-info"><summary>${hit.name}</summary><p>${hit.text}</p></details>` : "";
}

/* Scannable options: bold the lead thought, lighten the tail — the eye gets
   the gist without reading the sentence. */
const LINE_DISPLAY = { "Royal Caribbean International": "Royal Caribbean" };
function lineName(l){ return LINE_DISPLAY[l] || l; }
function fmtOpt(label){
  const m = label.match(/^([^,—–.]{4,45})([,—–.].*)$/);
  return m ? `<b>${m[1]}</b><span style="color:#5a6b85;font-weight:500">${m[2]}</span>` : `<b>${label}</b>`;
}

class RoomConciergeFlow {
  constructor() {
    this.path=null; this.personality={}; this.expect={}; this.qIndex=0; this.eIndex=0;
    this.fleet=[]; this.chosen=null; this.suggestion=null; this.picked=new Set();
    this.stageEl=document.getElementById("stage");
    this.history=[];
    this.loadFleet();
  }
  snapshot(renderName){
    this.history.push({renderName,
      state: JSON.parse(JSON.stringify({path:this.path,personality:this.personality,expect:this.expect,
        qIndex:this.qIndex,eIndex:this.eIndex,traits:this.traits||{},raw:this.raw||{},
        chosenSlug:this.chosen?this.chosen.slug:null}))});
    document.getElementById("backBtn").classList.add("show");
  }
  back(){
    const prev=this.history.pop();
    if(!prev){ document.getElementById("backBtn").classList.remove("show"); return this.landing(); }
    const st=prev.state;
    this.path=st.path; this.personality=st.personality; this.expect=st.expect;
    this.qIndex=st.qIndex; this.eIndex=st.eIndex; this.traits=st.traits; this.raw=st.raw;
    this.chosen=st.chosenSlug?this.fleet.find(f=>f.slug===st.chosenSlug)||null:null;
    if(!this.history.length) document.getElementById("backBtn").classList.remove("show");
    this[prev.renderName]();
    this.stageEl.scrollTop=0;
  }
  quiet(i){ return `<p class="quiet">${QUIET[i===0?0:1]}</p>`; }
  async loadFleet(){
    try{ const r=await fetch("/api/cabins/fleet"); this.fleet=(await r.json()).ships||[]; }
    catch{ this.fleet=[]; }
  }
  landing(){
    this.stageEl.innerHTML = `
      <p class="re-kick">Room Concierge</p>
      <h1>Let's find the room<br>you'll brag about.</h1>
      <p class="re-intro">A few quick <b>questions about you</b> — enough to figure out what you want
      out of a trip. Then your <b>expectations</b>. Then <b>real rooms</b> — the exact cabins
      worth booking, and the ones worth walking past. About two minutes.</p>
      <div class="re-fork">
        <h2 class="q">Do you already have a ship in mind?</h2>
        <div class="re-choices">
          <button class="re-btn yes" onclick="RC.fork('ship')">Yes — I know my ship</button>
          <button class="re-btn no" onclick="RC.fork('discover')">Not yet — help me pick</button>
        </div>
      </div>
      <p class="re-coverage" id="coverage"></p>
      ${this.quiet(0)}`;
    this.drawCoverage();
  }
  drawCoverage(){
    const el=document.getElementById("coverage");
    if(!el) return;
    if(!this.fleet.length){ setTimeout(()=>this.drawCoverage(), 400); return; }
    const lines=[...new Set(this.fleet.map(s=>lineName(s.line)))].sort();
    el.innerHTML = `Covering ${this.fleet.length} ships across ${lines.length} lines: ` + lines.join(" · ");
  }
  fork(path){ this.snapshot('landing'); this.path=path; this.qIndex=0; this.eIndex=0;
    path==="ship" ? this.shipPick() : this.personalityQ(); }
  shipPick(filter=""){
    const f=filter.trim().toLowerCase();
    const matches=this.fleet.filter(s=>!f||s.ship.toLowerCase().includes(f)||s.line.toLowerCase().includes(f));
    const byLine={};
    for(const s of matches){ const ln=lineName(s.line); (byLine[ln]=byLine[ln]||[]).push(s); }
    const list=Object.entries(byLine).map(([line,ships])=>
      `<div style="margin:8px 0 2px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#33415c">${line}</div>`+
      ships.map(s=>`<button class="re-opt" style="padding:9px 14px;font-size:15px" onclick="RC.chooseShip('${s.slug}')">${s.ship}</button>`).join("")
    ).join("");
    this.stageEl.innerHTML = `
      <p class="re-progress">Your ship</p>
      <h2 class="q">Which ship?</h2>
      <input id="shipSearch" placeholder="Start typing a ship or line…" value="${filter.replace(/"/g,"&quot;")}"
        style="width:100%;padding:12px 16px;border-radius:14px;border:2px solid rgba(7,24,63,.3);font-family:'Baloo 2',sans-serif;font-size:16px;margin-bottom:10px"
        oninput="RC.shipPick(this.value)">
      <div class="re-opts" style="max-height:300px;overflow-y:auto">${list||'<p style="text-align:center;color:#33415c">No match — check the spelling, or go back and let me pick.</p>'}</div>
      ${this.quiet(1)}`;
    const inp=document.getElementById("shipSearch");
    if(f){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
  }
  chooseShip(slug){ this.snapshot('shipPick'); this.chosen=this.fleet.find(s=>s.slug===slug)||null; this.personalityQ(); }
  personalityQ(){
    const i=this.qIndex;
    if(i>=PERSONALITY_QS.length){ this.personality=inferAxes(this.traits); return this.expectQ(); }
    const q=PERSONALITY_QS[i];
    this.stageEl.innerHTML = `
      <p class="re-progress">Getting to know you · ${i+1} of ${PERSONALITY_QS.length}</p>
      <h2 class="q">${q.q}</h2>
      <div class="re-opts">${q.opts.map(([label],oi)=>
        `<button class="re-opt" onclick="RC.answerP(${i},${oi})">${fmtOpt(label)}</button>`).join("")}</div>
      ${this.quiet(1)}`;
  }
  answerP(qi,oi){
    this.snapshot('personalityQ');
    const q=PERSONALITY_QS[qi], weights=q.opts[oi][1];
    this.raw=this.raw||{}; this.raw[q.key]=q.opts[oi][0];
    this.traits=this.traits||{};
    for(const [k,v] of Object.entries(weights)) this.traits[k]=(this.traits[k]||0)+v;
    this.qIndex++; this.personalityQ();
  }
  expectQ(){
    const i=this.eIndex;
    if(i>=EXPECT_QS.length) return this.reveal();
    const q=EXPECT_QS[i];
    this.stageEl.innerHTML = `
      <p class="re-progress">Your expectations · ${i+1} of ${EXPECT_QS.length}</p>
      <h2 class="q">${q.q}</h2>
      <div class="re-opts">${q.opts.map(([label,val])=>
        `<button class="re-opt" onclick="RC.answerE('${q.key}','${val}')">${fmtOpt(label)}</button>`).join("")}</div>
      ${this.quiet(1)}`;
  }
  answerE(key,val){ this.snapshot('expectQ'); this.expect[key]=val; this.eIndex++; this.expectQ(); }
  async reveal(){
    this.stageEl.innerHTML = `<p class="re-progress">The reveal</p><h2 class="q">Working on it…</h2>`;
    let shipsToShow=[], reason="";
    if(this.path==="ship" && this.chosen){ shipsToShow=[this.chosen]; }
    else{
      try{
        const r=await fetch("/api/cabins/suggest-ships",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({personality:this.personality, party:this.expect.party, traits:this.traits, raw:this.raw, budget:this.expect.budget})});
        const d=await r.json(); shipsToShow=d.picks||[]; reason=d.reason||"";
      }catch{ shipsToShow=[]; }
    }
    if(!shipsToShow.length){
      this.stageEl.innerHTML = `<p class="re-progress">The reveal</p>
        <h2 class="q">I'd rather get this right than guess.</h2>
        <p class="re-intro">Something didn't line up on my end. Send over what you told me and a real
        person will finish the job.</p>${this.cta()}`;
      return;
    }
    const settled=await Promise.allSettled(shipsToShow.map(s=>this.shipCard(s)));
    const cards=settled.filter(r=>r.status==="fulfilled").map(r=>r.value);
    if(settled.some(r=>r.status==="rejected")) console.error("ship card failed", settled.find(r=>r.status==="rejected"));
    const heading=this.path==="ship" ? "Your ship, scored honestly." :
      (cards.length>1?"Two ships that fit you.":"The ship that fits you.");
    const altOffer=this.path==="ship"?`<p style="text-align:center;margin:2px 0 12px"><button class="re-btn" style="font-size:14px;padding:9px 18px" onclick="RC.snapshot('reveal');RC.path='discover';RC.reveal()">Or show me what YOU'D pick for me &rarr;</button></p>`:"";
    this.stageEl.innerHTML = `
      <p class="re-progress">The reveal</p>
      <h2 class="q">${heading}</h2>
      ${reason?`<p class="re-intro" style="font-size:15.5px">${reason}</p>`:""}
      ${altOffer}
      ${cards.join("")}
      ${this.cta()}`;
  }
  async shipCard(s){
    let rating=null, comment=null, salty=null;
    try{
      const r=await fetch(`/api/ships/${encodeURIComponent(s.slug)}/rating`);
      if(r.ok){ const d=await r.json(); if(d.ok){ rating=d.rating; comment=d.comment; salty=d.saltyMarkTake; } }
    }catch{/* no rating shown */}
    const nextLevel = s.nextLevel ? `
      <div style="display:flex;gap:10px;align-items:center;background:#fff8e6;border:1.5px solid #ecd9a0;border-radius:13px;padding:9px 13px;margin:0 0 10px">
        <span style="font-size:20px">✦</span>
        <div><span style="font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#8a6d1a;display:block;margin-bottom:2px">Next level: ${s.nextLevel.name}</span>
        <p style="margin:0;font-size:14px;line-height:1.5;color:#5c4a12">${s.nextLevel.why}</p></div>
      </div>` : "";
    const roomsBtn = s.hasRooms
      ? `<button class="re-btn no" onclick="RC.rooms('${s.repSlug}','${s.ship.replace(/'/g,"\\'")}')">Show me the rooms →</button>`
      : `<span style="font-size:13.5px;color:#5a6b85;font-style:italic">Room-by-room picks for this ship are coming — ask and we'll do it by hand.</span>`;
    return `<div class="reveal-ship">
      <div class="gist">
        <div><h3>${s.ship}</h3><span class="line">${lineName(s.line)}</span></div>
        ${rating!=null?`<div class="gist-score">${Number(rating).toFixed(1)}<small>/5</small></div>`:""}
      </div>
      ${rating!=null?`<div class="gist-dancers">${[1,2,3,4,5].map(n=>
        `<img src="${DANCERS[n]}" style="${n<=Math.floor(rating)?'':'opacity:.22;filter:grayscale(80%)'}" alt="">`).join("")}</div>`:""}
      ${comment?`<p class="reveal-comment">&ldquo;${comment}&rdquo;</p>`:""}
      ${salty?`<div class="salty"><img src="${SALTY_IMG}" alt="Salty Mark">
        <div><span class="sl">Salty Mark says</span><p>&ldquo;${salty}&rdquo;</p></div></div>`:""}
      ${nextLevel}
      <div class="reveal-pick">${roomsBtn}</div>
    </div>`;
  }
  async rooms(repSlug, shipName){
    this.snapshot('reveal');
    this.stageEl.innerHTML = `<p class="re-progress">Your rooms</p><h2 class="q">Pulling the rooms I'd pick on ${shipName}…</h2>`;
    let d=null;
    try{
      const r=await fetch("/api/cabins/recommend",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ship:repSlug, party:this.expect.party, room:this.expect.room,
          priority:this.expect.priority, budget:this.expect.budget, motion:this.expect.motion==="yes"})});
      if(r.ok) d=await r.json();
    }catch{/* handled below */}
    if(!d||!d.picks?.length){
      this.stageEl.innerHTML = `<p class="re-progress">Your rooms</p>
        <h2 class="q">This one needs the human touch.</h2>
        <p class="re-intro">I don't have room-level picks for ${shipName} loaded yet — send your answers
        over and it gets done by hand.</p>${this.cta()}`;
      return;
    }
    this.picked=new Set(); this.roomsData=d; this.roomsShip=shipName; this.roomsRep=repSlug;
    this.drawRooms();
  }
  drawRooms(){
    const d=this.roomsData;
    const picks=d.picks.map(p=>{
      const f=p.facts||{};
      const on=this.picked.has(p.cabin);
      const chips=[f.deck?`Deck ${f.deck}`:null,f.category||null,f.view||null].filter(Boolean)
        .map(c=>`<span class="chip">${c}</span>`).join("");
      return `<div class="reveal-ship" style="padding:15px 18px">
        ${p.hook?`<p class="room-hook">${p.hook}</p>`:`<p class="room-hook">Cabin ${p.cabin}</p>`}
        <div class="chips"><span class="chip chip-num">Cabin ${p.cabin}</span>${chips}</div>
        ${categoryInfo(f.category)}
        ${p.reason?`<p class="room-why">${p.reason}</p>`:""}
        <div style="text-align:right;margin-top:8px"><button class="re-btn ${on?'yes':'no'}" style="font-size:14px;padding:9px 16px"
          onclick="RC.togglePick('${p.cabin}')">${on?'✓ Picked':'Pick this room'}</button></div>
      </div>`;}).join("");
    const steer=(d.steerClear||[]).slice(0,3).map(s=>
      `<li style="margin:0 0 6px">${s.cabin?`<b>Cabin ${s.cabin}</b> — `:s.area?`<b>${s.area}</b> — `:""}${s.reason||""}</li>`).join("");
    const sendBar=this.picked.size?`
      <div class="re-cta"><h3>${this.picked.size} room${this.picked.size>1?"s":""} picked</h3>
        <p>Send them over and a real person checks the pick, the price, and the itinerary before you book.</p>
        <a class="re-btn yes" style="text-decoration:none;display:inline-block"
          href="/cabin-request.html?ship=${encodeURIComponent(this.roomsShip)}&cabins=${encodeURIComponent([...this.picked].join(","))}">Send my picks</a></div>`
      : this.cta();
    this.stageEl.innerHTML = `
      <p class="re-progress">Your rooms · ${this.roomsShip}</p>
      <h2 class="q">Here's where I'd put you.</h2>
      ${picks}
      ${steer?`<details class="why" style="margin:0 0 14px"><summary style="color:#b45309;font-weight:800">Worth walking past — ${(d.steerClear||[]).length} rooms I'd skip</summary>
        <ul style="margin:8px 0 0;padding-left:18px;font-size:14.5px;line-height:1.6;color:#33415c">${steer}</ul></details>`:""}
      ${sendBar}`;
  }
  togglePick(cabin){ this.picked.has(cabin)?this.picked.delete(cabin):this.picked.add(cabin); this.drawRooms(); }
  cta(){
    return `<div class="re-cta">
      <h3>Want a real person to sanity-check it?</h3>
      <p>Send over what you told me — the pick, the price, and the itinerary get a human read
      before you book a thing. No fee, no pressure.</p>
      <a class="re-btn yes" style="text-decoration:none;display:inline-block" href="/cabin-request.html">Talk to us</a>
    </div>`;
  }
}
const RC=new RoomConciergeFlow(); RC.landing();
</script>
</body>
</html>
