<script>
const DANCERS={1:'/assets/concierge/dancer-1_neutral_cruiser.jpg',2:'/assets/concierge/dancer-2_tourist.jpg',3:'/assets/concierge/dancer-3_cruiser.jpg',4:'/assets/concierge/dancer-4_party_animal.jpg',5:'/assets/concierge/dancer-5_conga_king_queen.jpg'};
const SALTY_IMG='/assets/concierge/salty-mark.jpg';

<script>
/* ─────────────────────────────────────────────────────────────────────────────
   RoomConciergeFlow — the full journey, wired.
   landing → fork → (ship picker | –) → 5 questions about you → expectations
   (the finder's Mark-corrected tree) → reveal (published Conga score + Salty
   Mark) → rooms (live-reasoned picks where advice exists) → the one CTA.
   Design is LOCKED (Mark, 8/14) — stages render inside the frosted panel.
──────────────────────────────────────────────────────────────────────────── */
const QUIET = [
  "Still Afloat Cruising — your independent travel advisor",
  "Questions? You can always talk to me.",
];
/* Behavioral interview (model approved by Mark 8/14): remembered behavior,
   forced tradeoffs, projection — never self-description. Each option carries
   hidden trait weights; the TYPE is inferred from the pattern. The visitor
   never sees a label. */
const PERSONALITY_QS = [
  { key:"retell", q:"Think about the best vacation you've ever had. What's the part you still tell people about?",
    opts:[["The meal I'm still chasing", {food:2, splurgeConsume:1}],
          ["The people we met — we still talk", {social:2, energy:1}],
          ["The thing we did that nobody back home believes", {active:2, energy:1}],
          ["That for one week, nobody could reach me", {quiet:2, introvert:1}]] },
  { key:"photos", q:"Open your phone — your last trip's photos are mostly…",
    opts:[["Scenery. Not a human in frame", {quiet:2, introvert:1}],
          ["Us with people we'd just met", {social:2, extrovert:2}],
          ["Food and drinks, honestly", {food:2, splurgeConsume:1}],
          ["The kids having the time of their lives", {family:2}]] },
  { key:"wedding", q:"A wedding reception, 11pm. Where are we finding you?",
    opts:[["On the dance floor", {energy:2, extrovert:1}],
          ["Deep in a conversation that started at dinner", {social:1, introvert:1}],
          ["Gone. We said our goodbyes at 9:30", {quiet:2, introvert:1}],
          ["At the bar, making the bartender laugh", {social:2, energy:1}]] },
  { key:"annoy", q:"What's the FIRST thing that annoys you about other travelers?",
    opts:[["They're loud everywhere they go", {quiet:2, crowdsAvoid:2}],
          ["They wing everything and it shows", {planner:2}],
          ["They wait in lines they didn't have to", {planner:1, active:1}],
          ["They never leave the pool", {active:2}]] },
  { key:"overpay", q:"Last trip — what did you happily overpay for, zero regrets?",
    opts:[["The view from the room", {splurgeCabin:2}],
          ["One unforgettable dinner", {splurgeConsume:2, food:1}],
          ["The excursion everyone said was too expensive", {active:2, splurgeConsume:1}],
          ["Nothing. Getting the deal WAS the trip", {value:2, planner:1}]] },
  { key:"tradeoff", q:"You get one — the other's gone forever:",
    opts:[["The quiet corner nobody else has found", {quiet:2, introvert:2, crowdsAvoid:1}],
          ["The table where everybody knows your name", {social:2, extrovert:2, crowdsLove:1}]] },
];

/* Pattern → the axes the matcher uses. Deterministic and inspectable. */
function inferAxes(traits){
  const t = k => traits[k]||0;
  return {
    energy:  t("energy")>=3 ? "party" : (t("quiet")>=3 ? "quiet" : "social"),
    social:  t("extrovert")>t("introvert")+1 ? "extrovert" : (t("introvert")>t("extrovert")+1 ? "introvert" : "mixed"),
    structure: t("planner")>=2 ? "planner" : "loose",
    splurge: t("splurgeCabin")>=2 ? "cabin" : (t("value")>=2 ? "value" : "consumables"),
    crowds:  t("crowdsAvoid")>=2 || t("quiet")>=4 ? "avoids" : (t("crowdsLove")>=1||t("energy")>=3 ? "loves-it" : "tolerates"),
  };
}
/* The finder's expectation tree, ported verbatim (Mark-corrected copy). */
const REGION_NAMES = {e_caribbean:"Eastern Caribbean",w_caribbean:"Western Caribbean",s_caribbean:"Southern Caribbean",
  bahamas:"The Bahamas",alaska:"Alaska",mediterranean:"The Mediterranean",mexican_riviera:"Mexican Riviera",
  n_europe:"Northern Europe",bermuda:"Bermuda",hawaii:"Hawaii",canada_ne:"Canada & New England"};
const EXPECT_QS = [
  { key:"destination", q:"Where are you dreaming of?", opts:[
      ["Eastern Caribbean","e_caribbean"],["Western Caribbean","w_caribbean"],
      ["Southern Caribbean","s_caribbean"],["The Bahamas","bahamas"],
      ["Alaska","alaska"],["The Mediterranean","mediterranean"],
      ["Mexican Riviera","mexican_riviera"],
      ["Surprise me — anywhere the ship fits","surprise"]] },
  { key:"party", q:"Who's going?", opts:[
      ["Just the two of us","couple"],["Family with kids","family"],
      ["Just me","solo"],["Solo, but traveling with a group","solo-group"],
      ["A group of us","group"]] },
  { key:"room", q:"How do you picture using your room?", opts:[
      ["Crash and recharge","inside"],["Wake up to daylight and water","oceanview"],
      ["Coffee outside in my pajamas","balcony"],["The room is part of the vacation","suite"],
      ["Honestly, no idea — pick for me","balcony"]] },
  { key:"priority", q:"What matters most once you're aboard?", opts:[
      ["Waking up to the ocean","ocean"],["Peace and quiet","quiet"],
      ["Being near the action","action"],["Room to spread out","space"]] },
  { key:"budget", q:"How does the trip budget work, honestly?", opts:[
      ["There's a number, and we respect it","lean"],
      ["Comfortable, but every dollar should earn its spot","middle"],
      ["For the right room, the budget moves","treat"],
      ["The budget is whatever makes it perfect","sky"]] },
  { key:"motion", q:"Does anyone get seasick?", opts:[
      ["Yes — keep us steady","yes"],["No, we're fine","no"],
      ["I can grin and bear it","no"]] },
];

/* Room-category explainers — new cruisers don't know an Infinite Veranda from a
   porthole. Text now; image slots come later (Mark, 8/14). Inside needs none. */
const CATEGORY_INFO = [
  { match:/infinite/i, name:"What's an Infinite Veranda?",
    text:"Celebrity's twist on a balcony: the whole room IS the veranda. The window's top half slides down and your sitting area becomes open-air. You get more indoor space out of it — but there's no separate outdoor chair zone, and people either love that or miss a true balcony." },
  { match:/balcony|veranda/i, name:"What's a balcony cabin?",
    text:"Your own private outdoor space — a glass door, a couple of chairs, and the ocean. Morning coffee out there is the thing people can't give up once they've had it. And it's the one deck chair on the ship nobody can claim with a towel." },
  { match:/ocean\s?view|oceanview|window/i, name:"What's an ocean view?",
    text:"A real window to the sea — daylight and a view of where you are, without an outdoor space. You see the ocean; you just don't sit outside in it." },
  { match:/suite/i, name:"What's a suite?",
    text:"More space, and usually more perks — priority lines, better service, sometimes access to areas of the ship regular cabins don't get." },
];
function categoryInfo(cat){
  if(!cat) return "";
  const hit = CATEGORY_INFO.find(c=>c.match.test(cat));
  return hit ? `<details class="cat-info"><summary>${hit.name}</summary><p>${hit.text}</p></details>` : "";
}

/* Scannable options: bold the lead thought, lighten the tail — the eye gets
   the gist without reading the sentence. */
const LINE_DISPLAY = { "Royal Caribbean International": "Royal Caribbean" };
function lineName(l){ return LINE_DISPLAY[l] || l; }
function fmtOpt(label){
  const m = label.match(/^([^,—–.]{4,45})([,—–.].*)$/);
  return m ? `<b>${m[1]}</b><span style="color:#5a6b85;font-weight:500">${m[2]}</span>` : `<b>${label}</b>`;
}

class RoomConciergeFlow {
  constructor() {
    this.path=null; this.personality={}; this.expect={}; this.qIndex=0; this.eIndex=0;
    this.fleet=[]; this.chosen=null; this.suggestion=null; this.picked=new Set();
    this.stageEl=document.getElementById("stage");
    this.history=[];
    this.loadFleet();
  }
  snapshot(renderName){
    this.history.push({renderName,
      state: JSON.parse(JSON.stringify({path:this.path,personality:this.personality,expect:this.expect,
        qIndex:this.qIndex,eIndex:this.eIndex,traits:this.traits||{},raw:this.raw||{},
        chosenSlug:this.chosen?this.chosen.slug:null}))});
    document.getElementById("backBtn").classList.add("show");
  }
  back(){
    const prev=this.history.pop();
    if(!prev){ document.getElementById("backBtn").classList.remove("show"); return this.landing(); }
    const st=prev.state;
    this.path=st.path; this.personality=st.personality; this.expect=st.expect;
    this.qIndex=st.qIndex; this.eIndex=st.eIndex; this.traits=st.traits; this.raw=st.raw;
    this.chosen=st.chosenSlug?this.fleet.find(f=>f.slug===st.chosenSlug)||null:null;
    if(!this.history.length) document.getElementById("backBtn").classList.remove("show");
    this[prev.renderName]();
    this.stageEl.scrollTop=0;
  }
  quiet(i){ return `<p class="quiet">${QUIET[i===0?0:1]}</p>`; }
  async loadFleet(){
    try{ const r=await fetch("/api/cabins/fleet"); this.fleet=(await r.json()).ships||[]; }
    catch{ this.fleet=[]; }
  }
  landing(){
    this.stageEl.innerHTML = `
      <div class="land-grid">
        <div>
          <p class="re-kick">Room Concierge</p>
          <h1>Some cabins wake up to the ocean.<br>Some wake up to the anchor chain.</h1>
          <p class="re-intro">The deck plan won't tell you which is which — it's a grid of numbers, and
          I've spent more than twenty years learning what those numbers mean: which cabins sit under the
          pool deck, which ones sleep soundly, which balcony faces a steel wall. A few quick
          <b>questions about you</b>, then your <b>expectations</b> — and I'll name the <b>exact cabins</b>
          I'd book myself, and the few I'd steer my own family past. That homework is already done.
          The only studying left is the pool-bar menu.</p>
          <div class="hint">&#128719; Free to look &mdash; no sign-up &middot; every cabin researched by hand</div>
          <div class="re-fork">
            <h2 class="q">Do you already have a ship in mind?</h2>
            <div class="re-choices">
              <button class="re-btn yes" onclick="RC.fork('ship')">Yes — I know my ship</button>
              <button class="re-btn no" onclick="RC.fork('discover')">Not yet — find me the right one</button>
            </div>
            <p style="margin:14px 0 0"><button class="re-btn" onclick="RC.checkStart()">I'm booked — tell me the truth about my cabin</button></p>
          </div>
        </div>
        <aside class="lines-card">
          <h3>The cruise lines I know cabin by cabin:</h3>
          <ul id="linesList"></ul>
          <p class="ships-count" id="coverage"></p>
        </aside>
      </div>
      ${this.quiet(0)}`;
    this.drawCoverage();
  }
  drawCoverage(){
    const el=document.getElementById("coverage"), ul=document.getElementById("linesList");
    if(!el||!ul) return;
    if(!this.fleet.length){ setTimeout(()=>this.drawCoverage(), 400); return; }
    const lines=[...new Set(this.fleet.map(s=>lineName(s.line)))].sort();
    ul.innerHTML = lines.map(l=>`<li>${l}</li>`).join("");
    el.innerHTML = `${this.fleet.length} ships researched so far — and the shipyards keep building.`;
  }
  fork(path){ this.snapshot('landing'); this.path=path; this.qIndex=0; this.eIndex=0;
    path==="ship" ? this.shipSelect('flow') : this.personalityQ(); }
  shipPick(){ this.shipSelect('flow'); }
  _shipPickRetired(filter=""){
    const f=filter.trim().toLowerCase();
    const matches=this.fleet.filter(s=>!f||s.ship.toLowerCase().includes(f)||s.line.toLowerCase().includes(f));
    const byLine={};
    for(const s of matches){ const ln=lineName(s.line); (byLine[ln]=byLine[ln]||[]).push(s); }
    const list=Object.entries(byLine).map(([line,ships])=>
      `<div style="margin:12px 0 4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(93,255,154,.85)">${line}</div>`+
      ships.map(s=>`<button class="re-opt" style="padding:9px 14px;font-size:15px" onclick="RC.chooseShip('${s.slug}')">${s.ship}</button>`).join("")
    ).join("");
    this.stageEl.innerHTML = `
      <p class="re-progress">Your ship</p>
      <h2 class="q">Which ship?</h2>
      <input id="shipSearch" placeholder="Start typing a ship or line…" value="${filter.replace(/"/g,"&quot;")}"
        
        oninput="RC.shipPick(this.value)">
      <div class="re-opts" style="max-height:300px;overflow-y:auto">${list||'<p style="color:rgba(255,255,255,.7)">No match — check the spelling, or go back and let me pick.</p>'}</div>
      ${this.quiet(1)}`;
    const inp=document.getElementById("shipSearch");
    if(f){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
  }
  chooseShip(slug){ this.snapshot('shipPick'); this.chosen=this.fleet.find(s=>s.slug===slug)||null; this.cabinAsk(); }

  // ONE ship selector, two jobs (Mark, 2026-08-21: the two entries were showing
  // the same info in different formats). mode 'flow' = choosing; mode 'check' =
  // already booked, adds the cabin-number field.
  checkStart(){ this.shipSelect('check'); }
  shipSelect(mode){
    this.snapshot('landing');
    this._selMode = mode;
    const lines=[...new Set(this.fleet.map(x=>x.line))].sort();
    const opOpts=lines.map(l=>`<option value="${l.replace(/"/g,'&quot;')}">${lineName(l)}</option>`).join("");
    const head = mode==='check'
      ? {kick:"Cabin check", q:"Already booked? Bring me the cabin number.",
         sub:"Line, ship, and room number — I'll tell you what the research says about the view, the noise, and the motion. Most cabins come back just fine. And if yours has a surprise in it, better to hear it from me now than from the thrusters on night one."}
      : {kick:"Your ship", q:"Which ship are we talking about?",
         sub:"Pick the line, then the ship. I'll take it from there."};
    this.stageEl.innerHTML = `
      <p class="re-progress">${head.kick}</p>
      <h2 class="q">${head.q}</h2>
      <p class="re-intro" style="margin-top:-4px">${head.sub}</p>
      <label class="re-lbl" for="ckOp">Cruise line</label>
      <select id="ckOp" onchange="RC.checkShipList(this.value)">
        <option value="">Choose your cruise line…</option>${opOpts}</select>
      <label class="re-lbl" for="ckShip">Ship</label>
      <select id="ckShip" disabled onchange="RC.checkPickShip(this.value)">
        <option value="">Choose the line first…</option></select>
      ${mode==='check'?`
      <label class="re-lbl" for="cabinNum">Cabin number</label>
      <input id="cabinNum" placeholder="e.g. 8234" autocomplete="off" disabled
        onkeydown="if(event.key==='Enter')RC.cabinCheck()">
      <div class="re-choices" style="margin-top:16px">
        <button class="re-btn yes" id="ckGo" disabled onclick="RC.cabinCheck()">Check my cabin — I'll tell you what you're getting &rarr;</button>
      </div>`:`
      <div class="re-choices" style="margin-top:16px">
        <button class="re-btn yes" id="ckGo" disabled onclick="RC.cabinAsk()">That's the one →</button>
      </div>`}
      ${this.quiet(1)}`;
  }
  checkShipList(line){
    const sel=document.getElementById("ckShip"); if(!sel) return;
    this.chosen=null;
    const ships=this.fleet.filter(x=>x.line===line).sort((a,b)=>a.ship.localeCompare(b.ship));
    sel.innerHTML=`<option value="">Choose your ship…</option>`+
      ships.map(x=>`<option value="${x.slug}">${x.ship}</option>`).join("");
    sel.disabled=!ships.length;
    const num=document.getElementById("cabinNum"), go=document.getElementById("ckGo");
    if(num){ num.disabled=true; num.value=""; } if(go) go.disabled=true;
  }
  checkPickShip(slug){
    this.chosen=this.fleet.find(x=>x.slug===slug)||null;
    const num=document.getElementById("cabinNum"), go=document.getElementById("ckGo");
    if(num) num.disabled=!this.chosen;
    if(go) go.disabled=!this.chosen;
    if(this.chosen){ (num||go).focus&&(num?num.focus():go.focus()); }
  }

  // Already-booked path: the one question a booked cruiser actually wants answered.
  cabinAsk(msg){
    this.stageEl.innerHTML = `
      <p class="re-progress">Your cabin</p>
      <h2 class="q">Do you already have a cabin number?</h2>
      <p class="re-intro" style="margin-top:-4px">Give me the number and I'll tell you what to expect — the good, and the parts the brochure skips.</p>
      ${msg?`<p style="color:#ffca4f;margin:6px 0 0">${msg}</p>`:""}
      <input id="cabinNum" placeholder="e.g. 8234" autocomplete="off"
        onkeydown="if(event.key==='Enter')RC.cabinCheck()">
      <div class="re-choices" style="margin-top:14px">
        <button class="re-btn yes" onclick="RC.cabinCheck()">Check my cabin</button>
        <button class="re-btn no" onclick="RC.personalityQ()">No cabin yet — help me choose</button>
      </div>
      ${this.quiet(1)}`;
    const i=document.getElementById("cabinNum"); if(i) i.focus();
  }
  async cabinCheck(){
    const el=document.getElementById("cabinNum");
    const num=(el&&el.value||"").trim();
    if(!num){ this.cabinAsk(); return; }
    this.snapshot('cabinAsk');
    this.stageEl.innerHTML = `<p class="re-progress">Your cabin</p><h2 class="q">Pulling the deck plans…</h2>`;
    let d={};
    try{
      const r=await fetch("/api/cabins/check",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({ship:this.chosen&&this.chosen.slug,cabin:num,lang:LANG})});
      d=await r.json();
    }catch(e){ d={}; }
    if(!d||d.found!==true){
      const near=(d&&d.near||[]).map(n=>`<button class="re-opt" style="padding:7px 12px;font-size:14px"
        onclick="document.getElementById('cabinNum').value='${n}';RC.cabinCheck()">${n}</button>`).join("");
      this.cabinAsk((d&&d.message)||"");
      if(near){
        const box=document.createElement("div");
        box.innerHTML=`<p style="margin:12px 0 4px;font-size:13px;color:rgba(255,255,255,.75)">Did you mean one of these?</p>
          <div class="re-opts">${near}</div>`;
        this.stageEl.appendChild(box);
      }
      return;
    }
    const where=(d.where||[]).join(" · ");
    const body=(d.body||[]).map(p=>`<p style="line-height:1.6;margin:0 0 10px">${p}</p>`).join("");
    this.stageEl.innerHTML = `
      <p class="re-progress">Your cabin ${d.cabin?("· "+d.cabin):""}</p>
      <h2 class="q">${d.headline||""}</h2>
      ${where?`<p style="font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:rgba(93,255,154,.9);margin:-2px 0 12px">${where}</p>`:""}
      ${body}
      <p style="line-height:1.6;margin:14px 0 0">${d.cta||""}</p>
      <div class="re-choices" style="margin-top:14px">
        <button class="re-btn yes" onclick="RC.personalityQ()">Carry on — help me choose</button>
        <button class="re-btn no" onclick="RC.cabinAsk()">Try another number</button>
      </div>
      ${this.quiet(2)}`;
  }
  personalityQ(){
    const i=this.qIndex;
    if(i>=PERSONALITY_QS.length){ this.personality=inferAxes(this.traits); return this.expectQ(); }
    const q=PERSONALITY_QS[i];
    this.stageEl.innerHTML = `
      <p class="re-progress">Getting to know you · ${i+1} of ${PERSONALITY_QS.length}</p>
      <h2 class="q">${q.q}</h2>
      <div class="re-opts">${q.opts.map(([label],oi)=>
        `<button class="re-opt" onclick="RC.answerP(${i},${oi})">${fmtOpt(label)}</button>`).join("")}</div>
      ${this.quiet(1)}`;
  }
  answerP(qi,oi){
    this.snapshot('personalityQ');
    const q=PERSONALITY_QS[qi], weights=q.opts[oi][1];
    this.raw=this.raw||{}; this.raw[q.key]=q.opts[oi][0];
    this.traits=this.traits||{};
    for(const [k,v] of Object.entries(weights)) this.traits[k]=(this.traits[k]||0)+v;
    this.qIndex++; this.personalityQ();
  }
  expectQ(){
    const i=this.eIndex;
    if(i>=EXPECT_QS.length) return this.reveal();
    const q=EXPECT_QS[i];
    this.stageEl.innerHTML = `
      <p class="re-progress">Your expectations · ${i+1} of ${EXPECT_QS.length}</p>
      <h2 class="q">${q.q}</h2>
      <div class="re-opts">${q.opts.map(([label,val])=>
        `<button class="re-opt" onclick="RC.answerE('${q.key}','${val}')">${fmtOpt(label)}</button>`).join("")}</div>
      ${this.quiet(1)}`;
  }
  answerE(key,val){ this.snapshot('expectQ'); this.expect[key]=val; this.eIndex++; this.expectQ(); }
  async reveal(){
    this.stageEl.innerHTML = `<p class="re-progress">The reveal</p><h2 class="q">Checking my notes against your answers…</h2>`;
    let shipsToShow=[], reason="";
    if(this.path==="ship" && this.chosen){ shipsToShow=[this.chosen]; }
    else{
      try{
        const r=await fetch("/api/cabins/suggest-ships",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({personality:this.personality, party:this.expect.party, traits:this.traits, raw:this.raw, budget:this.expect.budget, destination:this.expect.destination})});
        const d=await r.json(); shipsToShow=d.picks||[]; reason=d.reason||""; this.worthALook=d.worthALook||null;
      }catch{ shipsToShow=[]; }
    }
    if(!shipsToShow.length){
      this.stageEl.innerHTML = `<p class="re-progress">The reveal</p>
        <h2 class="q">I'd rather get this right than guess.</h2>
        <p class="re-intro">Something didn't line up on my end — my fault, not yours. Send over
        what you told me and I'll finish the job by hand.</p>${this.cta()}`;
      return;
    }
    const settled=await Promise.allSettled(shipsToShow.map(s=>this.shipCard(s)));
    const cards=settled.filter(r=>r.status==="fulfilled").map(r=>r.value);
    if(settled.some(r=>r.status==="rejected")) console.error("ship card failed", settled.find(r=>r.status==="rejected"));
    const heading=this.path==="ship" ? "Your ship, and how she fits you." :
      (cards.length>1?"Two ships I'd put you on.":"The ship I'd put you on.");
    const altOffer=this.path==="ship"?`<p style="text-align:center;margin:2px 0 12px"><button class="re-btn" style="font-size:14px;padding:9px 18px" onclick="RC.snapshot('reveal');RC.path='discover';RC.reveal()">Or show me what you'd pick for me &rarr;</button></p>`:"";
    this.stageEl.innerHTML = `
      <p class="re-progress">The reveal</p>
      <h2 class="q">${heading}</h2>
      ${reason?`<p class="re-intro" style="font-size:15.5px">${reason}</p>`:""}
      ${altOffer}
      ${cards.join("")}
      ${await this.worthALookCard()}
      ${this.cta()}`;
  }
  async worthALookCard(){
    const w=this.path==="discover"?this.worthALook:null;
    if(!w) return "";
    let card="";
    try{ card=await this.shipCard(w); }catch(e){ return ""; }
    return `<div style="margin-top:18px;padding-top:6px;border-top:1px dashed rgba(93,255,154,.4)">
      <p style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(93,255,154,.85);margin:10px 0 2px">Worth a look</p>
      <p class="re-intro" style="font-size:15px;margin-bottom:8px">${w.why||""}</p>
      ${card}</div>`;
  }
  async shipCard(s){
    let rating=null, comment=null, salty=null;
    try{
      const r=await fetch(`/api/ships/${encodeURIComponent(s.slug)}/rating`);
      if(r.ok){ const d=await r.json(); if(d.ok){ rating=d.rating; comment=d.comment; salty=d.saltyMarkTake; } }
    }catch{/* no rating shown */}
    const nextLevel = s.nextLevel ? `
      <div style="display:flex;gap:10px;align-items:center;background:rgba(255,202,79,.12);border:1px solid rgba(255,202,79,.35);border-radius:13px;padding:9px 13px;margin:10px 0 10px">
        <span style="font-size:20px">✦</span>
        <div><span style="font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#ffca4f;display:block;margin-bottom:2px">A step up: ${s.nextLevel.name}</span>
        <p style="margin:0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.85)">${s.nextLevel.why}</p></div>
      </div>` : "";
    const roomsBtn = s.hasRooms
      ? `<button class="re-btn no" onclick="RC.rooms('${s.repSlug}','${s.ship.replace(/'/g,"\\'")}')">Show me the rooms →</button>`
      : `<span style="font-size:13.5px;color:#5a6b85;font-style:italic">Room-by-room picks for this ship are still in the works — ask, and I'll do yours by hand.</span>`;
    return `<div class="reveal-ship">
      <div class="gist">
        <div><h3>${s.ship}</h3><span class="line">${lineName(s.line)}</span></div>
        ${rating!=null?`<div class="gist-score">${Number(rating).toFixed(1)}<small>/5</small></div>`:""}
      </div>
      ${(this.expect.destination && this.expect.destination!=="surprise" && (s.regions||[]).includes(this.expect.destination))?`<p style="margin:2px 0 6px;font-size:13px;font-weight:800;color:#5dff9a">⚓ Sails ${REGION_NAMES[this.expect.destination]||this.expect.destination}</p>`:""}
      ${rating!=null?`<p style="margin:6px 0 2px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5dff9a">Our Conga Line rating — how many join the dance</p>
      <div class="gist-dancers">${[1,2,3,4,5].map(n=>
        `<img src="${DANCERS[n]}" style="${n<=Math.floor(rating)?'':'opacity:.22;filter:grayscale(80%)'}" alt="">`).join("")}</div>`:""}
      ${comment?`<p class="reveal-comment">&ldquo;${comment}&rdquo;</p>`:""}
      ${salty?`<div class="salty"><img src="${SALTY_IMG}" alt="Salty Mark">
        <div><span class="sl">Salty Mark says</span><p>&ldquo;${salty}&rdquo;</p></div></div>`:""}
      ${nextLevel}
      <div class="reveal-pick">${roomsBtn}</div>
    </div>`;
  }
  async rooms(repSlug, shipName){
    this.snapshot('reveal');
    this.stageEl.innerHTML = `<p class="re-progress">Your rooms</p><h2 class="q">Pulling the rooms I'd pick on ${shipName}…</h2>`;
    let d=null;
    try{
      const r=await fetch("/api/cabins/recommend",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ship:repSlug, party:this.expect.party, room:this.expect.room,
          priority:this.expect.priority, budget:this.expect.budget, motion:this.expect.motion==="yes"})});
      if(r.ok) d=await r.json();
    }catch{/* handled below */}
    if(!d||!d.picks?.length){
      /* Prefer the API's own reason when it has one (e.g. outcome "no-data": we hold
         nothing for this hull and will not borrow another ship's rooms). The generic
         line is only for a request that failed outright. */
      this.stageEl.innerHTML = `<p class="re-progress">Your rooms</p>
        <h2 class="q">This one needs the human touch.</h2>
        <p class="re-intro">${d?.note || `I don't have room-level picks for ${shipName} yet — send
        over what you told me and I'll work yours up by hand.`}</p>${this.cta()}`;
      return;
    }
    this.picked=new Set(); this.roomsData=d; this.roomsShip=shipName; this.roomsRep=repSlug;
    this.drawRooms();
  }
  drawRooms(){
    const d=this.roomsData;
    const picks=d.picks.map(p=>{
      const f=p.facts||{};
      const on=this.picked.has(p.cabin);
      const chips=[f.deck?`Deck ${f.deck}`:null,f.category||null,f.view||null].filter(Boolean)
        .map(c=>`<span class="chip">${c}</span>`).join("");
      return `<div class="reveal-ship" style="padding:15px 18px">
        ${p.hook?`<p class="room-hook">${p.hook}</p>`:`<p class="room-hook">Cabin ${p.cabin}</p>`}
        <div class="chips"><span class="chip chip-num">Cabin ${p.cabin}</span>${chips}</div>
        ${categoryInfo(f.category)}
        ${p.reason?`<p class="room-why">${p.reason}</p>`:""}
        <div style="text-align:right;margin-top:8px"><button class="re-btn ${on?'yes':'no'}" style="font-size:14px;padding:9px 16px"
          onclick="RC.togglePick('${p.cabin}')">${on?'✓ Picked':'Pick this room'}</button></div>
      </div>`;}).join("");
    const steer=(d.steerClear||[]).slice(0,3).map(s=>
      `<li style="margin:0 0 6px">${s.cabin?`<b>Cabin ${s.cabin}</b> — `:s.area?`<b>${s.area}</b> — `:""}${s.reason||""}</li>`).join("");
    const sendBar=this.picked.size?`
      <div class="re-cta"><h3>${this.picked.size} room${this.picked.size>1?"s":""} picked</h3>
        <p>Send them over and I'll check the pick, the price, and the itinerary before you book a thing.</p>
        <a class="re-btn yes" style="text-decoration:none;display:inline-block"
          href="/cabin-request.html?ship=${encodeURIComponent(this.roomsShip)}&cabins=${encodeURIComponent([...this.picked].join(","))}">Send my picks</a></div>`
      : this.cta();
    /* When we could not serve the room TYPE that was asked for, the API says so in
       `note` — the ship genuinely has none, we have not researched that type there
       yet, or we cannot read that ship's categories. Showing the cards without it
       is the 8/16 bug from the visitor's seat: rooms of the wrong kind and no
       explanation. It leads, above the picks, because it changes how they read them. */
    const note = d.note
      ? `<p class="re-intro" style="background:rgba(255,202,79,.12);border-left:3px solid #ffca4f;
           border-radius:8px;padding:12px 14px;margin:0 0 16px">${d.note}</p>` : "";
    /* 92 of the 138 hulls inherit their cabin numbering from a sister ship. Sisters
       agree 93-99%, not 100%, so say so rather than implying we verified this hull. */
    const inherited = d.numberingVerified === false
      ? `<p class="re-intro" style="font-size:14.5px;font-style:italic;margin:0 0 14px">
           Cabin numbers here come from her sister ship, and the two match almost every time.
           Still — confirm the exact room with me before you book it. Sisters have surprised me before.</p>` : "";
    this.stageEl.innerHTML = `
      <p class="re-progress">Your rooms · ${this.roomsShip}</p>
      <h2 class="q">${d.outcome === "ship-has-none" || d.outcome === "none-researched" || d.outcome === "type-not-mapped"
        ? "Here's what I'd do instead." : "Here's where I'd put you."}</h2>
      ${note}${inherited}
      ${picks}
      ${steer?`<details class="why" style="margin:0 0 14px"><summary style="color:#ffca4f;font-weight:800">Worth walking past — ${(d.steerClear||[]).length} rooms I'd skip</summary>
        <ul style="margin:8px 0 0;padding-left:18px;font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.78)">${steer}</ul></details>`:""}
      ${sendBar}`;
  }
  togglePick(cabin){ this.picked.has(cabin)?this.picked.delete(cabin):this.picked.add(cabin); this.drawRooms(); }
  cta(){
    return `<div class="re-cta">
      <h3>Want a second set of eyes before you book?</h3>
      <p>Send over what you told me and I'll give the pick, the price, and the itinerary a proper
      read — before money, vacation time, and patience get wasted. No fee, no pressure.</p>
      <a class="re-btn yes" style="text-decoration:none;display:inline-block" href="/cabin-request.html">Send it over — I'll take a look</a>
    </div>`;
  }
}
const LANG="en";
const RC=new RoomConciergeFlow(); RC.landing();
</script>
</body>
</html>
