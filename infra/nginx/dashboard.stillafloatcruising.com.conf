# Still Afloat dashboard — standalone SPA at dashboard.stillafloatcruising.com.
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/dashboard.stillafloatcruising.com.conf
# Installed by infra/deploy-nginx.sh on deploy. Never hand-edit on the box.
#
# The dashboard is a static build (BASE_PATH=/) served from disk. It calls the API
# at https://stillafloatcruising.com (CORS-enabled), so no /api proxy is needed here.
server {
    server_name dashboard.stillafloatcruising.com;

    root /root/saf-full/dashboard/dist/public;
    index index.html;

    # ── HTTP Basic Auth gate ──────────────────────────────────────────────────
    # Keeps strangers off the dashboard SPA entirely. One username/password, prompted
    # once per browser. The data itself is already protected by the API token
    # (Layer 1); this is the edge layer so the app shell never loads for randoms.
    auth_basic "Still Afloat Dashboard";
    auth_basic_user_file /etc/nginx/saf-dashboard.htpasswd;

    # ── Public brief surface (NO basic-auth) ──────────────────────────────────
    # Mark's iPhone home-screen brief PWA lives here. HTTP Basic Auth is the wrong
    # gate for it: iOS standalone PWAs silently drop basic-auth credentials, and the
    # deploy re-installs the htpasswd, so the password breaks intermittently. These
    # files carry NO PII — brief.html is an empty shell that fetches everything from
    # the token-gated API at https://stillafloatcruising.com/api/* (Authorization
    # header). So security here is the API access token, not the edge gate.
    # NOTE on Cache-Control below: nginx previously sent NO Cache-Control on the
    # app shell, so Safari's heuristic caching (10% of Last-Modified age) could
    # pin a days-old index.html — and with it an old JS bundle and stale
    # dashboard numbers (the "subscriber count not updating" bug). no-cache =
    # revalidate every load (cheap 304 when unchanged). Hashed /assets/ are
    # immutable by name, so they cache hard. add_header at location level resets
    # inherited headers (see saf-perf.conf), so HSTS is re-declared each time.
    location = /brief.html {
        auth_basic off;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /brief-manifest.json  { auth_basic off; }
    location = /sw.js {
        auth_basic off;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    # iOS requests several apple-touch-icon size variants — exempt them all.
    location ~ ^/apple-touch-icon(-precomposed|-\d+x\d+(-precomposed)?)?\.png$ { auth_basic off; }
    location = /icon-192.png         { auth_basic off; }  # PWA manifest icon
    location = /icon-512.png         { auth_basic off; }  # PWA manifest icon
    location = /favicon.ico          { auth_basic off; }  # browser auto-request
    location = /favicon.svg          { auth_basic off; }

    # App shell: always revalidate (see Cache-Control note above). Deep-route
    # requests fall back here via try_files, so SPA routes get the header too.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Hashed build assets: content-addressed filenames, safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA: serve the file if it exists, else fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dashboard.stillafloatcruising.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dashboard.stillafloatcruising.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirect http -> https for the dashboard subdomain.
server {
    listen 80;
    server_name dashboard.stillafloatcruising.com;
    return 301 https://$host$request_uri;
}
