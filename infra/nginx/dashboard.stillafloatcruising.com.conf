# Still Afloat dashboard — standalone SPA at dashboard.stillafloatcruising.com.
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/dashboard.stillafloatcruising.com.conf
# Installed by infra/deploy-nginx.sh on deploy. Never hand-edit on the box.
#
# The dashboard is a static build (BASE_PATH=/) served from disk. It calls the API
# at https://stillafloatcruising.com (CORS-enabled), so no /api proxy is needed here.
server {
    server_name dashboard.stillafloatcruising.com;

    root /root/saf-full/dashboard/dist/public;
    index index.html;

    # ── mTLS client-certificate gate ──────────────────────────────────────────
    # Only devices holding a client cert signed by our private CA may load the
    # dashboard. Phase 1 = "optional": the site still serves without a cert (no
    # lockout) but $ssl_client_verify records the result, so we can confirm each
    # device presents a valid cert before flipping to "on" (enforce).
    ssl_client_certificate /etc/nginx/saf-dashboard-ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;
    add_header X-Client-Cert-Verify $ssl_client_verify always;

    # Probe endpoint to confirm a device's cert is accepted during rollout.
    location = /whoami-cert {
        default_type text/plain;
        return 200 "verify=$ssl_client_verify\ndn=$ssl_client_s_dn\n";
    }

    # SPA: serve the file if it exists, else fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dashboard.stillafloatcruising.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dashboard.stillafloatcruising.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirect http -> https for the dashboard subdomain.
server {
    listen 80;
    server_name dashboard.stillafloatcruising.com;
    return 301 https://$host$request_uri;
}
