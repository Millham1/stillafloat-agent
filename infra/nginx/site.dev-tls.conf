# Still Afloat — the dev mirror over HTTPS (dev box only, once its certificate exists).
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/site.dev-tls.conf.
# Installed as /etc/nginx/conf.d/saf-dev-tls.conf by infra/deploy-nginx.sh when
# /etc/letsencrypt/live/dev.stillafloatcruising.com exists; removed when it does not (nginx -t fails on a missing cert file).
#
# This block only ends the encrypted connection and hands the request to the dev site on this box's own port 80
# (site.dev.conf), so every route, header and rule of the dev mirror stays in ONE place.
#   Host 127.0.0.1         the dev site answers only its own addresses (any other name is sent to the live site)
#   X-Forwarded-For        the visitor's address. The dev site then reports this box (loopback) as X-Real-IP, and the app
#                          reads X-Forwarded-For when X-Real-IP is loopback (lib/client-ip.ts), so each visitor keeps
#                          their own sign-up limits. A value the visitor sends is replaced, never passed on.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.stillafloatcruising.com;

    ssl_certificate     /etc/letsencrypt/live/dev.stillafloatcruising.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.stillafloatcruising.com/privkey.pem;

    # the largest and slowest request the dev site takes (voice-note transcription, site.dev.conf)
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect http://127.0.0.1/ /;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
