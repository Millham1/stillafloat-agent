# Still Afloat — dev box, once its certificate exists: the group page opened by the box's NUMBER goes to the secure name.
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/dev-secure-group-link.conf.
# Installed as /etc/nginx/snippets/saf-dev-secure-group-link.conf by infra/deploy-nginx.sh and pulled into site.dev.conf's
# server block by its `include /etc/nginx/snippets/saf-dev-secure-*.conf;` (a pattern that matches nothing is not an error).
#
# The poster and the Facebook post for the dev walk link http://178.156.154.144/group.html?g=…; a guest who follows them
# lands on the secure address before typing anything. Only this one page, only when asked for by the number: the box's own
# calls (127.0.0.1, the release gate) and the HTTPS block (Host 127.0.0.1) are served as before.
location = /group.html {
    if ($host = "178.156.154.144") {
        return 301 https://dev.stillafloatcruising.com$request_uri;
    }
    try_files $uri =404;
}
