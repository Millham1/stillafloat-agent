# Still Afloat — main site vhost (PRODUCTION).
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/site.prod.conf.
# Installed as /etc/nginx/sites-enabled/default by infra/deploy-nginx.sh.
# NEVER hand-edit on the box.
#
# Faithful reproduction of the prior Certbot-managed vhost, with two changes:
#   1. All upstreams use 127.0.0.1, not localhost. The app listens on 0.0.0.0
#      (IPv4 only); when nginx resolved localhost to IPv6 ::1 it got
#      "connect() failed (111: Connection refused)" -> intermittent 503.
#   2. A webroot ACME-challenge location so Certbot can renew via the webroot
#      authenticator without ever editing this file.

# Plain-HTTP default server — non-domain hosts / direct-IP access. Serves the site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Foreign domain names pointed at this box get a permanent redirect to the
    # canonical site. 2026-09-29: scrapemafia.com resolved here and this block
    # served it the whole site, so ChatGPT sent readers to our pages under that
    # name. Direct-IP, localhost and WireGuard access keep working — the notes
    # app and /state, /finance callers use the IP, and deploy-nginx.sh's smoke
    # test requests http://localhost/.
    if ($host !~* ^(localhost|127\.0\.0\.1|\[::1\]|5\.161\.52\.102|10\.88\.0\.\d+)$) {
        return 301 https://stillafloatcruising.com$request_uri;
    }

    root /root/saf-full/server/public;
    index index.html index.htm index.nginx-debian.html;

    include snippets/ideas-state.conf;

    location / {
        try_files $uri $uri/ =404;
    }
    # Voice-note transcription — the one /api call that is neither small nor
    # quick. Whisper runs on this box's CPU (ops-manager agent/transcribe.py),
    # so the request carries a base64 recording and then waits minutes for the
    # answer. Under the generic /api/ rules below that is two guaranteed
    # failures: nginx's 1 MB default body cap 413s anything past ~45 seconds of
    # audio, and the 120 s read timeout 504s the wait itself. Exact-match, so it
    # wins over the /api/ prefix and nothing else inherits these limits.
    location = /api/transcribe {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 30M;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
    # Dashboard shell + build files on this host. 2026-10-19: a tab opened after
    # four deploys went blank. The shell (index.html) was kept by the browser with
    # no Cache-Control and named hashed bundle files the deploy had already
    # replaced; the catch-all below then answered each missing file with the shell
    # itself (HTTP 200, text/html), which the browser refuses as a script. So:
    # the shell is revalidated on every load, hashed files are immutable, and a
    # hashed file that is not there is a plain 404 (no fallback to the shell).
    location = /dashboard/index.html {
        alias /root/saf-full/dashboard/dist/public/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location /dashboard/assets/ {
        alias /root/saf-full/dashboard/dist/public/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location /dashboard/ {
        alias /root/saf-full/dashboard/dist/public/;
        try_files $uri $uri/ /dashboard/index.html;
    }
}

# HTTPS catch-all. Without it the canonical server below was also the implicit
# default for :443 and answered any name with the full site (same 2026-09-29
# finding). Foreign names and bare-IP https get a permanent redirect instead.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/stillafloatcruising.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stillafloatcruising.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://stillafloatcruising.com$request_uri;
}

# HTTPS — the canonical site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.stillafloatcruising.com stillafloatcruising.com;

    ssl_certificate /etc/letsencrypt/live/stillafloatcruising.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stillafloatcruising.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /root/saf-full/server/public;
    index index.html index.htm index.nginx-debian.html;

    include snippets/ideas-state.conf;
    include snippets/editorial-3003.conf;

    # News listing pages are regenerated in place hourly by the pre-renderer.
    # Without Cache-Control, Safari's heuristic caching could re-serve a stale
    # copy for hours ("quirky More News" behavior). no-cache = revalidate every
    # load; unchanged pages still answer with a cheap 304.
    location ~ ^/(es/)?news\.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ =404;

        location /upload {
            proxy_pass http://127.0.0.1:3001/upload;
            client_max_body_size 10M;
        }
        location /images/ {
            alias /var/www/html/images/;
        }
    }
    # Voice-note transcription — the one /api call that is neither small nor
    # quick. Whisper runs on this box's CPU (ops-manager agent/transcribe.py),
    # so the request carries a base64 recording and then waits minutes for the
    # answer. Under the generic /api/ rules below that is two guaranteed
    # failures: nginx's 1 MB default body cap 413s anything past ~45 seconds of
    # audio, and the 120 s read timeout 504s the wait itself. Exact-match, so it
    # wins over the /api/ prefix and nothing else inherits these limits.
    location = /api/transcribe {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 30M;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
    # Brief v2 shell — same-origin brief (mirrors the dev-box test surface).
    # Deliberately NO sw.js: its cache-first worker must never register against
    # the website origin. brief.html is an empty shell; data is the token-gated /api.
    location ~ ^/(brief\.html|brief-manifest\.json|apple-touch-icon\.png|icon-192\.png|icon-512\.png)$ {
        root /root/saf-full/dashboard/public;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # Dashboard shell + build files on this host. 2026-10-19: a tab opened after
    # four deploys went blank. The shell (index.html) was kept by the browser with
    # no Cache-Control and named hashed bundle files the deploy had already
    # replaced; the catch-all below then answered each missing file with the shell
    # itself (HTTP 200, text/html), which the browser refuses as a script. So:
    # the shell is revalidated on every load, hashed files are immutable, and a
    # hashed file that is not there is a plain 404 (no fallback to the shell).
    location = /dashboard/index.html {
        alias /root/saf-full/dashboard/dist/public/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location /dashboard/assets/ {
        alias /root/saf-full/dashboard/dist/public/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location /dashboard/ {
        alias /root/saf-full/dashboard/dist/public/;
        try_files $uri $uri/ /dashboard/index.html;
    }
    # Group Bookings (Mark 2026-10-25): its own app at /groups/, for Mark only — his dashboard password at the door
    # ("only I have access to it"), his access key inside. Not part of the dashboard. Its code is its own repo, Millham1/saf-group-bookings, which each server deploys itself. HTTPS only (never the bare-IP :80 block).
    location = /groups { return 301 /groups/; }
    location /groups/assets/ {
        auth_basic "Still Afloat Group Bookings";
        auth_basic_user_file /etc/nginx/saf-dashboard.htpasswd;
        alias /root/saf-group-bookings/dist/public/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location /groups/ {
        auth_basic "Still Afloat Group Bookings";
        auth_basic_user_file /etc/nginx/saf-dashboard.htpasswd;
        alias /root/saf-group-bookings/dist/public/;
        try_files $uri $uri/ /groups/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

# HTTP for the domain: serve ACME challenges via webroot, redirect everything else.
server {
    listen 80;
    listen [::]:80;
    server_name www.stillafloatcruising.com stillafloatcruising.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Upload helper on :8080 (unchanged behavior; IPv4 upstream).
server {
    listen 8080;
    include snippets/ideas-state.conf;
    location /upload {
        proxy_pass http://127.0.0.1:3001/upload;
        client_max_body_size 10M;
    }
    location /images/ {
        root /var/www/html;
    }
}
