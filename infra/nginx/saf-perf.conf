# Still Afloat — performance + security (http context).
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/saf-perf.conf.
# Installed by infra/deploy-nginx.sh into /etc/nginx/conf.d/ (included by
# nginx.conf at the http level). NEVER hand-edit on the box.
#
# Fixes two Semrush site-audit findings that the app layer can't reach, because
# nginx serves the static site directly from server/public (only /api is proxied
# to Express):
#   1. Uncompressed CSS/JS — nginx.conf has `gzip on` but no gzip_types, so only
#      text/html was compressed. text/html is always gzipped implicitly; this
#      adds the static text assets.
#   2. Missing HSTS header.

# ── Compression ──────────────────────────────────────────────────────────────
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/xml
  application/rss+xml
  application/atom+xml
  application/manifest+json
  image/svg+xml
  font/woff2;

# ── HSTS ─────────────────────────────────────────────────────────────────────
# Inherited by every server block (none define their own add_header, so nginx's
# add_header inheritance is not reset). `always` sends it on error responses too.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
