# Still Afloat — the dev mirror's own NAME over plain HTTP (dev box only).
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/site.dev-name.conf.
# Installed as /etc/nginx/conf.d/saf-dev-name.conf by infra/deploy-nginx.sh on a box without the main TLS cert (dev).
#
# Mark 2026-11-14 ("why is the dev link not secure?" … "set it up before the walk"): an outside tester walks the group
# booking on dev and types personal details, so dev gets a name and a certificate. Over plain HTTP the name answers two
# things only: the certificate authority's challenge files (issue and renewal), and a redirect to HTTPS for everything else.
# The site itself is still the one server block in site.dev.conf; nothing is duplicated here.
server {
    listen 80;
    listen [::]:80;
    server_name dev.stillafloatcruising.com;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://dev.stillafloatcruising.com$request_uri;
    }
}
