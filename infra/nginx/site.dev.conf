# Still Afloat — main site vhost (DEV MIRROR).
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/site.dev.conf.
# Installed as /etc/nginx/sites-enabled/default by infra/deploy-nginx.sh on the
# dev box (no TLS cert -> dev variant). Mirrors prod routing over plain HTTP so
# the proxy / IPv4 behavior is testable end-to-end before prod.
#
# Note: the dev box's app listens on :5000 (prod is :3002). ideas-state.conf is
# prod-only and is NOT included here (it would fail nginx -t on dev). The news
# agent's editorial snippet (/review + /api/editorial-*) IS included — the dev
# box has carried it since 2026-10-02, and without the include the retired
# /editorial-queue.html hand-off and the review page 404 on dev (release gate
# news.agent-reachable-through-site, pages.crawl-policies-and-owner).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Only the box's own address, localhost and WireGuard may see the dev site.
    # 2026-09-29: applify.work resolved to this box and served the whole dev
    # mirror to the public web. Any other name is sent to the canonical site.
    if ($host !~* ^(localhost|127\.0\.0\.1|\[::1\]|178\.156\.154\.144|10\.88\.0\.\d+)$) {
        return 301 https://stillafloatcruising.com$request_uri;
    }

    # The dev mirror must never be indexed: it duplicates the live site and
    # carries unapproved drafts. Header on every response, and its own robots.txt
    # (the repo's robots.txt is the production one).
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    root /root/saf-full/server/public;
    index index.html index.htm index.nginx-debian.html;

    location / {
        try_files $uri $uri/ =404;
    }
    # Brief v2 shell — served from the dashboard's static dir so the brief is
    # testable on the dev box (the dashboard subdomain exists only on prod).
    # Deliberately NO sw.js: its cache-first worker must never register against
    # the website origin. brief.html is an empty shell; data is the token-gated /api.
    location ~ ^/(brief\.html|brief-manifest\.json|apple-touch-icon\.png|icon-192\.png|icon-512\.png)$ {
        root /root/saf-full/dashboard/public;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # Voice-note transcription — the one /api call that is neither small nor
    # quick. Whisper runs on this box's CPU (ops-manager agent/transcribe.py),
    # so the request carries a base64 recording and then waits minutes for the
    # answer. Under the generic /api/ rules below that is two guaranteed
    # failures: nginx's 1 MB default body cap 413s anything past ~45 seconds of
    # audio, and the 120 s read timeout 504s the wait itself. Exact-match, so it
    # wins over the /api/ prefix and nothing else inherits these limits.
    location = /api/transcribe {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 30M;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
    location /dashboard/ {
        alias /root/saf-full/dashboard/dist/public/;
        try_files $uri $uri/ /dashboard/index.html;
    }
    include snippets/editorial-3003.conf;
}
