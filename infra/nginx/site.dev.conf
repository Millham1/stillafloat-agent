# Still Afloat — main site vhost (DEV MIRROR).
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/site.dev.conf.
# Installed as /etc/nginx/sites-enabled/default by infra/deploy-nginx.sh on the
# dev box (no TLS cert -> dev variant). Mirrors prod routing over plain HTTP so
# the proxy / IPv4 behavior is testable end-to-end before prod.
#
# Note: the dev box's app listens on :5000 (prod is :3002). No external-snippet
# includes (ideas-state.conf is prod-only and would fail nginx -t on dev).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /root/saf-full/server/public;
    index index.html index.htm index.nginx-debian.html;

    location / {
        try_files $uri $uri/ =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
    location /dashboard/ {
        alias /root/saf-full/dashboard/dist/public/;
        try_files $uri $uri/ /dashboard/index.html;
    }
}
