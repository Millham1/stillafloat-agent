# Still Afloat — main site vhost (DEV MIRROR).
# SOURCE OF TRUTH: stillafloat-agent/infra/nginx/site.dev.conf.
# Installed as /etc/nginx/sites-enabled/default by infra/deploy-nginx.sh on the
# dev box (no TLS cert -> dev variant). Mirrors prod routing over plain HTTP so
# the proxy / IPv4 behavior is testable end-to-end before prod.
#
# Note: the dev box's app listens on :5000 (prod is :3002). No external-snippet
# includes (ideas-state.conf is prod-only and would fail nginx -t on dev).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /root/saf-full/server/public;
    index index.html index.htm index.nginx-debian.html;

    location / {
        try_files $uri $uri/ =404;
    }
    # Brief v2 shell — served from the dashboard's static dir so the brief is
    # testable on the dev box (the dashboard subdomain exists only on prod).
    # Deliberately NO sw.js: its cache-first worker must never register against
    # the website origin. brief.html is an empty shell; data is the token-gated /api.
    location ~ ^/(brief\.html|brief-manifest\.json|apple-touch-icon\.png|icon-192\.png|icon-512\.png)$ {
        root /root/saf-full/dashboard/public;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
    location /dashboard/ {
        alias /root/saf-full/dashboard/dist/public/;
        try_files $uri $uri/ /dashboard/index.html;
    }
}
