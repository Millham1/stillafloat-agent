name: Cabin concierge sweep

# The cabin concierge's full answer sweep: every combination of a visitor's answers on every ship (432,000 cases, over six minutes).
# Mark 2026-11-09: it guards the cabin concierge alone, so it runs when that code or its data changes, and once a night as a safety net,
# instead of on every commit (it was the whole of the unit-test time). The everyday suite skips it; this workflow sets CABIN_SWEEP=1.
on:
  push:
    branches: [ main, dev ]
    paths:
      - "server/src/lib/cabin-*"
      - "server/src/lib/concierge-*"
      - "server/src/lib/__fixtures__/cabin-*"
      - "server/public/**/room-concierge*"
      - ".github/workflows/cabin-sweep.yml"
  pull_request:
    branches: [ main, dev ]
    paths:
      - "server/src/lib/cabin-*"
      - "server/src/lib/concierge-*"
      - "server/src/lib/__fixtures__/cabin-*"
  schedule:
    - cron: "30 7 * * *"   # nightly, 2:30 AM Eastern (standard time)
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || (github.event_name == 'schedule' && 'dev' || github.ref_name) }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: |
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Unit tests with the cabin sweep
        env:
          CABIN_SWEEP: "1"
        run: pnpm --filter @workspace/api-server run test
