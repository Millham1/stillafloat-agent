name: Deploy Still Afloat (monorepo)

on:
  push:
    branches: [ main, dev ]

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 5.161.52.102
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/saf-full
            git fetch origin
            git reset --hard origin/main
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            corepack enable
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
            PORT=5000 BASE_PATH=/dashboard/ pnpm --filter @workspace/api-server run build:all
            pm2 restart saf-full-server
            pm2 save
            echo "monorepo deployment complete"

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.156.154.144
          username: root
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            corepack enable
            corepack prepare pnpm@9.15.0 --activate
            # one-time clone, reusing the GitHub auth the box already has for newsagent
            if [ ! -d /root/saf-full/.git ]; then
              echo "saf-full not present - cloning dev branch"
              NEWS_URL=$(git -C /root/stillafloat-newsagent remote get-url origin)
              MONO_URL=$(echo "$NEWS_URL" | sed 's/stillafloat-newsagent/stillafloat-agent/')
              git clone --branch dev "$MONO_URL" /root/saf-full
            fi
            cd /root/saf-full
            git fetch origin
            git reset --hard origin/dev
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
            PORT=5000 BASE_PATH=/dashboard/ pnpm --filter @workspace/api-server run build:all
            # start is gated: mirror+build now; start only once the isolated dev .env is in place
            if [ -f /root/saf-full/DEPLOY_DEV_START ]; then
              export PORT=5000 BASE_PATH=/dashboard/
              pm2 restart saf-full-server --update-env || pm2 start node --name saf-full-server --cwd /root/saf-full/server --update-env -- --enable-source-maps ./dist/index.mjs
              pm2 save
              echo "saf-full-server (dev) started"
            else
              echo "BUILT OK - saf-full-server NOT started (no DEPLOY_DEV_START flag). Add isolated .env + flag, then re-deploy."
            fi
            echo "monorepo dev deployment complete"
