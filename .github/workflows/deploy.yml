name: Deploy Still Afloat (monorepo)

on:
  push:
    branches: [ main, dev ]
  # Run the build/test gate on PRs too. Without this the ONLY time this workflow
  # ran was AFTER a merge to dev/main — so "test before merging" was impossible
  # and the loop was push-and-find-out. Both deploy jobs below are gated on
  # github.ref being a branch ref, which a pull_request event never is, so a PR
  # runs the gate and deploys nothing.
  pull_request:
    branches: [ main, dev ]

jobs:
  # CI gate: compile + bundle in GitHub Actions BEFORE any deploy. Both deploy
  # jobs `needs: build`, so broken code can never reach a server. Mirrors the
  # box's actual build command so a green gate guarantees a buildable deploy.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: |
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: Install (keeps lockfile in sync with manifests)
        run: pnpm install --no-frozen-lockfile
      - name: Commit synced lockfile (dev only)
        if: github.ref == 'refs/heads/dev'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync pnpm-lock.yaml [skip ci]"
            git push origin HEAD:dev || echo "lockfile push skipped (no write perms) — continuing"
          fi
      - name: Build (compile + bundle gate)
        env:
          PORT: "5000"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/api-server run build:all
      - name: Unit tests
        run: pnpm --filter @workspace/api-server run test

  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        with:
          host: 5.161.52.102
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: YOUTUBE_API_KEY
          script: |
            set -e
            # Publish the YouTube Data API key into the shared env (read by env.ts)
            # so the dashboard's YouTube panel works. Upsert; no-op if secret unset.
            if [ -n "${YOUTUBE_API_KEY}" ]; then
              SHARED=/opt/stillafloat/shared.env
              mkdir -p /opt/stillafloat; touch "$SHARED"
              grep -vE '^YOUTUBE_API_KEY=' "$SHARED" > "$SHARED.tmp" 2>/dev/null || true
              echo "YOUTUBE_API_KEY=${YOUTUBE_API_KEY}" >> "$SHARED.tmp"
              mv "$SHARED.tmp" "$SHARED"
              chmod 600 "$SHARED"
            fi
            cd /root/saf-full
            git fetch origin
            # Preserve the box-generated news listing pages across the reset.
            # They are written by the news pre-renderer (prerender-news.ts) and
            # untracked in git; the reset that removes their last tracked copies
            # would otherwise leave /news.html 404 until the on-boot prerender.
            mkdir -p /tmp/saf-prerender-keep/es
            cp server/public/news.html /tmp/saf-prerender-keep/ 2>/dev/null || true
            cp server/public/es/news.html /tmp/saf-prerender-keep/es/ 2>/dev/null || true
            git reset --hard origin/main
            [ -f server/public/news.html ] || cp /tmp/saf-prerender-keep/news.html server/public/ 2>/dev/null || true
            [ -f server/public/es/news.html ] || cp /tmp/saf-prerender-keep/es/news.html server/public/es/ 2>/dev/null || true
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            export CI=true  # non-interactive: auto-confirm pnpm's modules purge over SSH (no TTY)
            corepack enable
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
            # Dashboard is a standalone app at dashboard.stillafloatcruising.com (served
            # static at root by nginx); base must be "/" and it calls the live API origin.
            PORT=5000 BASE_PATH=/ VITE_API_BASE_URL=https://stillafloatcruising.com pnpm --filter @workspace/api-server run build:all
            pm2 restart saf-full-server
            pm2 save
            # Version-controlled dashboard subdomain nginx (no-op if no dashboard cert)
            bash infra/deploy-nginx.sh
            echo "monorepo deployment complete"

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        with:
          host: 178.156.154.144
          username: root
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: DEV_DATABASE_URL
          script: |
            set -e
            export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            corepack enable
            corepack prepare pnpm@9.15.0 --activate
            # one-time clone, reusing the GitHub auth the box already has for newsagent
            if [ ! -d /root/saf-full/.git ]; then
              echo "saf-full not present - cloning dev branch"
              NEWS_URL=$(git -C /root/stillafloat-newsagent remote get-url origin)
              MONO_URL=$(echo "$NEWS_URL" | sed 's/stillafloat-newsagent/stillafloat-agent/')
              git clone --branch dev "$MONO_URL" /root/saf-full
            fi
            cd /root/saf-full
            git fetch origin
            # Preserve box-generated news listing pages across the reset (see prod job).
            mkdir -p /tmp/saf-prerender-keep/es
            cp server/public/news.html /tmp/saf-prerender-keep/ 2>/dev/null || true
            cp server/public/es/news.html /tmp/saf-prerender-keep/es/ 2>/dev/null || true
            git reset --hard origin/dev
            [ -f server/public/news.html ] || cp /tmp/saf-prerender-keep/news.html server/public/ 2>/dev/null || true
            [ -f server/public/es/news.html ] || cp /tmp/saf-prerender-keep/es/news.html server/public/es/ 2>/dev/null || true
            export CI=true  # non-interactive: auto-confirm pnpm's modules purge over SSH (no TTY)
            pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
            # Dev build mirrors prod (base "/"); API stays relative so the dev mirror
            # never points at the prod API.
            PORT=5000 BASE_PATH=/ pnpm --filter @workspace/api-server run build:all
            # ---- runtime env ----
            # Canonical shared env (matches prod: env.ts reads /opt/stillafloat/shared.env).
            # One-time seed from the legacy newsagent .env if the shared file is absent.
            SHARED=/opt/stillafloat/shared.env
            if [ ! -f "$SHARED" ]; then
              mkdir -p /opt/stillafloat
              cp /root/stillafloat-newsagent/.env "$SHARED" 2>/dev/null || true
            fi
            chmod 600 "$SHARED" 2>/dev/null || true
            while IFS= read -r line; do
              case "$line" in ''|\#*) continue;; esac
              export "${line%%=*}=${line#*=}"
            done < "$SHARED"
            # monorepo-specific overrides (DB from encrypted GitHub secret)
            export DATABASE_URL="$DEV_DATABASE_URL"
            export PORT=5000
            export BASE_PATH=/
            # Dev ops-manager (saf-webhook) is gated + runs on :5001 (monorepo owns
            # :5000 on dev). Point the brief's ops feed at it so the sections light
            # up whenever the gated dev ops-manager is enabled.
            export OPS_MANAGER_URL=http://127.0.0.1:5001
            export DISABLE_YOUTUBE_SCAN=1
            unset NODE_ENV
            # NOTE (2026-07-04): schema is managed via supabase/migrations
            # (applied dev-first, then prod) — NOT drizzle. The drizzle schema is
            # empty, so "db push --force" DROPPED every table on the dev DB and wiped
            # it. Removed — do NOT reinstate. See supabase/migrations/README.md.
            # start/restart with the full env injected (CI always has DATABASE_URL now)
            pm2 restart saf-full-server --update-env || pm2 start node --name saf-full-server --cwd /root/saf-full/server --update-env -- --enable-source-maps ./dist/index.mjs
            pm2 save
            # Version-controlled dashboard subdomain nginx (no-op on dev — no dashboard cert)
            bash infra/deploy-nginx.sh
            echo "monorepo dev deployment complete"
