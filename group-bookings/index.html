<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Stale-shell guard: a page kept from before a deploy asks for bundle files that are gone; reload once. -->
    <script>
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (!t || t === window || !t.tagName) return;
        var u = t.src || t.href || '';
        if (!/\/assets\//.test(u)) return;
        if (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') return;
        try {
          var last = Number(sessionStorage.getItem('saf-gb-stale-reload') || 0);
          if (Date.now() - last < 60000) return;
          sessionStorage.setItem('saf-gb-stale-reload', String(Date.now()));
        } catch (_e) { return; }
        window.location.reload();
      }, true);
    </script>
    <title>Group Bookings | Still Afloat</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#07183f" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body style="background: hsl(222 47% 11%)">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
